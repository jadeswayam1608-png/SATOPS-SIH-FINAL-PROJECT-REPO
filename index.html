                </div>
              ) : (
                <div className="p-2.5 bg-slate-50 border border-gray-200 rounded text-center text-xs font-mono text-gray-600">
                  Click below to generate a real-time health summary from current telemetry.
                </div>
              )}
              <div className="flex items-center gap-2">
                <button
                  onClick={handleGenerateSummary}
                  className="btn-neo bg-slate-100 hover:bg-slate-200 text-[#0b0f19] px-3 py-1.5 rounded font-mono text-xs font-bold w-full"
                >
                  ⚡ Generate Live Health Summary
                </button>
              </div>
            </div>
          ) : (
            <div className="max-h-40 overflow-y-auto space-y-1.5 font-mono text-[10px] pr-1">
              {currentMission.fdRecommendations && currentMission.fdRecommendations.length > 0 ? (
                currentMission.fdRecommendations.map(rec => (
                  <div key={rec.id} className="p-1.5 rounded bg-slate-50 border border-gray-200 space-y-0.5">
                    <div className="flex justify-between items-center text-[9px]">
                      <span className={`px-1 rounded text-white font-bold ${
                        rec.level === 'CRITICAL' ? 'bg-rose-600' : rec.level === 'WARNING' ? 'bg-amber-600' : rec.level === 'SUGGESTION' ? 'bg-emerald-600' : 'bg-sky-600'
                      }`}>{rec.level}</span>
                      <span className="text-gray-500">{rec.time}</span>
                    </div>
                    <div className="font-bold text-gray-900 truncate">{rec.title}</div>
                    <div className="text-gray-600 text-[9.5px] line-clamp-2">{rec.message}</div>
                  </div>
                ))
              ) : (
                <div className="text-gray-400 text-center py-2">No alerts logged yet.</div>
              )}
            </div>
          )}

          {/* Quick Mission Conclude & Viva Action */}
          <div className="pt-2 border-t-2 border-[#0b0f19]">
            <button
              onClick={finishMissionRun}
              className="btn-neo bg-[#0b0f19] hover:bg-slate-800 text-white w-full py-2.5 rounded-lg font-mono text-xs font-black uppercase tracking-wider shadow-md flex items-center justify-center space-x-2"
            >
              <span>🏁 CONCLUDE PASS & START VIVA</span>
              <span className="text-cyan-400">→</span>
            </button>
            <div className="text-center font-mono text-[9px] text-gray-500 mt-1">
              Initiates Mission Professor evaluation based on live flight decisions.
            </div>
          </div>
        </div>
      );
    }



    // =========================================================================
    // 2. MISSION PROFESSOR (DYNAMIC POST-MISSION VIVA & LEARNING REPORT)
    // =========================================================================
    function MissionProfessorModal() {
      const {
        activeVivaModal,
        setActiveVivaModal,
        vivaMissionData,
        submitVivaResults,
        setView
      } = useContext(MissionContext);

      // Phase: 'briefing' -> 'viva' -> 'report'
      const [phase, setPhase] = useState('briefing');
      const [currentQIndex, setCurrentQIndex] = useState(0);
      const [studentConfidence, setStudentConfidence] = useState('High');
      const [selectedOption, setSelectedOption] = useState(null);
      const [customAnswerText, setCustomAnswerText] = useState('');
      const [isAnswerSubmitted, setIsAnswerSubmitted] = useState(false);
      const [answersHistory, setAnswersHistory] = useState([]);

      if (!activeVivaModal || !vivaMissionData) return null;

      // Dynamically generate viva questions tailored strictly to what happened in this flight!
      const questions = useMemo(() => {
        const minBatt = vivaMissionData.minBattery || 80;
        const contacts = vivaMissionData.groundContactsUsed || [];
        const rules = vivaMissionData.ruleViolations || [];
        const tasksCount = vivaMissionData.tasksCount || 0;

        return [
          {
            id: 'viva_power',
            topic: 'Power & Battery DoD Systems',
            conceptTag: 'ISRO URSC-PWR-402 // Li-ion DoD Safety Threshold',
            question: minBatt < 35 
              ? `During this orbital pass, your battery dropped to a low of ${minBatt.toFixed(1)}%. What critical electrochemical failure risk occurs if a satellite battery is continuously discharged past the 20% Depth-of-Discharge (DoD) floor?`
              : `Your satellite maintained a healthy minimum battery of ${minBatt.toFixed(1)}%. Why is restricting battery Depth-of-Discharge (DoD) to shallow cycles essential for LEO satellite design life?`,
            options: [
              {
                text: 'Deep discharge below 20% causes irreversible copper dendrite formation and rapid cathode degradation, drastically shortening battery cycle life.',
                isCorrect: true,
                rational: 'Correct! Lithium-ion pouch cells undergo severe chemical breakdown and potential short circuits if depleted below manufacturer DoD limits.'
              },
              {
                text: 'Deep discharge is harmless in space because solar radiation automatically neutralizes battery cell imbalance.',
                isCorrect: false,
                rational: 'Incorrect. Solar radiation does not balance electrochemical cells; deep discharge causes permanent irreversible internal damage.'
              },
              {
                text: 'Depth of Discharge only affects geostationary satellites; low Earth orbit CubeSats are immune to cell degradation.',
                isCorrect: false,
                rational: 'Incorrect. LEO satellites experience 5,500+ eclipse cycles per year, making DoD control even more critical than GEO missions.'
              },
              {
                text: 'Discharging past 20% permanently freezes the solar array deployment spring mechanisms.',
                isCorrect: false,
                rational: 'Incorrect. Array deployment is a one-time mechanical event, whereas DoD is an electrochemical cell limitation.'
              }
            ],
            tip: 'Always schedule high-power payload tasks (like high-res cameras) during sunlight to avoid dipping into the 20% DoD margin.'
          },
          {
            id: 'viva_rf',
            topic: 'Ground Station Pass & Link Geometry',
            conceptTag: 'CCSDS 401.0-B-30 // RF & Modulation Systems',
            question: contacts.length > 0
              ? `Your mission successfully utilized passes over ${contacts.join(' & ')}. Why must flight controllers enforce a 5° to 10° horizon elevation mask before starting telemetry downlinks?`
              : 'Your spacecraft completed this pass without logging a ground station downlink. What operational risk arises when attempting to establish communication at very low elevation angles near the horizon?',
            options: [
              {
                text: 'Low elevation angles suffer severe tropospheric attenuation, multipath interference from terrain clutter, and rapid Doppler shifts that degrade link margin below lock threshold.',
                isCorrect: true,
                rational: 'Correct! Below 5-10° elevation, atmospheric noise and ground reflections corrupt the SNR, leading to massive packet loss.'
              },
              {
                text: 'Because ground station parabolic dishes cannot physically rotate in azimuth below 15°.',
                isCorrect: false,
                rational: 'Incorrect. Ground station pedestal rotors can tilt down to 0°, but atmospheric physics prevents clean signal reception.'
              },
              {
                text: 'Because satellite transponders automatically switch to safe mode when passing beneath 10° elevation.',
                isCorrect: false,
                rational: 'Incorrect. The satellite does not know the ground station local horizon; the restriction is enforced on the ground control side.'
              },
              {
                text: 'To save electricity at the ground station facility during off-peak pass windows.',
                isCorrect: false,
                rational: 'Incorrect. Elevation gating is purely governed by RF link budget and atmospheric absorption physics.'
              }
            ],
            tip: 'Wait until the elevation angle exceeds 10° to command high-rate dumps for maximum bit-error-rate (BER) margin.'
          },
          {
            id: 'viva_thermal',
            topic: 'Orbital Thermal & Eclipse Shedding',
            conceptTag: 'ECSS-E-ST-31C // Spacecraft Thermal Control',
            question: 'During orbital night (eclipse), your spacecraft generated 0.0W solar power while radiating heat into deep space (-270°C). What power and thermal management step must be prioritized?',
            options: [
              {
                text: 'Inhibit non-essential payload operations, shed auxiliary loads, and activate battery survival heaters to maintain cell temperatures above -5°C.',
                isCorrect: true,
                rational: 'Correct! Radiative cooling in umbra can drop battery temperatures below safe operational limits, requiring load shedding and survival heating.'
              },
              {
                text: 'Turn off the onboard computer completely and wait for the sun to heat the chassis on the next daylight pass.',
                isCorrect: false,
                rational: 'Incorrect. If the flight computer powers down without an automated watchdog timer, the satellite enters uncontrolled tumble.'
              },
              {
                text: 'Re-orient the antenna towards the moon to absorb lunar thermal radiation.',
                isCorrect: false,
                rational: 'Incorrect. Lunar thermal radiation is negligible and cannot offset deep-space radiative heat loss.'
              },
              {
                text: 'Increase radio transmitter power to maximum to heat the internal avionics chassis.',
                isCorrect: false,
                rational: 'Incorrect. Transmitter amplifiers are inefficient heaters and will drain the battery past the critical DoD limit.'
              }
            ],
            tip: 'Balance payload power schedules against eclipse duration (typically 35-37 minutes in 500km LEO).'
          },
          {
            id: 'viva_adcs',
            topic: 'Attitude Determination & Control (ADCS)',
            conceptTag: 'ISRO ISTRAC Spacecraft Control // Momentum Management',
            question: 'Why do CubeSat flight controllers use magnetic torque rods (magnetorquers) to desaturate reaction wheels rather than leaving wheels at maximum RPM?',
            options: [
              {
                text: 'Saturated reaction wheels cannot generate control torque in that axis, causing loss of pointing authority, and induce micro-vibrations that blur optical imaging.',
                isCorrect: true,
                rational: 'Correct! When reaction wheels reach maximum spin speed (saturation), they cannot absorb further disturbance torque; magnetorquers push against Earth magnetic field to dump that angular momentum.'
              },
              {
                text: 'Reaction wheels consume zero electrical power when spinning at maximum speed.',
                isCorrect: false,
                rational: 'Incorrect. High-speed wheels consume peak electrical power and risk bearing degradation.'
              },
              {
                text: 'Magnetorquers physically pull the spacecraft into lower orbital altitude.',
                isCorrect: false,
                rational: 'Incorrect. Magnetorquers only exert rotational torque against the geomagnetic field; they produce zero translational delta-V.'
              },
              {
                text: 'To charge the satellite battery using electromagnetic dynamo induction.',
                isCorrect: false,
                rational: 'Incorrect. Magnetorquers consume electrical power from the bus to generate a magnetic dipole.'
              }
            ],
            tip: 'Always schedule B-dot wheel desaturation before attempting high-precision coastal imaging tasks.'
          },
          {
            id: 'viva_safety',
            topic: 'Autonomous Flight Rules & Checklist Gating',
            conceptTag: 'SATOPS Rule Engine Standard // Deterministic Safety Gating',
            question: rules.length > 0
              ? `During this mission, rule alerts were logged (${rules.map(r => r.rule || r.id).join(', ')}). Why does the SATOPS Rule Engine enforce hard interlocks rather than soft warnings?`
              : `Your mission maintained clean rule compliance with 0 violations across all 5 operational rules. What is the fundamental purpose of Pre-Pass Telemetry Checklist Gating?`,
            options: [
              {
                text: 'In low Earth orbit, communication windows are brief (6-10 min). Deterministic gating prevents catastrophic irreversible commands (such as firing thrusters during antenna blackout or draining power in eclipse).',
                isCorrect: true,
                rational: 'Correct! Autonomous gating eliminates human error during high-stress ground pass acquisition windows.'
              },
              {
                text: 'To ensure the satellite automatically declines all commands from unauthorized ground stations.',
                isCorrect: false,
                rational: 'Incorrect. That is an encryption/authentication security function, not operational flight rule safety gating.'
              },
              {
                text: 'Because student operators are not allowed to control satellites without human flight director signatures.',
                isCorrect: false,
                rational: 'Incorrect. Autonomous rules exist to empower students to learn safe automated operations.'
              },
              {
                text: 'To artificially make satellite operations simulations more difficult for students.',
                isCorrect: false,
                rational: 'Incorrect. Hard flight rules are modeled directly on ISRO ISTRAC flight director operational mandates.'
              }
            ],
            tip: 'Always verify Rule 5 (Pre-Pass Checklist) before the T-0 acquisition of signal (AOS) mark.'
          }
        ];
      }, [vivaMissionData]);

      const currentQ = questions[currentQIndex];

      const handleOptionSelect = (idx) => {
        if (isAnswerSubmitted) return;
        setSelectedOption(idx);
      };

      const handleSubmitAnswer = () => {
        if (selectedOption === null && !customAnswerText.trim()) return;

        let isCorrect = false;
        let points = 0;
        let rational = '';

        if (selectedOption !== null) {
          const opt = currentQ.options[selectedOption];
          isCorrect = opt.isCorrect;
          points = isCorrect ? 20 : 0;
          rational = opt.rational;
        } else {
          // Custom answer heuristic evaluation
          const text = customAnswerText.toLowerCase();
          const keywords = ['copper', 'dendrite', 'cycle', 'damage', 'multipath', 'tropospheric', 'snr', 'elevation', 'heater', 'umbra', 'desaturate', 'momentum', 'interlock', 'gating', 'safety'];
          const matched = keywords.filter(k => text.includes(k));
          if (matched.length >= 2) {
            isCorrect = true;
            points = 20;
            rational = 'Great analytical synthesis! You correctly incorporated core physical principles into your explanation.';
          } else if (matched.length === 1) {
            isCorrect = true;
            points = 12;
            rational = 'Partially correct. You identified key mechanisms, but ensure you state the full failure pathway.';
          } else {
            isCorrect = false;
            points = 0;
            rational = 'Incomplete response. Revisit the operational standard to understand the physical failure modes.';
          }
        }

        const answerRecord = {
          questionId: currentQ.id,
          question: currentQ.question,
          topic: currentQ.topic,
          conceptTag: currentQ.conceptTag,
          studentAnswer: selectedOption !== null ? currentQ.options[selectedOption].text : customAnswerText,
          confidence: studentConfidence,
          isCorrect,
          points,
          rational,
          tip: currentQ.tip
        };

        setAnswersHistory(prev => [...prev, answerRecord]);
        setIsAnswerSubmitted(true);
      };

      const handleNextQuestion = () => {
        if (currentQIndex < questions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
          setSelectedOption(null);
          setCustomAnswerText('');
          setIsAnswerSubmitted(false);
        } else {
          setPhase('report');
        }
      };

      const handleSkip = () => {
        const skippedRecord = {
          questionId: currentQ.id,
          question: currentQ.question,
          topic: currentQ.topic,
          conceptTag: currentQ.conceptTag,
          studentAnswer: 'Skipped by Operator',
          confidence: studentConfidence,
          isCorrect: false,
          points: 0,
          rational: 'Question skipped during viva defense.',
          tip: currentQ.tip
        };
        setAnswersHistory(prev => [...prev, skippedRecord]);
        if (currentQIndex < questions.length - 1) {
          setCurrentQIndex(prev => prev + 1);
          setSelectedOption(null);
          setCustomAnswerText('');
          setIsAnswerSubmitted(false);
        } else {
          setPhase('report');
        }
      };

      // Calculate final viva metrics
      const vivaScore = useMemo(() => {
        return answersHistory.reduce((sum, a) => sum + a.points, 0);
      }, [answersHistory]);

      const handleFinalizeAndSave = () => {
        const strong = answersHistory.filter(a => a.isCorrect).map(a => a.topic);
        const weak = answersHistory.filter(a => !a.isCorrect).map(a => a.topic);

        const professorReport = {
          strongAreas: strong.length > 0 ? strong : ['Fundamental Satellite Dynamics'],
          weakAreas: weak.length > 0 ? weak : ['None - Flawless Viva Performance!'],
          recommendation: weak.length > 0 
            ? `Focus review on ${weak[0]} prior to conducting autonomous flight director sign-off.`
            : 'Cadet demonstrated mastery of operational spacecraft interlocks. Cleared for flight certification.'
        };

        submitVivaResults(vivaScore, answersHistory, professorReport);
        setActiveVivaModal(false);
      };

      return (
        <div className="fixed inset-0 bg-black/75 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="card-neo bg-white max-w-3xl w-full p-6 md:p-8 space-y-6 max-h-[92vh] overflow-y-auto border-4 border-[#0b0f19] shadow-[8px_8px_0px_#0b0f19]">
            
            {/* Modal Header */}
            <div className="flex items-center justify-between border-b-2 border-[#0b0f19] pb-4">
              <div className="flex items-center space-x-3">
                <div className="w-12 h-12 rounded-xl bg-black text-white flex items-center justify-center border-2 border-black shadow-[3px_3px_0px_#38bdf8]">
                  <span className="text-2xl">👨‍🏫</span>
                </div>
                <div>
                  <h3 className="font-display font-black text-xl text-[#0b0f19] uppercase tracking-tight">
                    MISSION PROFESSOR // VIVA EXAMINATION
                  </h3>
                  <div className="font-mono text-xs text-gray-600 flex items-center gap-2">
                    <span>Prof. Vikram (ISRO Senior Operations Scientist)</span>
                    <span>•</span>
                    <span className="text-emerald-700 font-bold">FLIGHT EVALUATION</span>
                  </div>
                </div>
              </div>
              <button
                onClick={() => setActiveVivaModal(false)}
                className="font-mono text-xl font-black text-gray-500 hover:text-black"
              >
                ✕
              </button>
            </div>

            {/* PHASE 1: BRIEFING OVERVIEW */}
            {phase === 'briefing' && (
              <div className="space-y-5">
                <div className="bg-sky-50 border-2 border-black p-4 rounded-xl space-y-2">
                  <div className="font-mono font-bold text-xs text-sky-900 uppercase">
                    🛰️ ORBITAL FLIGHT TELEMETRY ARCHIVE
                  </div>
                  <p className="font-sans text-sm text-gray-800 leading-relaxed">
                    "Cadet, your spacecraft has completed its orbital pass. Below is your actual flight telemetry debrief. To validate your Flight Readiness Review (FRR) score, you must now defend your real-time operational decisions before the academic board."
                  </p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 font-mono text-xs">
                  <div className="card-neo-sm p-3 bg-slate-50 border border-black">
                    <span className="text-gray-500 block text-[10px]">MISSION DURATION</span>
                    <span className="text-base font-black text-[#0b0f19]">{vivaMissionData.durationMin} MIN</span>
                  </div>
                  <div className="card-neo-sm p-3 bg-slate-50 border border-black">
                    <span className="text-gray-500 block text-[10px]">MIN BATTERY RECORDED</span>
                    <span className={`text-base font-black ${vivaMissionData.minBattery < 30 ? 'text-rose-600' : 'text-emerald-600'}`}>
                      {vivaMissionData.minBattery ? vivaMissionData.minBattery.toFixed(1) : '94.5'}%
                    </span>
                  </div>
                  <div className="card-neo-sm p-3 bg-slate-50 border border-black">
                    <span className="text-gray-500 block text-[10px]">GROUND PASSES LOCKED</span>
                    <span className="text-base font-black text-sky-600">
                      {vivaMissionData.groundContactsUsed?.length || 0} STATIONS
                    </span>
                  </div>
                  <div className="card-neo-sm p-3 bg-slate-50 border border-black">
                    <span className="text-gray-500 block text-[10px]">INITIAL FLIGHT SCORE</span>
                    <span className="text-base font-black text-[#0b0f19]">{vivaMissionData.flightScore || 85} / 100</span>
                  </div>
                </div>

                <div className="pt-3 flex justify-end">
                  <button
                    onClick={() => setPhase('viva')}
                    className="btn-neo bg-[#38bdf8] text-[#0b0f19] px-6 py-3 rounded-xl font-mono text-sm font-black uppercase tracking-wider shadow-md hover:bg-sky-300"
                  >
                    🎓 Start Interactive Viva Defense →
                  </button>
                </div>
              </div>
            )}

            {/* PHASE 2: INTERACTIVE VIVA */}
            {phase === 'viva' && (
              <div className="space-y-5">
                {/* Progress Strip */}
                <div className="flex items-center justify-between border-b border-gray-200 pb-2 font-mono text-xs">
                  <div className="flex items-center space-x-2">
                    <span className="badge-neo bg-black text-white px-2 py-0.5 font-bold">
                      QUESTION {currentQIndex + 1} OF {questions.length}
                    </span>
                    <span className="text-gray-600 font-bold uppercase">{currentQ.topic}</span>
                  </div>
                  <span className="text-[10px] text-gray-500 font-bold">{currentQ.conceptTag}</span>
                </div>

                {/* Question Box */}
                <div className="bg-slate-50 border-2 border-[#0b0f19] p-4 rounded-xl space-y-2">
                  <p className="font-sans font-bold text-sm md:text-base text-gray-900 leading-snug">
                    {currentQ.question}
                  </p>
                </div>

                {/* Answer Options */}
                <div className="space-y-2.5">
                  <div className="text-xs font-mono font-bold text-gray-700 flex justify-between items-center">
                    <span>SELECT BEST OPERATIONAL DEFENSE:</span>
                    <div className="flex items-center gap-1 text-[10px]">
                      <span className="text-gray-500">Cadet Confidence:</span>
                      {['Low', 'Medium', 'High'].map(c => (
                        <button
                          key={c}
                          onClick={() => setStudentConfidence(c)}
                          className={`px-1.5 py-0.5 rounded font-bold ${studentConfidence === c ? 'bg-black text-white' : 'bg-gray-200 text-gray-700'}`}
                        >
                          {c}
                        </button>
                      ))}
                    </div>
                  </div>

                  {currentQ.options.map((opt, oIdx) => (
                    <div
                      key={oIdx}
                      onClick={() => handleOptionSelect(oIdx)}
                      className={`p-3 rounded-lg border-2 cursor-pointer transition-all flex items-start space-x-3 text-xs md:text-sm font-sans ${
                        selectedOption === oIdx
                          ? isAnswerSubmitted
                            ? opt.isCorrect ? 'bg-emerald-50 border-emerald-600 text-emerald-950 font-bold' : 'bg-rose-50 border-rose-600 text-rose-950'
                            : 'bg-sky-50 border-black shadow-sm font-semibold'
                          : isAnswerSubmitted && opt.isCorrect
                            ? 'bg-emerald-50 border-emerald-600 font-bold'
                            : 'bg-white border-gray-300 hover:border-black'
                      }`}
                    >
                      <span className={`w-5 h-5 rounded-full border-2 flex items-center justify-center font-mono text-[10px] font-bold shrink-0 mt-0.5 ${
                        selectedOption === oIdx ? 'bg-black text-white border-black' : 'border-gray-400 text-gray-600'
                      }`}>
                        {String.fromCharCode(65 + oIdx)}
                      </span>
                      <span className="flex-1">{opt.text}</span>
                    </div>
                  ))}
                </div>

                {/* Custom Typing Field */}
                {!isAnswerSubmitted && (
                  <div className="space-y-1">
                    <div className="text-[10px] font-mono text-gray-500 uppercase font-bold">
                      Or formulate your own written defense:
                    </div>
                    <textarea
                      value={customAnswerText}
                      onChange={e => { setCustomAnswerText(e.target.value); setSelectedOption(null); }}
                      placeholder="Type your physical or operational rationale here..."
                      rows="2"
                      className="w-full p-2 border-2 border-gray-300 rounded font-mono text-xs focus:border-black outline-none"
                    ></textarea>
                  </div>
                )}

                {/* Evaluated Feedback */}
                {isAnswerSubmitted && (
                  <div className={`p-4 rounded-xl border-2 space-y-2 animate-fadeIn ${
                    answersHistory[answersHistory.length - 1]?.isCorrect
                      ? 'bg-emerald-50 border-emerald-600'
                      : 'bg-rose-50 border-rose-600'
                  }`}>
                    <div className="flex items-center justify-between">
                      <span className={`badge-neo px-2.5 py-1 text-xs font-black ${
                        answersHistory[answersHistory.length - 1]?.isCorrect ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'
                      }`}>
                        {answersHistory[answersHistory.length - 1]?.isCorrect ? '✓ CORRECT DEFENSE (+20 PTS)' : '✕ SUBOPTIMAL / INCORRECT (0 PTS)'}
                      </span>
                      <span className="font-mono text-xs text-gray-600 font-bold">
                        Cadet Confidence: {studentConfidence}
                      </span>
                    </div>

                    <p className="font-sans text-xs md:text-sm text-gray-900 font-semibold">
                      {answersHistory[answersHistory.length - 1]?.rational}
                    </p>

                    <div className="pt-2 border-t border-black/10 flex items-center justify-between text-[11px] font-mono text-gray-700">
                      <span>💡 <strong>OPERATIONAL TIP:</strong> {currentQ.tip}</span>
                    </div>
                  </div>
                )}

                {/* Footer Controls */}
                <div className="pt-3 border-t-2 border-[#0b0f19] flex items-center justify-between">
                  {!isAnswerSubmitted ? (
                    <>
                      <button
                        onClick={handleSkip}
                        className="btn-neo bg-gray-200 hover:bg-gray-300 text-black px-4 py-2 rounded-lg font-mono text-xs font-bold"
                      >
                        Skip Question
                      </button>
                      <button
                        onClick={handleSubmitAnswer}
                        disabled={selectedOption === null && !customAnswerText.trim()}
                        className="btn-neo bg-[#38bdf8] disabled:opacity-40 text-black px-6 py-2 rounded-lg font-mono text-xs font-black uppercase tracking-wider"
                      >
                        Submit Defense →
                      </button>
                    </>
                  ) : (
                    <button
                      onClick={handleNextQuestion}
                      className="btn-neo bg-[#0b0f19] text-white px-6 py-2.5 rounded-lg font-mono text-xs font-black uppercase tracking-wider ml-auto hover:bg-slate-800"
                    >
                      {currentQIndex < questions.length - 1 ? 'Next Question →' : 'View Learning Report Card →'}
                    </button>
                  )}
                </div>
              </div>
            )}

            {/* PHASE 3: FINAL LEARNING REPORT */}
            {phase === 'report' && (
              <div className="space-y-6">
                <div className="text-center space-y-1">
                  <div className="text-3xl">🎖️</div>
                  <h4 className="font-display font-black text-2xl uppercase tracking-tight text-[#0b0f19]">
                    FLIGHT DEBRIEF & LEARNING REPORT
                  </h4>
                  <p className="font-mono text-xs text-gray-600">
                    Official Student Satellite Flight Readiness Review (FRR) Evaluation
                  </p>
                </div>

                {/* Score Big Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 font-mono text-center">
                  <div className="card-neo p-4 bg-slate-50 border-2 border-black">
                    <span className="text-gray-500 text-xs block font-bold">FLIGHT OPS SCORE</span>
                    <span className="text-2xl font-black text-[#0b0f19]">{vivaMissionData.flightScore || 85} / 100</span>
                    <span className="text-[10px] text-gray-500 block mt-0.5">Real-time Telemetry (60%)</span>
                  </div>
                  <div className="card-neo p-4 bg-slate-50 border-2 border-black">
                    <span className="text-gray-500 text-xs block font-bold">VIVA KNOWLEDGE SCORE</span>
                    <span className="text-2xl font-black text-[#0b0f19]">{vivaScore} / 100</span>
                    <span className="text-[10px] text-gray-500 block mt-0.5">Professor Defense (40%)</span>
                  </div>
                  <div className="card-neo p-4 bg-cyan-50 border-2 border-black">
                    <span className="text-cyan-900 text-xs block font-bold">COMBINED FRR SCORE</span>
                    <span className="text-3xl font-black text-cyan-950">
                      {Math.round(((vivaMissionData.flightScore || 85) * 0.6) + (vivaScore * 0.4))} / 100
                    </span>
                    <span className="text-[10px] text-cyan-800 font-bold block mt-0.5">
                      {Math.round(((vivaMissionData.flightScore || 85) * 0.6) + (vivaScore * 0.4)) >= 85 ? '✓ CERTIFIED FLIGHT DIRECTOR' : 'TRAINEE REVISION RECOMMENDED'}
                    </span>
                  </div>
                </div>

                {/* Competency Breakdown */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="card-neo p-4 bg-emerald-50/50 border-2 border-emerald-800 space-y-2">
                    <div className="font-mono font-bold text-xs text-emerald-900 flex items-center gap-1.5">
                      <span>✓ DEMONSTRATED STRONG AREAS</span>
                    </div>
                    <ul className="text-xs font-mono space-y-1 text-emerald-950">
                      {answersHistory.filter(a => a.isCorrect).map((a, i) => (
                        <li key={i} className="flex items-center gap-1.5">
                          <span className="text-emerald-600 font-bold">✓</span>
                          <span>{a.topic}</span>
                        </li>
                      ))}
                      {answersHistory.filter(a => a.isCorrect).length === 0 && (
                        <li className="text-gray-500">None identified during this session.</li>
                      )}
                    </ul>
                  </div>

                  <div className="card-neo p-4 bg-amber-50/50 border-2 border-amber-800 space-y-2">
                    <div className="font-mono font-bold text-xs text-amber-900 flex items-center gap-1.5">
                      <span>⚠️ CONCEPTS RECOMMENDED FOR REVISION</span>
                    </div>
                    <ul className="text-xs font-mono space-y-1 text-amber-950">
                      {answersHistory.filter(a => !a.isCorrect).map((a, i) => (
                        <li key={i} className="flex items-center gap-1.5">
                          <span className="text-rose-600 font-bold">✕</span>
                          <span>{a.topic}</span>
                        </li>
                      ))}
                      {answersHistory.filter(a => !a.isCorrect).length === 0 && (
                        <li className="text-emerald-700 font-bold">Flawless viva! No weak areas flagged.</li>
                      )}
                    </ul>
                  </div>
                </div>

                {/* Suggested Practice Missions */}
                <div className="bg-slate-50 border-2 border-black p-3.5 rounded-xl space-y-2">
                  <div className="font-mono font-bold text-xs text-gray-800">
                    🎯 RECOMMENDED NEXT PRACTICE DRILLS:
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <div className="p-2 rounded bg-white border border-gray-300 text-xs font-mono flex justify-between items-center">
                      <span>Emergency Drill #2: Solar Array Partial Shadow</span>
                      <span className="text-[10px] font-bold text-cyan-600">3.5 PTS</span>
                    </div>
                    <div className="p-2 rounded bg-white border border-gray-300 text-xs font-mono flex justify-between items-center">
                      <span>Emergency Drill #7: Reaction Wheel Desaturation</span>
                      <span className="text-[10px] font-bold text-cyan-600">3.5 PTS</span>
                    </div>
                  </div>
                </div>

                {/* Action Buttons */}
                <div className="pt-2 flex flex-wrap items-center justify-between gap-3">
                  <button
                    onClick={() => {
                      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(vivaMissionData, null, 2));
                      const downloadAnchor = document.createElement('a');
                      downloadAnchor.setAttribute("href", dataStr);
                      downloadAnchor.setAttribute("download", `SATOPS_Flight_Report_${vivaMissionData.id}.json`);
                      document.body.appendChild(downloadAnchor);
                      downloadAnchor.click();
                      downloadAnchor.remove();
                    }}
                    className="btn-neo bg-gray-100 hover:bg-gray-200 text-black px-4 py-2.5 rounded-lg font-mono text-xs font-bold"
                  >
                    📥 Download Report (JSON)
                  </button>

                  <div className="flex items-center gap-2">
                    
                    <button
                      onClick={handleFinalizeAndSave}
                      className="btn-neo bg-black text-white px-5 py-2.5 rounded-lg font-mono text-xs font-bold"
                    >
                      Finish & Close
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }



    // =========================================================================
    function App() {
      const {
        view,
        setView,
        studentScore,
        isDashboard,
        setIsDashboard
      } = useContext(MissionContext);

      const currentScore = studentScore !== undefined ? studentScore : 0;

      // =========================================================================
      // 1. INITIAL SCREEN: PURE HOME / LANDING SCREEN ONLY (NO DASHBOARD PARTS)
      // =========================================================================
      if (!isDashboard) {
        return (
          <div className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
            {/* Minimal Clean Header with SATOPS Logo on Landing Page */}
            <header className="pb-3 flex items-center justify-between">
              <div className="flex items-center space-x-2.5 select-none">
                <div className="w-10 h-10 shrink-0 [&>svg]:w-full [&>svg]:h-full shadow-[2px_2px_0px_#38bdf8] rounded-[9px] overflow-hidden">
                  <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="0" width="512" height="512" rx="110" fill="#12141a"/>
                    <ellipse cx="256" cy="256" rx="95" ry="32" transform="rotate(-18 256 256)" fill="none" stroke="#38bdf8" stroke-width="7"/>
                    <circle cx="256" cy="256" r="48" fill="#f8fafc"/>
                    <circle cx="346.35" cy="226.64" r="26" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4"/>
                    <circle cx="346.35" cy="226.64" r="15" fill="#38bdf8"/>
                  </svg>
                </div>
                <span className="font-display font-black text-2xl tracking-tighter text-[#0b0f19] uppercase block leading-none">
                  SATOPS
                </span>
              </div>
            </header>

            {/* Pure Home / Landing Screen */}
            <main>
              <OverviewSection />
            </main>
          </div>
        );
      }

      // =========================================================================
      // 2. SEPARATE SCREEN: FULL MISSION CONTROL DASHBOARD (ACCESSIBLE VIA GET STARTED)
      // =========================================================================
      const navTabs = [
        { id: 'planner', label: '02 // Mission Planner' },
        { id: 'rules', label: '03 // Rule Engine' },
        { id: 'drills', label: '04 // Emergency Drills' },
        { id: 'scorecard', label: `05 // Scorecard (${currentScore}/100)` },
        { id: 'learn', label: '06 // Knowledge Library' }
      ];

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
          {/* Dashboard Header Bar */}
          <header className="pb-3">
            <div className="flex flex-wrap items-center justify-between gap-4">
              {/* Logo + Name (Clicking returns to Home Landing screen) */}
              <div 
                onClick={() => {
                  setIsDashboard(false);
                  setView('overview');
                }}
                className="flex items-center space-x-2.5 cursor-pointer select-none group shrink-0"
                title="Return to Home Landing"
              >
                <div className="w-10 h-10 shrink-0 [&>svg]:w-full [&>svg]:h-full shadow-[2px_2px_0px_#38bdf8] group-hover:shadow-[3px_3px_0px_#38bdf8] rounded-[9px] overflow-hidden transition-all">
                  <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="0" width="512" height="512" rx="110" fill="#12141a"/>
                    <ellipse cx="256" cy="256" rx="95" ry="32" transform="rotate(-18 256 256)" fill="none" stroke="#38bdf8" stroke-width="7"/>
                    <circle cx="256" cy="256" r="48" fill="#f8fafc"/>
                    <circle cx="346.35" cy="226.64" r="26" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4"/>
                    <circle cx="346.35" cy="226.64" r="15" fill="#38bdf8"/>
                  </svg>
                </div>
                <span className="font-display font-black text-2xl tracking-tighter text-[#0b0f19] uppercase block leading-none">
                  SATOPS
                </span>
              </div>

              {/* Navigation Tabs - Centered, Bold & Single-Line */}
              <nav className="flex items-center justify-center space-x-2 sm:space-x-3 md:space-x-4 text-[11px] font-mono font-bold uppercase tracking-wider text-[#0b0f19] mx-auto overflow-x-auto">
                <button
                  onClick={() => {
                    setIsDashboard(false);
                    setView('overview');
                  }}
                  className="py-1 whitespace-nowrap transition-all font-extrabold text-[#0b0f19] hover:text-black hover:border-b-2 hover:border-black/60 cursor-pointer"
                  title="Return to Home Landing"
                >
                  01 // Home
                </button>
                {navTabs.map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setView(tab.id)}
                    className={`py-1 whitespace-nowrap transition-all cursor-pointer ${
                      view === tab.id 
                        ? 'border-b-2 border-black font-black text-black' 
                        : 'font-extrabold text-[#0b0f19] hover:text-black hover:border-b-2 hover:border-black/60'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* DASHBOARD DEPARTMENT VIEWS */}
          <main className="pt-2">
            {view === 'planner' && <PlannerSection />}
            {view === 'rules' && <RuleCheckerSection />}
            {view === 'drills' && <DrillsSection />}
            {view === 'scorecard' && <ScorecardSection />}
            {view === 'learn' && <LearnModuleSection />}
          </main>

          {/* SATOPS Mission Professor Viva Modal Overlay */}
          <MissionProfessorModal />

          {/* SATOPS AI Flight Operations Mentor Overlay */}
          <SatopsMentor />
        </div>
      );
    }
    // Root Render
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(
      <MissionProvider>
        <App />
      </MissionProvider>
    );
  </script>
</body>
</html>
