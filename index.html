      );
    }


    // ==========================================
    // 6. DEPARTMENT 2: MISSION CONTROL & PLANNER DECK
    // ==========================================
    function PlannerSection() {
      const { 
        tasks, 
        setTasks, 
        missionTimeSec, 
        setMissionTimeSec, 
        isPlaying,
        setIsPlaying,
        timeMultiplier,
        setTimeMultiplier,
        batteryPercent, 
        orbitState,
        solarArrayEfficiency, 
        activeContact,
        addLog,
        logs,
        setView,
        flightDirectorOpen,
        setFlightDirectorOpen,
        finishMissionRun,
        missionConfidence
      } = useContext(MissionContext);

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [newTaskType, setNewTaskType] = useState('TELEMETRY_PING');
      const [newTaskStartMin, setNewTaskStartMin] = useState(15);
      const [newTaskDurationMin, setNewTaskDurationMin] = useState(6);
      const [newTaskLabel, setNewTaskLabel] = useState('');
      const [newTaskStation, setNewTaskStation] = useState('GS_BLR');

      const totalPeriodSec = ORBITAL_PARAMS.periodSeconds;

      const handleAddTask = (e) => {
        e.preventDefault();
        const startSec = newTaskStartMin * 60;
        const endSec = startSec + (newTaskDurationMin * 60);
        const taskInfo = POWER_SPECS.tasks[newTaskType];
        
        const newTask = {
          id: `t-${Date.now()}`,
          type: newTaskType,
          startSec,
          endSec,
          targetStationId: newTaskType === 'DOWNLINK_DATA' || newTaskType === 'TELEMETRY_PING' ? newTaskStation : undefined,
          label: newTaskLabel || `${taskInfo.name} Pass`
        };

        setTasks(prev => [...prev, newTask]);
        addLog(`Scheduled task: ${newTask.label} at ${formatTime(startSec)}`, 'SCHEDULE');
        setIsModalOpen(false);
        setNewTaskLabel('');
      };

      const deleteTask = (id) => {
        setTasks(prev => prev.filter(t => t.id !== id));
      };

      const currentCursorPercent = ((missionTimeSec % totalPeriodSec) / totalPeriodSec) * 100;

      const chartPoints = useMemo(() => {
        const points = [];
        let simulatedBatt = 95.0;
        const totalSteps = 45;
        const stepSec = ORBITAL_PARAMS.periodSeconds / totalSteps;

        for (let i = 0; i <= totalSteps; i++) {
          const tSec = i * stepSec;
          const simOrbit = calculateOrbitState(tSec);
          const solarGen = simOrbit.isSunlit ? POWER_SPECS.solarGenerationSunlightWatts * solarArrayEfficiency : 0.0;
          
          const runningTasks = tasks.filter(t => tSec >= t.startSec && tSec <= t.endSec);
          const taskPower = runningTasks.reduce((sum, t) => sum + (POWER_SPECS.tasks[t.type]?.powerWatts || 0), 0);
          const totalLoad = POWER_SPECS.baseLoadWatts + taskPower;
          
          const netPowerWatts = solarGen - totalLoad;
          const deltaPercent = (netPowerWatts * stepSec / POWER_SPECS.batteryCapacityWattSec) * 100;
          simulatedBatt = Math.min(100, Math.max(5, simulatedBatt + deltaPercent));
          
          points.push({
            minute: Math.round(tSec / 60),
            battery: parseFloat(simulatedBatt.toFixed(1)),
            isSunlit: simOrbit.isSunlit
          });
        }
        return points;
      }, [tasks, solarArrayEfficiency]);

      const width = 600;
      const height = 180;
      const padX = 40;
      const padY = 25;

      const pathData = chartPoints.reduce((acc, pt, idx) => {
        const x = padX + (idx / (chartPoints.length - 1)) * (width - padX * 2);
        const y = height - padY - (pt.battery / 100) * (height - padY * 2);
        return idx === 0 ? `M ${x} ${y}` : `${acc} L ${x} ${y}`;
      }, '');

      const currentX = padX + ((missionTimeSec % ORBITAL_PARAMS.periodSeconds) / ORBITAL_PARAMS.periodSeconds) * (width - padX * 2);

      return (
        <div className="space-y-6">
          {/* Top Mission HUD Strip (Matching User Screenshot) */}
          <div className="card-neo p-4 flex flex-wrap items-center justify-between gap-4 text-xs font-mono font-bold">
            <div className="flex items-center gap-2">
              <span className="text-gray-600 uppercase">MISSION CLOCK:</span>
              <span className="text-base font-black text-[#0b0f19]">{formatTime(missionTimeSec)} UTC</span>
            </div>

            <div className="flex items-center gap-4">
              <div>
                <span className="text-gray-600">ORBIT: </span>
                <span className={`font-black ${orbitState.isSunlit ? 'text-amber-600' : 'text-slate-800'}`}>
                  {orbitState.isSunlit ? '☀️ SUNLIGHT (+18.0W CHARGING)' : '🌑 ECLIPSE (0W DISCHARGE)'}
                </span>
              </div>
              <div>
                <span className="text-gray-600">BATTERY: </span>
                <span className="text-emerald-600 font-black">{batteryPercent}%</span>
              </div>
              <div>
                <span className="text-gray-600">RULES: </span>
                <span className="text-emerald-600 font-black">✓ NOMINAL</span>
              </div>
            </div>

            
          </div>

          {/* Main Flight Operations Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Top Row Left (7 Cols): 3D CUBESAT ORBIT TRACK */}
            <div className="lg:col-span-7">
              <div className="card-neo p-5 bg-white h-full flex flex-col justify-between">
                <OrbitVisualizer />
              </div>
            </div>

            {/* Top Row Right (5 Cols): Subsystem Status & Log Card */}
            <div className="lg:col-span-5 space-y-4 flex flex-col justify-between">
              {flightDirectorOpen && <AIFlightDirectorPanel />}
              <div className="card-neo p-5 bg-white space-y-3">
                <div className="flex items-center justify-between border-b-2 border-[#0b0f19] pb-3">
                  <div>
                    <span className="font-display font-black text-sm uppercase tracking-wider text-[#0b0f19]">
                      SUBSYSTEM HEALTH MATRIX
                    </span>
                    <div className="font-mono text-[10px] text-gray-500">Live Health & Power Status</div>
                  </div>
                  <span className="badge-neo bg-[#10b981] text-white font-mono text-xs">ALL NOMINAL</span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <div className="card-neo-sm p-2.5 flex flex-col justify-between text-xs font-mono bg-slate-50">
                    <div className="flex items-center justify-between text-gray-600 text-[10px]">
                      <span>SOLAR EPS</span>
                      <span className="text-emerald-600 font-bold">100%</span>
                    </div>
                    <div className="font-bold text-sm text-[#0b0f19] mt-1">+18.0W INFLOW</div>
                    <div className="text-[9px] text-gray-500">Dual GaAs Arrays</div>
                  </div>

                  <div className="card-neo-sm p-2.5 flex flex-col justify-between text-xs font-mono bg-slate-50">
                    <div className="flex items-center justify-between text-gray-600 text-[10px]">
                      <span>ADCS REACTION</span>
                      <span className="text-emerald-600 font-bold">3-AXIS</span>
                    </div>
                    <div className="font-bold text-sm text-[#0b0f19] mt-1">0.05°/S SLEW</div>
                    <div className="text-[9px] text-gray-500">Nadir Pointing Locked</div>
                  </div>

                  <div className="card-neo-sm p-2.5 flex flex-col justify-between text-xs font-mono bg-slate-50">
                    <div className="flex items-center justify-between text-gray-600 text-[10px]">
                      <span>RF TRANSCEIVER</span>
                      <span className="text-sky-600 font-bold">S/X-BAND</span>
                    </div>
                    <div className="font-bold text-sm text-[#0b0f19] mt-1 truncate">{activeContact ? 'DOWNLINK ACTIVE' : 'CARRIER STANDBY'}</div>
                    <div className="text-[9px] text-gray-500 truncate">{activeContact ? activeContact.name : 'Awaiting Next Pass'}</div>
                  </div>

                  <div className="card-neo-sm p-2.5 flex flex-col justify-between text-xs font-mono bg-slate-50">
                    <div className="flex items-center justify-between text-gray-600 text-[10px]">
                      <span>OBDH / FLASH</span>
                      <span className="text-purple-600 font-bold">25.3%</span>
                    </div>
                    <div className="font-bold text-sm text-[#0b0f19] mt-1">32.4 / 128 MB</div>
                    <div className="text-[9px] text-gray-500">Payload Buffer Ready</div>
                  </div>
                </div>

                <div className="mt-3 pt-3 border-t-2 border-[#0b0f19]">
                  <div className="flex items-center justify-between font-mono text-xs font-bold text-gray-700 mb-1.5">
                    <span>REAL-TIME AUDIT LOG</span>
                    <span className="text-[10px] text-gray-500">AUTO-SCROLL</span>
                  </div>
                  <div className="bg-slate-950 text-slate-100 font-mono text-[10px] p-2.5 rounded-lg border-2 border-[#0b0f19] h-28 overflow-y-auto space-y-1">
                    {logs.map((log, idx) => (
                      <div key={idx} className="leading-tight">
                        <span className="text-cyan-400">{log.time}</span> <span className="text-gray-400">[{log.type}]</span> {log.text}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            {/* Bottom Row (12 Cols): GROUND STATION PASS TIMELINE & POWER INTEGRATOR */}
            <div className="lg:col-span-12 space-y-6">
              {/* Ground Station Pass Timeline */}
              <div className="card-neo p-5 md:p-6 bg-white space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2 border-b-2 border-[#0b0f19] pb-3">
                  <div>
                    <h3 className="font-display font-black text-xl uppercase tracking-tight text-[#0b0f19]">
                      GROUND STATION PASS TIMELINE
                    </h3>
                    <p className="font-mono text-xs text-gray-600">0 to 90 Minutes Orbital Period • Real-Time Satellite Tracking</p>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="badge-neo bg-amber-200 text-amber-950 px-2.5 py-1">☀️ Sunlight</span>
                    <span className="badge-neo bg-black text-white px-2.5 py-1">🌑 Eclipse</span>
                    <button
                      onClick={() => setIsModalOpen(true)}
                      className="btn-neo bg-[#38bdf8] text-[#0b0f19] px-3.5 py-1.5 text-xs font-bold ml-1"
                    >
                      + Add Task
                    </button>
                  </div>
                </div>

                {/* Sunlight / Eclipse Ribbon */}
                <div>
                  <div className="h-6 w-full rounded border-2 border-[#0b0f19] flex overflow-hidden font-mono text-[10px] font-bold">
                    <div 
                      className="bg-amber-300 flex items-center justify-center text-amber-950 border-r-2 border-[#0b0f19]"
                      style={{ width: `${ORBITAL_PARAMS.sunlightFraction * 100}%` }}
                    >
                      SUNLIGHT (+18.0W SOLAR ARRAY GENERATION)
                    </div>
                    <div 
                      className="bg-black text-white flex items-center justify-center"
                      style={{ width: `${(1 - ORBITAL_PARAMS.sunlightFraction) * 100}%` }}
                    >
                      ECLIPSE (UMBRA DISCHARGE ONLY)
                    </div>
                  </div>
                </div>

                {/* Ground Station Contact Horizon Bars */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 font-mono text-xs">
                  {GROUND_STATIONS.map((gs, idx) => (
                    <div key={gs.id} className="card-neo-sm p-3 flex items-center justify-between bg-slate-50 hover:bg-white transition-colors">
                      <div className="flex items-center gap-3">
                        <div className={`w-3 h-3 rounded-full ${gs.id === 'GS_SVL' ? 'bg-rose-500' : gs.id === 'GS_IITM' ? 'bg-emerald-500' : 'bg-amber-500'}`}></div>
                        <div>
                          <div className="font-bold text-gray-900">{gs.name}</div>
                          <div className="text-[10px] text-gray-500">{gs.code} • {gs.horizon}</div>
                        </div>
                      </div>
                      <span className="badge-neo bg-white text-gray-700 text-[10px]">
                        WINDOW {idx === 0 ? 'T+03:00 - T+10:00' : idx === 1 ? 'T+25:00 - T+35:00' : idx === 2 ? 'T+70:00 - T+80:00' : 'T+82:00 - T+89:00'}
                      </span>
                    </div>
                  ))}
                </div>

            </div>

              {/* Differential Battery Power Budget Chart */}
              <div className="card-neo p-5 md:p-6 bg-white space-y-4">
                <div className="flex items-center justify-between border-b-2 border-[#0b0f19] pb-3">
                  <div>
                    <h3 className="font-display font-black text-lg uppercase tracking-tight text-[#0b0f19]">
                      BATTERY STATE-OF-CHARGE (SoC) POWER INTEGRATOR
                    </h3>
                    <p className="font-sans text-xs text-gray-600">Continuous step integration with 20% DoD critical safe floor</p>
                  </div>
                  <span className="font-mono text-xl font-black text-[#0b0f19]">{batteryPercent}%</span>
                </div>

                <div className="bg-white border-2 border-[#0b0f19] rounded-md p-2">
                  <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-40 overflow-visible">
                    <rect
                      x={padX}
                      y={height - padY - (0.2 * (height - padY * 2))}
                      width={width - padX * 2}
                      height={0.2 * (height - padY * 2)}
                      fill="#fee2e2"
                      opacity="0.8"
                    />
                    <line
                      x1={padX}
                      y1={height - padY - (0.2 * (height - padY * 2))}
                      x2={width - padX}
                      y2={height - padY - (0.2 * (height - padY * 2))}
                      stroke="#f43f5e"
                      strokeWidth="1.5"
                      strokeDasharray="4 4"
                    />
                    <text x={width - padX - 5} y={height - padY - (0.2 * (height - padY * 2)) - 4} fill="#f43f5e" fontSize="9" fontWeight="bold" textAnchor="end" fontFamily="JetBrains Mono">
                      20% CRITICAL SAFE FLOOR
                    </text>

                    {[0, 25, 50, 75, 100].map(val => {
                      const y = height - padY - (val / 100) * (height - padY * 2);
                      return (
                        <g key={val}>
                          <line x1={padX} y1={y} x2={width - padX} y2={y} stroke="#e2e8f0" strokeWidth="1" />
                          <text x={padX - 8} y={y + 3} fill="#64748b" fontSize="9" textAnchor="end" fontFamily="JetBrains Mono">
                            {val}%
                          </text>
                        </g>
                      );
                    })}

                    <path d={pathData} fill="none" stroke="#0b0f19" strokeWidth="2.5" strokeLinecap="round" />
                    <line x1={currentX} y1={padY} x2={currentX} y2={height - padY} stroke="#38bdf8" strokeWidth="2" strokeDasharray="3 3" />
                    <circle cx={currentX} cy={height - padY - (batteryPercent / 100) * (height - padY * 2)} r="5" fill="#38bdf8" stroke="#0b0f19" strokeWidth="2" />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          {/* Add Task Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="card-neo bg-white max-w-md w-full p-6 space-y-4">
                <div className="flex items-center justify-between border-b-2 border-[#0b0f19] pb-3">
                  <h4 className="font-display font-black text-lg text-[#0b0f19] uppercase">Schedule Satellite Task</h4>
                  <button onClick={() => setIsModalOpen(false)} className="font-mono text-lg font-bold text-gray-600 hover:text-black">✕</button>
                </div>

                <form onSubmit={handleAddTask} className="space-y-3 font-sans">
                  <div>
                    <label className="block text-xs font-bold text-gray-800 mb-1">TASK TYPE</label>
                    <select 
                      value={newTaskType} 
                      onChange={e => setNewTaskType(e.target.value)}
                      className="w-full p-2 border-2 border-[#0b0f19] rounded font-mono text-xs bg-white"
                    >
                      {Object.entries(POWER_SPECS.tasks).map(([key, item]) => (
                        <option key={key} value={key}>{item.icon} {item.name} ({item.powerWatts}W, {item.storageRateMBps > 0 ? `+${item.storageRateMBps}MB/s` : `${item.storageRateMBps}MB/s`})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-800 mb-1">TASK LABEL / IDENTIFIER</label>
                    <input 
                      type="text"
                      placeholder="e.g. Polar Ocean Hyperspectral Scan"
                      value={newTaskLabel}

    // 7A. DEPARTMENT 3: RULE CHECKER ENGINE (5 RULES, EXPANDABLE)
    // ==========================================
    function RuleCheckerSection() {
      const { tasks, setTasks, batteryPercent, anomalies, setAnomalies, addLog } = useContext(MissionContext);
      const [expandedRules, setExpandedRules] = useState({});

      const toggleRule = (id) => {
        setExpandedRules(prev => ({
          ...prev,
          [id]: !prev[id]
        }));
      };

      const rules = useMemo(() => {
        const results = [];

        // Rule 1: Ground Station Exclusivity (COMMS)
        let hasExclusivityConflict = false;
        let conflictDetails = null;
        for (let i = 0; i < tasks.length; i++) {
          for (let j = i + 1; j < tasks.length; j++) {
            const t1 = tasks[i];
            const t2 = tasks[j];
            if (t1.type === 'DOWNLINK_DATA' && t2.type === 'DOWNLINK_DATA') {
              const overlap = !(t1.endSec <= t2.startSec || t1.startSec >= t2.endSec);
              if (overlap) {
                hasExclusivityConflict = true;
                conflictDetails = { t1, t2 };
                break;
              }
            }
          }
        }

        results.push({
          id: 'RULE_GS_EXCLUSIVITY',
          number: 1,
          name: 'Ground Station Exclusivity',
          category: 'COMMS',
          status: hasExclusivityConflict ? 'VIOLATION' : 'NOMINAL',
          summary: hasExclusivityConflict 
            ? 'Concurrent ground station pass overlap collision detected.' 
            : 'Single radio pipeline verified. No concurrent RF ground contacts.',
          description: hasExclusivityConflict 
            ? `Simultaneous downlink collision between "${conflictDetails.t1.label}" and "${conflictDetails.t2.label}". Single-antenna CubeSat transceivers cannot steer RF beams to dual ground stations simultaneously.` 
            : 'Single radio downlink pipeline verified. The spacecraft communicates through a single directional beam and cannot divide RF aperture between simultaneous ground stations.',
          remediation: hasExclusivityConflict ? 'Reschedule second downlink to next available contact window.' : null,
          fixAction: hasExclusivityConflict ? () => {
            setTasks(prev => prev.map(t => t.id === conflictDetails.t2.id ? { ...t, startSec: conflictDetails.t1.endSec + 120, endSec: conflictDetails.t1.endSec + 120 + (t.endSec - t.startSec) } : t));
            addLog('Auto-remediated Ground Station Exclusivity overlap.', 'RULE_FIX');
          } : null
        });

        // Rule 2: AOS/LOS Pass Horizon Alignment (ORBIT)
        let passViolation = false;
        let passTask = null;
        tasks.forEach(t => {
          if (t.type === 'DOWNLINK_DATA') {
            if (t.targetStationId === 'GS_BLR' && (t.startSec < 180 || t.endSec > 850)) {
              passViolation = true;
              passTask = t;
            }
            if (t.targetStationId === 'GS_IITM' && (t.startSec < 1350 || t.endSec > 2250)) {
              passViolation = true;
              passTask = t;
            }
          }
        });

        results.push({
          id: 'RULE_PASS_HORIZON',
          number: 2,
          name: 'AOS/LOS Pass Horizon Alignment',
          category: 'ORBIT',
          status: passViolation ? 'VIOLATION' : 'NOMINAL',
          summary: passViolation 
            ? 'Downlink scheduled outside valid line-of-sight elevation window (<10° mask).'
            : 'All scheduled ground contacts align strictly within line-of-sight AOS/LOS horizons (≥10° mask).',
          description: passViolation 
            ? `Downlink task "${passTask?.label}" falls outside valid ground track elevation window (<10° mask). Low elevation angles cause severe multipath packet corruption and atmospheric RF attenuation.` 
            : 'All scheduled ground contacts align strictly within validated line-of-sight AOS/LOS horizons (≥10° mask). Prevents radio transmission into terrain, obstacles, or atmospheric multipath interference.',
          remediation: passViolation ? 'Clamp downlink duration to fit inside the validated AOS-LOS window.' : null,
          fixAction: passViolation ? () => {
            setTasks(prev => prev.map(t => t.id === passTask.id ? { ...t, startSec: 1500, endSec: 2100 } : t));
            addLog('Auto-clamped pass window within AOS/LOS horizons.', 'RULE_FIX');
          } : null
        });

        // Rule 3: Battery Depth-of-Discharge (DoD) (POWER)
        const battCritical = batteryPercent < 20.0;
        const battWarning = batteryPercent < 35.0;
        results.push({
          id: 'RULE_BATTERY_DOD',
          number: 3,
          name: 'Battery Depth-of-Discharge (DoD)',
          category: 'POWER',
          status: battCritical ? 'VIOLATION' : (battWarning ? 'WARNING' : 'NOMINAL'),
          summary: battCritical 
            ? `CRITICAL: Battery level at ${batteryPercent}%. Violates 20% hard safe-floor!`
            : (battWarning 
              ? `CAUTION: Battery level at ${batteryPercent}%. Approaching minimum depth threshold.` 
              : `Battery capacity nominal at ${batteryPercent}%. Well above 20% critical threshold.`),
          description: battCritical
            ? `CRITICAL: Battery level at ${batteryPercent}%. Violates 20% hard safe-floor! Risk of Bus Under-Voltage Lockout (UVLO) and permanent copper-shunting cell reversal.`
            : (battWarning 
              ? `CAUTION: Battery level at ${batteryPercent}%. Approaching minimum depth-of-discharge threshold (35%). Monitor power draw closely during orbital eclipse.` 
              : `Battery capacity nominal at ${batteryPercent}%. Well above 20% critical threshold. Power bus margins are verified healthy for upcoming orbital night.`),
          remediation: battCritical || battWarning ? 'Shed non-essential high-power payload tasks (e.g. High-Res Optical).' : null,
          fixAction: battCritical || battWarning ? () => {
            setTasks(prev => prev.filter(t => t.type !== 'IMAGING_HIGHRES'));
            addLog('Shed high-power optical payload to protect battery DoD safe floor.', 'RULE_FIX');
          } : null
        });

        // Rule 4: Housekeeping Telemetry Precedence (PROTO)
        const firstDownlink = tasks.filter(t => t.type === 'DOWNLINK_DATA').sort((a,b) => a.startSec - b.startSec)[0];
        const firstPing = tasks.filter(t => t.type === 'TELEMETRY_PING').sort((a,b) => a.startSec - b.startSec)[0];
        const precedenceViolation = firstDownlink && (!firstPing || firstPing.startSec > firstDownlink.startSec);

        results.push({
          id: 'RULE_TELEMETRY_PRECEDENCE',
          number: 4,
          name: 'Housekeeping Telemetry Precedence',
          category: 'PROTO',
          status: precedenceViolation ? 'VIOLATION' : 'NOMINAL',
          summary: precedenceViolation
            ? 'High-speed downlink scheduled before vital housekeeping health verification ping.'
            : 'Pre-pass health verification order verified. Telemetry beacon precedes payload dump.',
          description: precedenceViolation
            ? 'High-speed downlink scheduled before vital housekeeping health verification ping. Spacecraft health, bus voltage, and thermal margins must be established before commanding high-rate payload transmitter.'
            : 'Pre-pass health verification order verified. Telemetry beacon precedes payload downlink, ensuring spacecraft bus, thermal, and attitude telemetry are nominal before high-power RF transmission.',
          remediation: precedenceViolation ? 'Inject housekeeping beacon ping at T+04:00 prior to data dump.' : null,
          fixAction: precedenceViolation ? () => {
            setTasks(prev => [
              { id: `t-ping-${Date.now()}`, type: 'TELEMETRY_PING', startSec: 240, endSec: 480, targetStationId: 'GS_BLR', label: 'Emergency Health Ping' },
              ...prev
            ]);
            addLog('Injected pre-pass telemetry health ping prior to bulk downlink.', 'RULE_FIX');
          } : null
        });

        // Rule 5: Pre-Pass Checklist Gating (SAFETY)
        const isPrePassGated = anomalies.prePassGated || false;
        results.push({
          id: 'RULE_PREPASS_GATE',
          number: 5,
          name: 'Pre-Pass Checklist Gating',
          category: 'SAFETY',
          status: isPrePassGated ? 'NOMINAL' : 'WARNING',
          summary: isPrePassGated
            ? 'Operator flight readiness checklist confirmed and gated for pass.'
            : 'Pre-pass flight operations readiness sign-off pending authorization.',
          description: isPrePassGated
            ? 'All pre-pass flight checklist items (ADCS nadir lock confirmation, ephemeris propagation sync, RF power amplifier thermal margin, ground antenna key verification) are fully gated.'
            : 'Pre-pass flight operations checklist sign-off is pending. Ground operators must affirmative-verify subsystem ephemeris sync, ADCS pointing readiness, and transmitter thermal limits before pass execution.',
          remediation: !isPrePassGated ? 'Execute pre-pass checklist authorization and sign-off on subsystem go/no-go gates.' : null,
          fixAction: !isPrePassGated ? () => {
            setAnomalies(prev => ({ ...prev, prePassGated: true }));
            addLog('Pre-Pass Checklist Gated: ADCS lock, Ephemeris sync, and RF link readiness verified.', 'RULE_FIX');
          } : null
        });

        return results;
      }, [tasks, batteryPercent, anomalies, setTasks, setAnomalies]);

      const violationCount = rules.filter(r => r.status === 'VIOLATION').length;
      const warningCount = rules.filter(r => r.status === 'WARNING').length;

      return (
        <div className="card-neo p-6 space-y-6">
          <div className="flex flex-wrap items-center justify-between border-b-2 border-[#0b0f19] pb-4 gap-4">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 bg-[#0b0f19] rounded-lg flex items-center justify-center text-white text-sm font-black font-mono">!</div>
              <div>
                <h3 className="font-display font-black text-xl uppercase tracking-tight text-[#0b0f19]">
                  Deterministic Aerospace Rule Engine (5 Rules)
                </h3>
                <p className="font-sans text-xs text-gray-600">Click any rule card to expand its full constraint details, technical rationale, and remediation.</p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <span className={`badge-neo ${violationCount > 0 ? 'bg-[#f43f5e] text-white' : 'bg-[#10b981] text-white'}`}>
                {violationCount > 0 ? `${violationCount} VIOLATIONS` : 'ALL 5 RULES NOMINAL'}
              </span>
              {warningCount > 0 && (
                <span className="badge-neo bg-[#f59e0b] text-[#0b0f19]">
                  {warningCount} WARNINGS
                </span>
              )}
            </div>
          </div>

          <div className="space-y-3.5">
            {rules.map(rule => {
              const isExpanded = !!expandedRules[rule.id];
              return (
                <div 
                  key={rule.id}
                  className={`rounded-lg border-2 transition-all ${
                    rule.status === 'VIOLATION' 
                      ? 'border-[#f43f5e] bg-red-50/50' 
                      : rule.status === 'WARNING' 
                        ? 'border-[#f59e0b] bg-amber-50/50' 
                        : 'border-[#0b0f19] bg-white'
                  }`}
                >
                  {/* Clickable Header for Expand/Collapse */}
                  <div 
                    onClick={() => toggleRule(rule.id)}
                    className="p-4 flex items-center justify-between cursor-pointer select-none hover:bg-slate-50/80 transition-colors rounded-lg gap-4"
                  >
                    <div className="flex items-center gap-3 flex-wrap flex-1">
                      <span className="w-7 h-7 rounded-md bg-[#0b0f19] text-white font-mono font-bold text-xs flex items-center justify-center shrink-0">
                        {rule.number}
                      </span>
                      <span className={`badge-neo shrink-0 ${
                        rule.status === 'VIOLATION' ? 'bg-[#f43f5e] text-white' : rule.status === 'WARNING' ? 'bg-[#f59e0b] text-[#0b0f19]' : 'bg-[#10b981] text-white'
                      }`}>
                        {rule.status}
                      </span>
                      <span className="badge-neo bg-slate-200 text-slate-800 text-[10px] shrink-0 font-mono">
                        {rule.category}
                      </span>
                      <span className="font-display font-bold text-base text-[#0b0f19]">
                        {rule.name}
                      </span>
                      <span className="font-sans text-xs text-gray-500 hidden md:inline truncate max-w-md">
                        — {rule.summary}
                      </span>
                    </div>

                    {/* Chevron Animation Indicator */}
                    <div className="flex items-center gap-2 shrink-0">
                      <span className="font-mono text-[11px] text-gray-400 font-bold uppercase hidden sm:inline">
                        {isExpanded ? "Collapse" : "Expand"}
                      </span>
                      <div className={`w-7 h-7 rounded-md border border-[#0b0f19]/30 flex items-center justify-center transition-transform duration-200 ${isExpanded ? 'rotate-180 bg-[#0b0f19] text-white' : 'bg-white text-[#0b0f19]'}`}>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                        </svg>
                      </div>
                    </div>
                  </div>

                  {/* Expandable Body */}
                  {isExpanded && (
                    <div className="px-5 pb-5 pt-2 border-t border-slate-200 space-y-3 bg-white/90 rounded-b-lg">
                      <div className="space-y-1.5 pt-2">
                        <div className="font-mono text-[11px] font-bold text-gray-500 uppercase tracking-wider">
                          Full Constraint Description & Flight Dynamics:
                        </div>
                        <p className="font-sans text-xs text-gray-800 leading-relaxed bg-slate-50 p-3 rounded-md border border-slate-200">
                          {rule.description}
                        </p>
                      </div>

                      {rule.remediation && (
                        <div className="p-3 bg-amber-50 border border-amber-300 rounded-md font-mono text-xs text-amber-950 flex items-start gap-2">
                          <span className="text-base shrink-0">💡</span>
                          <div>
                            <span className="font-bold uppercase tracking-wider">Operational Remediation:</span>
                            <div className="mt-0.5">{rule.remediation}</div>
                          </div>
                        </div>
                      )}

                      {rule.fixAction && (
                        <div className="pt-2 flex justify-end">
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              rule.fixAction();
                            }}
                            className="btn-neo bg-[#10b981] hover:bg-emerald-600 text-white px-5 py-2 text-xs font-bold flex items-center gap-2 shadow-sm"
                          >
                            <span>✓</span>
                            <span>Auto-Remediate Constraint (Apply Fix)</span>
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. DEPARTMENT 4: EMERGENCY DRILLS (20 SCENARIOS + 10 RAPID QUIZZES)
    // =========================================================================
    function DrillsSection() {
      const { drillAnswers, quizAnswers, submitDrillAnswer, submitQuizAnswer, studentScore, addLog } = useContext(MissionContext);
      
      const [activeTab, setActiveTab] = useState('drills'); // 'drills' | 'quizzes'
      const [subsystemFilter, setSubsystemFilter] = useState('ALL');
      const [activeDrillIndex, setActiveDrillIndex] = useState(null); // index into SATOPS_DRILLS_DATA or null

      const subsystems = ['ALL', 'COMMS', 'POWER', 'ADCS', 'THERMAL', 'CDH', 'PAYLOAD', 'SAFETY', 'STRUCTURES', 'PROPULSION', 'NAVIGATION', 'SPACE ENVIRONMENT'];

      const filteredDrills = useMemo(() => {
        if (subsystemFilter === 'ALL') return SATOPS_DRILLS_DATA;
        return SATOPS_DRILLS_DATA.filter(d => d.subsystem.toUpperCase() === subsystemFilter.toUpperCase());
      }, [subsystemFilter]);

      const currentDrill = activeDrillIndex !== null ? SATOPS_DRILLS_DATA[activeDrillIndex] : null;

      // Stats
      const completedDrillsCount = Object.keys(drillAnswers).length;
      const correctDrillsCount = Object.values(drillAnswers).filter(a => a.isCorrect).length;
      const completedQuizzesCount = Object.keys(quizAnswers).length;
      const correctQuizzesCount = Object.values(quizAnswers).filter(a => a.isCorrect).length;

      return (
        <div className="card-neo p-6 space-y-6">
          {/* Header Bar */}
          <div className="flex flex-wrap items-center justify-between border-b-2 border-[#0b0f19] pb-4 gap-4">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="w-3 h-3 rounded-full bg-red-500 animate-ping"></span>
                <h3 className="font-display font-black text-2xl uppercase tracking-tight text-[#0b0f19]">
                  Orbital Emergency Training Academy
                </h3>
              </div>
              <p className="font-sans text-xs text-gray-600">
                50 In-Orbit Spacecraft Contingency Drills + 20 Rapid Knowledge Quizzes for Student Satellite Operators
              </p>
            </div>

            {/* Scorecard Widget */}
            <div className="flex items-center gap-3 bg-slate-50 border-2 border-[#0b0f19] p-2.5 rounded-lg font-mono">
              <div className="text-right">
                <div className="text-[10px] text-gray-500 uppercase font-bold">Training Score</div>
                <div className="font-black text-xl text-[#0b0f19]">{studentScore} <span className="text-xs text-gray-500">/ 100</span></div>
              </div>
              <div className="h-8 w-[2px] bg-gray-300"></div>
              <div className="text-left text-[11px] space-y-0.5">
                <div>Drills: <span className="font-bold text-emerald-600">{correctDrillsCount}/50</span></div>
                <div>Quizzes: <span className="font-bold text-blue-600">{correctQuizzesCount}/20</span></div>
              </div>
            </div>
          </div>

          {/* Sub-Navigation Tabs */}
          <div className="flex items-center gap-3 border-b border-gray-300 pb-2">
            <button
              onClick={() => setActiveTab('drills')}
              className={`px-5 py-2.5 rounded-lg font-display font-black text-xs uppercase tracking-wider transition-all flex items-center gap-2 ${
                activeTab === 'drills' 
                  ? 'bg-black text-white shadow-[3px_3px_0px_#38bdf8]' 
                  : 'bg-white text-gray-700 border-2 border-gray-300 hover:border-black'
              }`}
            >
              <span>🚨 50 Emergency Anomaly Drills</span>
              <span className="badge-neo bg-[#f43f5e] text-white text-[10px] px-2 py-0.5">
                {correctDrillsCount}/50 Complete
              </span>
            </button>

            <button
              onClick={() => setActiveTab('quizzes')}
              className={`px-5 py-2.5 rounded-lg font-display font-black text-xs uppercase tracking-wider transition-all flex items-center gap-2 ${
                activeTab === 'quizzes' 
                  ? 'bg-black text-white shadow-[3px_3px_0px_#38bdf8]' 
                  : 'bg-white text-gray-700 border-2 border-gray-300 hover:border-black'
              }`}
            >
              <span>⚡ Rapid Knowledge Quizzes</span>
              <span className="badge-neo bg-[#38bdf8] text-black text-[10px] px-2 py-0.5">
                {correctQuizzesCount}/20 Complete
              </span>
            </button>
          </div>

          {/* TAB 1: 20 EMERGENCY DRILLS */}
          {activeTab === 'drills' && (
            <div className="space-y-5">
              {/* Filter Pills */}
              <div className="flex items-center gap-2 overflow-x-auto pb-1.5 scrollbar-thin">
                <span className="font-mono text-xs font-bold text-gray-500 uppercase mr-1 shrink-0">Subsystem:</span>
                {subsystems.map(sub => (
                  <button
                    key={sub}
                    onClick={() => setSubsystemFilter(sub)}
                    className={`px-3 py-1 rounded-full text-[11px] font-mono font-bold uppercase transition-all whitespace-nowrap ${
                      subsystemFilter === sub 
                        ? 'bg-[#0b0f19] text-white shadow-sm' 
                        : 'bg-gray-100 hover:bg-gray-200 text-gray-700'
                    }`}
                  >
                    {sub}
                  </button>
                ))}
              </div>

              {/* 20 Drills Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredDrills.map((drill) => {
                  const answer = drillAnswers[drill.id];
                  const realIndex = SATOPS_DRILLS_DATA.findIndex(d => d.id === drill.id);
                  return (
                    <div 
                      key={drill.id}
                      onClick={() => setActiveDrillIndex(realIndex)}
                      className={`card-neo-sm p-4 cursor-pointer hover:-translate-y-1 transition-all flex flex-col justify-between space-y-3 ${
                        answer?.isCorrect 
                          ? 'border-emerald-600 bg-emerald-50/30' 
                          : answer 
                            ? 'border-rose-500 bg-rose-50/30' 
                            : 'bg-white hover:border-[#38bdf8]'
                      }`}
                    >
                      <div className="space-y-2">
                        <div className="flex items-center justify-between gap-2">
                          <div className="flex items-center gap-2">
                            <span className="w-6 h-6 rounded bg-[#0b0f19] text-white font-mono text-xs font-bold flex items-center justify-center">
                              {drill.number}
                            </span>
                            <span className="badge-neo bg-slate-100 text-slate-800 text-[10px]">
                              {drill.subsystem}
                            </span>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <span className={`badge-neo text-[10px] ${
                              drill.severity === 'CRITICAL' ? 'bg-[#f43f5e] text-white' : drill.severity === 'HIGH' ? 'bg-[#f59e0b] text-[#0b0f19]' : 'bg-[#38bdf8] text-black'
                            }`}>
                              {drill.severity}
                            </span>
                            {answer ? (
                              <span className={`badge-neo text-[10px] ${answer.isCorrect ? 'bg-[#10b981] text-white' : 'bg-[#f43f5e] text-white'}`}>
                                {answer.isCorrect ? "✓ PASSED (+1.4)" : "✕ FAILED (0)"}
                              </span>
                            ) : (
                              <span className="badge-neo bg-gray-200 text-gray-700 text-[10px]">
                                PENDING (+1.4)
                              </span>
                            )}
                          </div>
                        </div>

                        <h4 className="font-display font-bold text-sm text-[#0b0f19] leading-snug">
                          {drill.title}
                        </h4>

                        <p className="font-sans text-xs text-gray-600 line-clamp-2 leading-relaxed">
                          {drill.scenario}
                        </p>
                      </div>

                      <div className="pt-2 border-t border-gray-200 flex items-center justify-between text-xs font-mono">
                        <span className="text-gray-500 truncate max-w-[200px]">
                          {drill.telemetry}
                        </span>
                        <span className="font-bold text-[#0b0f19] group-hover:underline flex items-center gap-1">
                          {answer ? "Review Drill" : "Engage Drill"} &rarr;
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB 2: RAPID KNOWLEDGE QUIZZES */}
          {activeTab === 'quizzes' && (
            <div className="space-y-6">
              <div className="p-4 bg-blue-50 border-2 border-blue-400 rounded-lg flex items-center justify-between">
                <div>
                  <h4 className="font-display font-bold text-sm text-blue-950 uppercase tracking-wide">
                    Rapid-Fire Spacecraft Operations Quizzes
                  </h4>
                  <p className="font-sans text-xs text-blue-800">
                    Quick-answer conceptual questions on orbital mechanics, battery constraints, communications, and emergency protocols. Each correct answer awards +1.5 PTS.
                  </p>
                </div>
                <div className="badge-neo bg-blue-600 text-white font-mono text-xs px-3 py-1 shrink-0">
                  {correctQuizzesCount}/20 Correct ({(correctQuizzesCount * 1.5).toFixed(1)} PTS)
                </div>
              </div>

              <div className="space-y-4">
                {SATOPS_QUIZZES_DATA.map((quiz, qIdx) => {
                  const answer = quizAnswers[quiz.id];
                  return (
                    <div key={quiz.id} className="card-neo-sm p-5 space-y-4 bg-white">
                      <div className="flex items-center justify-between gap-2 border-b border-gray-200 pb-2.5">
                        <div className="flex items-center gap-2">
                          <span className="w-6 h-6 rounded bg-black text-white font-mono text-xs font-bold flex items-center justify-center">
                            {qIdx + 1}
                          </span>
                          <span className="badge-neo bg-slate-200 text-slate-800 text-[10px]">
                            {quiz.category}
                          </span>
                        </div>
                        {answer && (
                          <span className={`badge-neo text-xs ${answer.isCorrect ? 'bg-[#10b981] text-white' : 'bg-[#f43f5e] text-white'}`}>
                            {answer.isCorrect ? "✓ CORRECT (+1.5 PTS)" : "✕ INCORRECT (0 PTS)"}
                          </span>
                        )}
                      </div>

                      <div className="font-display font-bold text-sm text-[#0b0f19] leading-snug">
                        {quiz.question}
                      </div>

                      {/* Options */}
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        {quiz.options.map((opt, optIdx) => {
                          const isSelected = answer?.optionIndex === optIdx;
                          const isTheCorrectOne = optIdx === quiz.correctIndex;
                          let btnStyle = "bg-white hover:bg-slate-50 border-[#0b0f19] text-gray-800";

                          if (answer) {
                            if (isSelected) {
                              btnStyle = answer.isCorrect 
                                ? "bg-[#10b981] text-white border-black font-bold shadow-sm" 
                                : "bg-[#f43f5e] text-white border-black font-bold shadow-sm";
                            } else if (isTheCorrectOne) {
                              btnStyle = "bg-emerald-50 border-2 border-emerald-500 text-emerald-950 font-bold";
                            } else {
                              btnStyle = "bg-gray-50 text-gray-400 border-gray-200 opacity-60";
                            }
                          }

                          return (
                            <button
                              key={optIdx}
                              disabled={!!answer}
                              onClick={() => submitQuizAnswer(quiz.id, optIdx, optIdx === quiz.correctIndex)}
                              className={`p-3 rounded-lg border-2 text-left font-sans text-xs transition-all flex items-start gap-2.5 ${btnStyle}`}
                            >
                              <span className="w-5 h-5 rounded-full border border-current flex items-center justify-center font-mono font-bold text-[10px] shrink-0 mt-0.5">
                                {String.fromCharCode(65 + optIdx)}
                              </span>
                              <span className="leading-snug">{opt}</span>
                            </button>
                          );
                        })}
                      </div>

                      {/* Explanation */}
                      {answer && (
                        <div className="p-3 bg-slate-50 border border-slate-300 rounded-md font-sans text-xs text-gray-800 space-y-1">
                          <span className="font-mono font-bold text-[10px] uppercase text-gray-500 tracking-wider">
                            Flight Controller Explanation:
                          </span>
                          <p className="leading-relaxed">{quiz.explanation}</p>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* INTERACTIVE DRILL MODAL (WHEN A DRILL IS OPENED) */}
          {currentDrill && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="bg-white border-4 border-[#0b0f19] rounded-xl shadow-[10px_10px_0px_#0b0f19] max-w-3xl w-full max-h-[92vh] overflow-y-auto p-6 space-y-5 animate-scale-in">
                
                {/* Modal Header */}
                <div className="flex items-start justify-between border-b-2 border-[#0b0f19] pb-3 gap-3">
                  <div>
                    <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                      <span className="badge-neo bg-[#0b0f19] text-white text-xs">
                        EMERGENCY DRILL #{currentDrill.number} OF 50
                      </span>
                      <span className="badge-neo bg-slate-200 text-slate-800 text-xs">
                        {currentDrill.subsystem}
                      </span>
                      <span className={`badge-neo text-xs ${
                        currentDrill.severity === 'CRITICAL' ? 'bg-[#f43f5e] text-white' : currentDrill.severity === 'HIGH' ? 'bg-[#f59e0b] text-[#0b0f19]' : 'bg-[#38bdf8] text-black'
                      }`}>
                        {currentDrill.severity} SEVERITY
                      </span>
                    </div>
                    <h3 className="font-display font-black text-xl text-[#0b0f19] leading-snug">
                      {currentDrill.title}
                    </h3>
                  </div>

                  <button
                    onClick={() => setActiveDrillIndex(null)}
                    className="w-9 h-9 rounded-lg bg-gray-100 hover:bg-black hover:text-white border-2 border-black flex items-center justify-center font-bold text-base transition-colors shrink-0"
                  >
                    ✕
                  </button>
                </div>

                {/* Telemetry Snapshot Terminal */}
                <div className="bg-[#0f172a] text-[#38bdf8] p-3.5 rounded-lg border-2 border-black font-mono text-xs space-y-1">
                  <div className="flex items-center justify-between text-[10px] text-gray-400 border-b border-slate-700 pb-1">
                    <span>🛰️ LIVE SATELLITE TELEMETRY BUS SNAPSHOT</span>
                    <span className="text-emerald-400">SYNC ACTIVE</span>
                  </div>
                  <div className="pt-1 text-slate-200 font-bold tracking-wide">
                    {currentDrill.telemetry}
                  </div>
                </div>

                {/* Emergency Scenario Briefing */}
                <div className="p-4 bg-amber-50/80 border-2 border-amber-500 rounded-lg space-y-1.5">
                  <div className="font-mono text-[11px] font-bold text-amber-900 uppercase tracking-wider flex items-center gap-1.5">
                    <span>⚠️</span>
                    <span>Situation Briefing & Anomaly Context:</span>
                  </div>
                  <p className="font-sans text-xs sm:text-sm text-gray-800 leading-relaxed">
                    {currentDrill.scenario}
                  </p>
                </div>

                {/* Question */}
                <div className="space-y-3">
                  <div className="font-mono text-xs font-bold text-gray-500 uppercase tracking-wider">
                    Operator Decision Prompt:
                  </div>
                  <h4 className="font-display font-bold text-base text-[#0b0f19]">
                    {currentDrill.question}
                  </h4>

                  {/* 4 MCQ Options */}
                  <div className="space-y-2.5 pt-1">
                    {currentDrill.options.map((option, oIdx) => {
                      const answer = drillAnswers[currentDrill.id];
                      const isSelected = answer?.optionIndex === oIdx;
                      const isCorrectAnswer = oIdx === currentDrill.correctIndex;

                      let style = "bg-white hover:bg-slate-50 border-[#0b0f19] text-gray-900 shadow-[2px_2px_0px_#0b0f19]";

                      if (answer) {
                        if (isSelected) {
                          style = answer.isCorrect 
                            ? "bg-[#10b981] text-white border-black shadow-[3px_3px_0px_#0b0f19]" 
                            : "bg-[#f43f5e] text-white border-black shadow-[3px_3px_0px_#0b0f19]";
                        } else if (isCorrectAnswer) {
                          style = "bg-emerald-50 border-2 border-emerald-600 text-emerald-950 font-bold shadow-sm";
                        } else {
                          style = "bg-gray-100 text-gray-400 border-gray-300 opacity-60";
                        }
                      }

                      return (
                        <button
                          key={oIdx}
                          disabled={!!answer}
                          onClick={() => submitDrillAnswer(currentDrill.id, oIdx, oIdx === currentDrill.correctIndex, currentDrill.title, currentDrill.subsystem)}
                          className={`w-full p-3.5 rounded-lg border-2 text-left font-sans text-xs sm:text-sm transition-all flex items-start gap-3 ${style}`}
                        >
                          <span className="w-6 h-6 rounded-md bg-black/10 border border-current flex items-center justify-center font-mono font-bold text-xs shrink-0 mt-0.5">
                            {String.fromCharCode(65 + oIdx)}
                          </span>
                          <span className="flex-1 leading-snug">{option}</span>
                          {answer && isSelected && (
                            <span className="font-mono text-xs font-bold shrink-0">
                              {answer.isCorrect ? "✓ CORRECT" : "✕ INCORRECT"}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Result Feedback Banner & Explanation */}
                {drillAnswers[currentDrill.id] && (
                  <div className="space-y-3 pt-2 animate-fade-slide-up">
                    <div className={`p-3.5 rounded-lg border-2 font-display font-bold text-xs sm:text-sm flex items-center justify-between ${
                      drillAnswers[currentDrill.id].isCorrect 
                        ? 'bg-emerald-100 border-emerald-600 text-emerald-950' 
                        : 'bg-rose-100 border-rose-600 text-rose-950'
                    }`}>
                      <span>
                        {drillAnswers[currentDrill.id].isCorrect ? "✓ CORRECT CONTINGENCY EXECUTED" : "✕ INCORRECT OPERATIONAL DECISION"}
                      </span>
                      <span className="font-mono font-black text-xs">
                        {drillAnswers[currentDrill.id].isCorrect ? "+1.4 PTS AWARDED" : "+0.0 PTS"}
                      </span>
                    </div>

                    <div className="p-4 bg-slate-50 border-2 border-[#0b0f19] rounded-lg space-y-1.5">
                      <div className="font-mono text-[11px] font-bold uppercase text-gray-500 tracking-wider flex items-center gap-1.5">
                        <span>💡</span>
                        <span>Aerospace Flight Controller Rationale & Recovery Protocol:</span>
                      </div>
                      <p className="font-sans text-xs sm:text-sm text-gray-800 leading-relaxed">
                        {currentDrill.explanation}
                      </p>
                    </div>
                  </div>
                )}

                {/* Modal Navigation Footer */}
                <div className="border-t-2 border-[#0b0f19] pt-4 flex flex-wrap items-center justify-between gap-3">
                  <button
                    disabled={activeDrillIndex === 0}
                    onClick={() => setActiveDrillIndex(prev => prev - 1)}
                    className="btn-neo bg-gray-200 disabled:opacity-40 text-black px-4 py-2 text-xs font-bold"
                  >
                    &larr; Previous Drill
                  </button>

                  <button
                    onClick={() => setActiveDrillIndex(null)}
                    className="btn-neo bg-white text-black px-4 py-2 text-xs font-bold"
                  >
                    Return to Fleet View
                  </button>

                  <button
                    disabled={activeDrillIndex === SATOPS_DRILLS_DATA.length - 1}
                    onClick={() => setActiveDrillIndex(prev => prev + 1)}
                    className="btn-neo bg-black text-white disabled:opacity-40 px-5 py-2 text-xs font-bold"
                  >
                    Next Drill &rarr;
                  </button>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 9. DEPARTMENT 5: DYNAMIC SCORECARD & SCORE HISTORY (0/100 BENCHMARK)
    // =========================================================================
    function ScorecardSection() {
      const { studentScore, drillAnswers, quizAnswers, scoreHistory, saveHistorySnapshot, resetTrainingSession, tasks, batteryPercent, storageUsedMB, addLog } = useContext(MissionContext);
      
      const [handoverNotes, setHandoverNotes] = useState('Completed student satellite flight drills. All safety constraints verified.');
      const [showResetConfirm, setShowResetConfirm] = useState(false);

      // Calculations
      const completedDrillsCount = Object.keys(drillAnswers).length;
      const correctDrillsCount = Object.values(drillAnswers).filter(a => a.isCorrect).length;
      const drillPoints = (correctDrillsCount * 1.4);

      const completedQuizzesCount = Object.keys(quizAnswers).length;
      const correctQuizzesCount = Object.values(quizAnswers).filter(a => a.isCorrect).length;
      const quizPoints = (correctQuizzesCount * 1.5);

      const totalAnswered = completedDrillsCount + completedQuizzesCount;
      const totalCorrect = correctDrillsCount + correctQuizzesCount;
      const accuracyRate = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;

      // Grade determination
      let grade = 'TRAINEE';
      let gradeColor = 'bg-gray-500 text-white';
      let statusLabel = 'INITIAL BENCHMARK';

      if (studentScore >= 85) {
        grade = 'FLIGHT DIRECTOR (GO FOR LAUNCH)';
        gradeColor = 'bg-[#10b981] text-white';
        statusLabel = 'CERTIFIED - FLIGHT QUALIFIED';
      } else if (studentScore >= 60) {
        grade = 'CERTIFIED SATELLITE OPERATOR';
        gradeColor = 'bg-[#38bdf8] text-black';
        statusLabel = 'NOMINAL PASS';
      } else if (studentScore >= 30) {
        grade = 'JUNIOR FLIGHT CONTROLLER';
        gradeColor = 'bg-[#f59e0b] text-[#0b0f19]';
        statusLabel = 'PROVISIONAL - DRILLS INCOMPLETE';
      } else {
        grade = 'TRAINEE OPERATOR (SIMULATION IN PROGRESS)';
        gradeColor = 'bg-slate-300 text-slate-800';
        statusLabel = 'INSUFFICIENT DRILLS COMPLETED';
      }

      const exportReportJSON = () => {
        const report = {
          system: 'ISRO SATOPS - Student Satellite Operations Certification',
          generatedAt: new Date().toISOString(),
          evaluationScore: studentScore,
          maxScore: 100,
          qualificationGrade: grade,
          status: statusLabel,
          accuracyRate: `${accuracyRate}%`,
          emergencyDrills: {
            completed: completedDrillsCount,
            totalAvailable: 50,
            correct: correctDrillsCount,
            pointsEarned: drillPoints,
            maxPoints: 70
          },
          rapidQuizzes: {
            completed: completedQuizzesCount,
            totalAvailable: 20,
            correct: correctQuizzesCount,
            pointsEarned: quizPoints,
            maxPoints: 30
          },
          scoreHistoryRecordCount: scoreHistory.length,
          handoverNotes,
          drillAnswersRecord: drillAnswers,
          quizAnswersRecord: quizAnswers
        };
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(report, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute('href', dataStr);
        downloadAnchor.setAttribute('download', `SATOPS_Scorecard_Certification_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        addLog('Exported Flight Certification Scorecard JSON.', 'SUCCESS');
      };

      return (
        <div className="card-neo p-6 space-y-8">
          {/* Header */}
          <div className="flex flex-wrap items-center justify-between border-b-2 border-[#0b0f19] pb-4 gap-4">
            <div>
              <h3 className="font-display font-black text-2xl uppercase tracking-tight text-[#0b0f19]">
                Flight Readiness Review (FRR) 100-Point Scorecard
              </h3>
              <p className="font-sans text-xs text-gray-600">
                Score starts at 0/100 and dynamically increases as you successfully complete Emergency Anomaly Drills & Knowledge Quizzes.
              </p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => saveHistorySnapshot()}
                className="btn-neo bg-white hover:bg-slate-100 text-black px-4 py-2 text-xs font-bold flex items-center gap-1.5"
              >
                <span>💾</span>
                <span>Log Session to History</span>
              </button>
              <button
                onClick={exportReportJSON}
                className="btn-neo bg-[#38bdf8] text-black px-4 py-2 text-xs font-bold flex items-center gap-1.5"
              >
                <span>📥</span>
                <span>Export Report (JSON)</span>
              </button>
            </div>
          </div>

          {/* Main 0/100 Score Display Banner */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-stretch">
            
            {/* Score Gauge Card */}
            <div className="card-neo-sm p-6 text-center bg-slate-50 flex flex-col justify-between space-y-4">
              <div className="font-mono text-xs text-gray-500 font-bold uppercase tracking-wider">
                CURRENT OPERATIONAL FLIGHT SCORE
              </div>

              <div className="py-2">
                <div className="font-display text-6xl font-black text-[#0b0f19] tracking-tight">
                  {studentScore}
                  <span className="text-2xl text-gray-400 font-sans font-normal ml-1">/ 100</span>
                </div>

                {/* Animated Progress Bar */}
                <div className="w-full bg-gray-200 h-3 rounded-full mt-4 overflow-hidden border border-black/30">
                  <div 
                    className="bg-[#10b981] h-full transition-all duration-500 ease-out"
                    style={{ width: `${Math.min(100, studentScore)}%` }}
                  ></div>
                </div>
              </div>

              <div>
                <span className={`badge-neo text-xs px-3 py-1 font-mono ${gradeColor}`}>
                  {grade}
                </span>
              </div>
            </div>

            {/* Performance Breakdown Cards */}
            <div className="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
              
              <div className="bg-white border-2 border-[#0b0f19] rounded-lg p-4 flex flex-col justify-between space-y-2">
                <div className="flex items-center justify-between text-xs font-mono">
                  <span className="font-bold text-gray-700">🚨 EMERGENCY DRILLS</span>
                  <span className="font-black text-[#0b0f19]">{drillPoints.toFixed(1)} / 70.0 PTS</span>
                </div>
                <div className="font-display font-black text-2xl text-[#0b0f19]">
                  {correctDrillsCount} <span className="text-xs text-gray-500 font-sans font-normal">/ 50 drills passed</span>
                </div>
                <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden border border-gray-300">
                  <div className="bg-[#f43f5e] h-full" style={{ width: `${(correctDrillsCount / 50) * 100}%` }}></div>
                </div>
                <div className="text-[11px] font-sans text-gray-500">
                  Each drill scenario carries 1.4 points. Total available: 70.0 PTS.
                </div>
              </div>

              <div className="bg-white border-2 border-[#0b0f19] rounded-lg p-4 flex flex-col justify-between space-y-2">
                <div className="flex items-center justify-between text-xs font-mono">
                  <span className="font-bold text-gray-700">⚡ RAPID KNOWLEDGE QUIZZES</span>
                  <span className="font-black text-[#0b0f19]">{quizPoints.toFixed(1)} / 30.0 PTS</span>
                </div>
                <div className="font-display font-black text-2xl text-[#0b0f19]">
                  {correctQuizzesCount} <span className="text-xs text-gray-500 font-sans font-normal">/ 20 quizzes passed</span>
                </div>
                <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden border border-gray-300">
                  <div className="bg-[#38bdf8] h-full" style={{ width: `${(correctQuizzesCount / 20) * 100}%` }}></div>
                </div>
                <div className="text-[11px] font-sans text-gray-500">
                  Each rapid quiz carries 1.5 points. Total available: 30.0 PTS.
                </div>
              </div>

              <div className="bg-white border-2 border-[#0b0f19] rounded-lg p-4 flex flex-col justify-between space-y-2">
                <div className="flex items-center justify-between text-xs font-mono">
                  <span className="font-bold text-gray-700">🎯 OPERATIONAL ACCURACY</span>
                  <span className="font-black text-[#0b0f19]">{accuracyRate}%</span>
                </div>
                <div className="font-display font-black text-2xl text-[#0b0f19]">
                  {totalCorrect} <span className="text-xs text-gray-500 font-sans font-normal">/ {totalAnswered} attempted</span>
                </div>
                <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden border border-gray-300">
                  <div className="bg-[#10b981] h-full" style={{ width: `${accuracyRate}%` }}></div>
                </div>
                <div className="text-[11px] font-sans text-gray-500">
                  Percentage of first-choice correct emergency responses.
                </div>
              </div>

              <div className="bg-white border-2 border-[#0b0f19] rounded-lg p-4 flex flex-col justify-between space-y-2">
                <div className="flex items-center justify-between text-xs font-mono">
                  <span className="font-bold text-gray-700">🛡️ FLIGHT STATUS</span>
                  <span className="badge-neo bg-[#10b981] text-white text-[10px]">ACTIVE</span>
                </div>
                <div className="font-display font-bold text-sm text-[#0b0f19]">
                  {statusLabel}
                </div>
                <div className="text-[11px] font-mono text-gray-500">
                  Battery: {batteryPercent}% | Storage: {storageUsedMB}MB
                </div>
                <div className="text-[10px] text-gray-400 font-mono">
                  Minimum 85/100 required for Autonomous Flight Director Sign-Off.
                </div>
              </div>

            </div>
          </div>

          {/* SCORE HISTORY FEATURE (REQUIREMENT 5) */}
          <div className="border-t-2 border-[#0b0f19] pt-6 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h4 className="font-display font-black text-lg text-[#0b0f19] uppercase tracking-tight flex items-center gap-2">
                  <span>📜</span>
                  <span>Mission Score History & Flight Debrief Log</span>
                </h4>
                <p className="font-sans text-xs text-gray-600">
                  Track your operational score improvements over previous training sessions and dates.
                </p>
              </div>

              <button
                onClick={() => setShowResetConfirm(true)}
                className="btn-neo bg-rose-50 hover:bg-rose-100 text-rose-700 border-rose-300 px-3 py-1.5 text-xs font-mono font-bold"
              >
                ↺ Reset Training Session
              </button>
            </div>

            {/* Reset Confirmation Modal */}
            {showResetConfirm && (
              <div className="p-4 bg-rose-50 border-2 border-rose-500 rounded-lg flex items-center justify-between gap-4">
                <div className="text-xs text-rose-950 font-sans">
                  <span className="font-bold">Reset Score to 0/100?</span> Your current progress ({studentScore} PTS) will be automatically archived into Score History before clearing.
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <button
                    onClick={() => {
                      resetTrainingSession();
                      setShowResetConfirm(false);
                    }}
                    className="btn-neo bg-[#f43f5e] text-white px-3 py-1 text-xs font-bold"
                  >
                    Confirm Reset
                  </button>
                  <button
                    onClick={() => setShowResetConfirm(false)}
                    className="btn-neo bg-white text-black px-3 py-1 text-xs"
                  >
                    Cancel
                  </button>
                </div>
              </div>
            )}

            {/* Score History Table or Empty State */}
            {scoreHistory.length === 0 ? (
              /* Requirement 5 Empty State */
              <div className="p-8 border-2 border-dashed border-gray-400 rounded-xl bg-slate-50/70 text-center space-y-2">
                <div className="text-3xl">📡</div>
                <h5 className="font-display font-bold text-sm text-gray-800 uppercase tracking-wider">
                  No Flight Drill History Recorded Yet
                </h5>
                <p className="font-sans text-xs text-gray-500 max-w-md mx-auto leading-relaxed">
                  Complete your first emergency drill or rapid quiz to log performance data. Your session scores will be automatically tracked here over time.
                </p>
              </div>
            ) : (
              <div className="overflow-x-auto border-2 border-[#0b0f19] rounded-lg bg-white">
                <table className="w-full text-left font-mono text-xs">
                  <thead className="bg-[#0b0f19] text-white uppercase text-[11px] font-bold">
                    <tr>
                      <th className="p-3">Session Date</th>
                      <th className="p-3">Score Achieved</th>
                      <th className="p-3">Drills Passed</th>
                      <th className="p-3">Accuracy</th>
                      <th className="p-3">Certification Level</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-200">
                    {scoreHistory.map((hist, hIdx) => (
                      <tr key={hist.id || hIdx} className="hover:bg-slate-50 transition-colors">
                        <td className="p-3 font-bold text-gray-800 whitespace-nowrap">
                          {hist.date}
                        </td>
                        <td className="p-3 font-black text-[#0b0f19] text-sm">
                          {hist.score} <span className="text-[10px] text-gray-500 font-normal">/ 100</span>
                        </td>
                        <td className="p-3 text-gray-700">
                          {hist.drillsCompleted || 0} drills ({hist.correctAnswers || 0} correct)
                        </td>
                        <td className="p-3">
                          <span className={`badge-neo text-[10px] ${
                            hist.score >= 85 ? 'bg-emerald-100 text-emerald-900' : hist.score >= 60 ? 'bg-blue-100 text-blue-900' : 'bg-amber-100 text-amber-900'
                          }`}>
                            {hist.correctAnswers && hist.drillsCompleted ? Math.round((hist.correctAnswers / Math.max(1, (hist.correctAnswers + (hist.incorrectAnswers || 0)))) * 100) : 0}%
                          </span>
                        </td>
                        <td className="p-3">
                          <span className="badge-neo bg-slate-100 text-slate-800 text-[10px]">
                            {hist.notes || "Recorded Benchmark"}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* Shift Handover Log Notes */}
          <div className="border-t-2 border-[#0b0f19] pt-4 space-y-2">
            <label className="block text-xs font-mono font-bold text-gray-800 uppercase tracking-wider">
              OPERATOR SHIFT HANDOVER LOG & DEBRIEF NOTES
            </label>
            <textarea
              rows="3"
              value={handoverNotes}
              onChange={e => setHandoverNotes(e.target.value)}
              className="w-full p-3 border-2 border-[#0b0f19] rounded-md font-mono text-xs focus:outline-none bg-white"
              placeholder="Record operational handover notes for incoming satellite operator shift..."
            />
          </div>
        </div>
      );
    }


    // ==========================================
    // 9A. SATOPS KNOWLEDGE BASE & SEARCH ENGINE
    // ==========================================
    const SATOPS_SOURCES = {
      ISRO_MAIN: {
        organization: 'ISRO',
        title: 'Indian Space Research Organisation - Official Portal',
        url: 'https://www.isro.gov.in/'
      },
      INSPACE_STUDENT: {
        organization: 'IN-SPACe',
        title: 'IN-SPACe Guidelines & Promotion of Student Satellite Missions',
        url: 'https://www.inspace.gov.in/'
      },
      ISTRAC_OPS: {
        organization: 'ISRO / ISTRAC',
        title: 'ISRO Telemetry, Tracking and Command Network (ISTRAC) Ground Segment',
        url: 'https://www.isro.gov.in/ISTRAC.html'
      },
      URSC_POWER_OBC: {
        organization: 'ISRO / URSC',
        title: 'U R Rao Satellite Centre (URSC) - Spacecraft Bus & Power Systems',
        url: 'https://www.ursc.gov.in/'
      },
      IIRS_EDUSAT: {
        organization: 'ISRO / IIRS',
        title: 'Indian Institute of Remote Sensing - Satellite Technology & Data Principles',
        url: 'https://www.iirs.gov.in/'
      },
      CCSDS_OPS: {
        organization: 'CCSDS',
        title: 'CCSDS 130.0-G-3: Overview of Space Communications Protocols',
        url: 'https://public.ccsds.org/'
      },
      CCSDS_RF: {
        organization: 'CCSDS',
        title: 'CCSDS 401.0-B: Radio Frequency and Modulation Systems for Earth Stations and Spacecraft',
        url: 'https://public.ccsds.org/'
      }
    };

    const SATOPS_LESSONS = [
      {
        id: 'lesson-1',
        number: '01',
        title: 'CubeSat Basics',
        definition: 'A CubeSat is a standardized miniaturized satellite built in cubic form factors based on a standard unit of 10x10x10 cm (1U, mass ~1.33 kg), scalable to configurations such as 2U, 3U, 6U, and 12U.',
        explanation: 'The standardized CubeSat architecture enables universities, student teams, and research institutions to develop low-cost space payloads using commercial off-the-shelf (COTS) subsystems and deploy via standardized launch interfaces (such as P-POD or PSLV stage deployers).',
        example: "ISRO PSLV missions have frequently deployed university student satellites (such as IIT Bombay's Pratham satellite and various student payloads hosted on the PSLV Orbital Experimental Module - POEM platform).",
        sources: [SATOPS_SOURCES.ISRO_MAIN, SATOPS_SOURCES.INSPACE_STUDENT]
      },
      {
        id: 'lesson-2',
        number: '02',
        title: 'AOS, LOS & Communication Passes',
        definition: "AOS (Acquisition of Signal) marks the timestamp when a satellite ascends above a ground station's minimum elevation mask, and LOS (Loss of Signal) marks the moment it drops below the horizon.",
        explanation: 'For satellites in Low Earth Orbit (LEO, ~550 km), ground passes are brief—typically lasting between 8 and 12 minutes. Operators must precisely schedule telecommands and data downlinks strictly between AOS and LOS to prevent link loss and packet truncation.',
        example: 'Ground stations at ISTRAC Bangalore track LEO passes by slewing steerable dish antennas from AOS azimuth/elevation angles along the predicted orbital path until LOS.',
        sources: [SATOPS_SOURCES.ISTRAC_OPS, SATOPS_SOURCES.CCSDS_OPS]
      },
      {
        id: 'lesson-3',
        number: '03',
        title: 'Ground Station Operations',
