        definition: 'A Ground Station (GS) is the terrestrial installation comprising tracking antenna dishes or Yagi arrays, RF transceivers, low-noise amplifiers (LNAs), and baseband modems to exchange telecommands and telemetry with orbiting spacecraft.',
        explanation: 'Ground station operators configure frequency tracking and apply Doppler shift compensation as the spacecraft moves at ~7.6 km/s relative to the station antenna. Only one active transmitter can occupy the station beam without mutual interference (Ground Station Exclusivity).',
        example: 'ISTRAC operates an extensive network of ground tracking stations across Bangalore, Lucknow, Mauritius, and Bearslake to maintain continuous communications with Indian Earth observation and science satellites.',
        sources: [SATOPS_SOURCES.ISTRAC_OPS]
      },
      {
        id: 'lesson-4',
        number: '04',
        title: 'Telemetry vs Payload Data',
        definition: 'Housekeeping Telemetry (HK) consists of essential spacecraft health measurements (bus voltage, thermistor temperatures, solar array current, subsystem states), whereas Payload Data consists of scientific measurements or camera imagery generated by mission instruments.',
        explanation: 'Flight rules require housekeeping telemetry to be downlinked and validated first at the start of every pass (Telemetry Precedence). Verifying bus thermal and electrical health ensures the satellite is stable before commanding power-intensive payload instruments.',
        example: 'Student satellites broadcast periodic AX.25 or CW beacon frames with battery voltage and temperature readings before enabling high-speed S-band transceivers for camera image dumps.',
        sources: [SATOPS_SOURCES.IIRS_EDUSAT, SATOPS_SOURCES.CCSDS_OPS]
      },
      {
        id: 'lesson-5',
        number: '05',
        title: 'Battery, Sunlight & Eclipse',
        definition: "In Low Earth Orbit, a satellite alternates between Sunlight (insolation), where solar panels generate electrical energy, and Eclipse (Earth's shadow cone), where the spacecraft operates solely on onboard battery storage.",
        explanation: 'In a typical 90-minute LEO orbit (~550 km altitude), ~55"60 minutes are spent in sunlight and ~30"35 minutes in eclipse. Flight operators must ensure the battery Depth of Discharge (DoD) never breaches the safety floor (e.g., maintaining state-of-charge >= 20%) to prevent onboard computer brownout.',
        example: 'URSC power engineers budget satellite battery capacities for worst-case eclipse durations during equinox periods to ensure continuous survival and telemetry broadcasting.',
        sources: [SATOPS_SOURCES.URSC_POWER_OBC]
      },
      {
        id: 'lesson-6',
        number: '06',
        title: 'Downlink & Data Rate',
        definition: 'Downlink is the wireless transmission of data from the spacecraft to Earth, characterized by carrier frequency (UHF/VHF/S-band/X-band), modulation scheme, RF transmission power, and achieved data rate (kbps or Mbps).',
        explanation: 'High-speed downlinks (e.g., 256 kbps to Mbps) draw significant electrical power from the bus and require higher signal-to-noise ratio (SNR). High-rate data dumps are therefore restricted to peak elevation angles of a pass window to avoid transmission errors.',
        example: 'Student CubeSats commonly use low-power UHF (e.g. 437 MHz at 9.6 kbps) for reliable telemetry and command, while utilizing S-band (2.4 GHz) for high-volume multispectral imaging data transfers.',
        sources: [SATOPS_SOURCES.INSPACE_STUDENT, SATOPS_SOURCES.CCSDS_RF]
      },
      {
        id: 'lesson-7',
        number: '07',
        title: 'Flight Rules',
        definition: 'Flight Rules are deterministic, pre-approved operational boundaries, safety constraints, and mandatory procedures designed to protect the spacecraft and ensure mission success.',
        explanation: 'Flight rules eliminate operator guesswork. Automated mission planning tools evaluate flight rules before telecommand uplink—verifying antenna pass windows, preventing overlapping dish assignments, and shedding non-critical loads if battery margins are breached.',
        example: 'ISRO Mission Operations Complex (MOX) enforces flight rules that prohibit instrument payload operations if the spacecraft attitude deviation exceeds pointing tolerances.',
        sources: [SATOPS_SOURCES.ISTRAC_OPS, SATOPS_SOURCES.ISRO_MAIN]
      },
      {
        id: 'lesson-8',
        number: '08',
        title: 'Satellite Safe Mode',
        definition: 'Safe Mode (Safe-Hold) is an autonomous contingency state entered by the on-board computer (OBC) upon detecting critical anomalies (severe power drop, loss of attitude lock, or thermal exceedance).',
        explanation: 'When entering Safe Mode, the spacecraft autonomously disconnects all secondary payloads, configures solar arrays towards the Sun, reduces RF power to periodic low-rate health beacons, and awaits corrective recovery telecommands from the ground.',
        example: 'If a satellite battery state-of-charge drops below the 20% safety threshold, the power management system automatically commands Safe-Hold load shedding to preserve vital core subsystems.',
        sources: [SATOPS_SOURCES.URSC_POWER_OBC]
      },
      {
        id: 'lesson-9',
        number: '09',
        title: 'Ground Station Failure & Handover',
        definition: 'Ground Station Handover is the planned or emergency transfer of spacecraft tracking, command, and telemetry operations from an anomalous ground terminal to an alternate station.',
        explanation: 'If a ground station suffers a hardware anomaly (e.g., azimuth rotor jam, RF feed failure, or severe local weather), operators must swiftly re-route pass schedules and hand over tracking to a secondary dish in the network.',
        example: 'During ground operations, if the primary Bangalore ISTRAC dish experiences mechanical tracking issues, command operations can be handed over to other networked stations (such as IIT Madras or NRSC Shadnagar).',
        sources: [SATOPS_SOURCES.ISTRAC_OPS]
      },
      {
        id: 'lesson-10',
        number: '10',
        title: 'Shift Handover & Mission Documentation',
        definition: 'Shift Handover is the formal transfer of operational authority and documentation between outgoing and incoming flight controller shifts at Mission Control.',
        explanation: 'Aerospace operations require total auditability. Standard handover logs document the current satellite state-of-charge (SoC), memory storage levels, completed task passes, unresolved system anomalies, and flight rule validation reports.',
        example: 'Flight controllers at ISRO MOX execute structured shift debriefs and sign off Flight Readiness Review (FRR) logs before transferring console operations to the next watch team.',
        sources: [SATOPS_SOURCES.ISRO_MAIN, SATOPS_SOURCES.ISTRAC_OPS]
      },
      {
        id: 'lesson-11',
        number: '11',
        title: 'Two-Line Elements (TLE) & Orbital Propagation',
        definition: 'A Two-Line Element Set (TLE) is a standardized data format encoding Keplerian orbital parameters for an Earth-orbiting object at a specific epoch, used by mathematical propagation models (such as SGP4/SDP4) to calculate satellite trajectory.',
        explanation: 'In Low Earth Orbit, gravitational harmonics (J2 oblateness) and upper thermospheric atmospheric drag constantly alter satellite orbital parameters. Ground stations must regularly ingest updated TLE sets (typically refreshed every 24 to 72 hours) to ensure steering dishes point with sub-degree accuracy during pass windows.',
        example: 'ISRO ISTRAC ground control ingests freshly updated NORAD / IS4OM TLE bulletins prior to tracking student satellites to ensure ground tracking dishes align accurately at Acquisition of Signal (AOS).',
        sources: [SATOPS_SOURCES.ISTRAC_OPS, SATOPS_SOURCES.CCSDS_OPS]
      },
      {
        id: 'lesson-12',
        number: '12',
        title: 'Doppler Shift & Ground RF Tracking',
        definition: 'Doppler shift is the apparent frequency offset observed between a moving spacecraft transmitter and a stationary ground receiver, directly proportional to the line-of-sight relative velocity.',
        explanation: 'At Low Earth Orbit speeds (~7.6 km/s), Doppler shift causes a continuous frequency curve: up to +10 kHz above nominal frequency at AOS, crossing 0 Hz offset at maximum elevation (closest approach), and shifting to -10 kHz at LOS for UHF (and +/-60 kHz for S-band). Software Defined Radios (SDR) apply real-time Automated Frequency Control (AFC) to track the carrier without packet loss.',
        example: 'University ground stations using SDR receivers run automated Doppler compensation scripts that retune UHF transceivers dynamically as the CubeSat flies overhead.',
        sources: [SATOPS_SOURCES.CCSDS_RF]
      },
      {
        id: 'lesson-13',
        number: '13',
        title: 'Attitude Determination & Control (ADCS)',
        definition: 'ADCS is the satellite subsystem responsible for sensing spacecraft angular orientation (Attitude Determination) and applying torques to achieve and maintain desired pointings (Attitude Control).',
        explanation: 'Small satellites utilize coarse sensors (3-axis magnetometers, Sun sensors, Earth horizon sensors) and fine sensors (star trackers, MEMS gyros). Actuation relies on magnetic torquer coils for initial B-dot de-tumbling and reaction wheels for precision 3-axis pointing (such as aiming cameras at Earth Nadir or solar arrays at the Sun).',
        example: 'Following deployer ejection, student satellites enter autonomous B-Dot mode using magnetic coils to damp angular tumble rates from >30°/s down to <2°/s before attempting 3-axis wheel stabilization.',
        sources: [SATOPS_SOURCES.URSC_POWER_OBC]
      },
      {
        id: 'lesson-14',
        number: '14',
        title: 'Thermal Control Subsystem (TCS)',
        definition: 'The Thermal Control Subsystem maintains all onboard components within their certified operational and survival temperature ranges throughout hot (direct sunlight) and cold (deep eclipse) orbital conditions.',
        explanation: 'In space vacuum, convection is absent. Thermal control relies on radiation and conduction using passive elements (Multi-Layer Insulation blankets, surface optical coatings, conductive heat pipes, structural radiators) and active elements (thermostatically controlled electrical resistance heaters for batteries).',
        example: 'CubeSat battery packs are enclosed with Kapton patch heaters and thermal isolating standoffs to ensure lithium cells never drop below 0°C during 35-minute orbital eclipses.',
        sources: [SATOPS_SOURCES.URSC_POWER_OBC]
      },
      {
        id: 'lesson-15',
        number: '15',
        title: 'Command & Data Handling (C&DH) & Watchdogs',
        definition: 'C&DH is the central computing brain of the satellite, executing flight software, ingesting sensor telemetry, arbitrating communication buses (I2C, SPI, CAN), and managing timed telecommand schedules.',
        explanation: 'Spacecraft C&DH architectures incorporate independent hardware Watchdog Timers (WDT). If ionizing space radiation causes a Single Event Upset (SEU) or operating system deadlock, the hardware watchdog starves and automatically triggers a power-on reset to restore nominal flight software execution.',
        example: 'University CubeSat flight computers run FreeRTOS or embedded Linux with triple-modular redundant watchdog timers configured to reset the CPU if health heartbeat ticks halt for 30 seconds.',
        sources: [SATOPS_SOURCES.CCSDS_OPS]
      },
      {
        id: 'lesson-16',
        number: '16',
        title: 'Electrical Power Architecture & MPPT',
        definition: 'The Electrical Power Subsystem (EPS) converts solar irradiance into electrical energy via photovoltaic solar cells, conditions and regulates bus voltages (e.g. 3.3V, 5V, 12V), stores energy in batteries, and distributes power to payloads.',
        explanation: 'Modern CubeSats employ Maximum Power Point Tracking (MPPT) DC-DC converters to dynamically operate solar cells at their optimal voltage-current point. Power budgets model generation during sunlight, consumption during ground passes, and Depth of Discharge (DoD) during orbital eclipses.',
        example: 'ISRO student satellites balance average bus generation (~6W on a 3U CubeSat in LEO) against peak RF downlink transmission consumption (up to 12W) to maintain net positive battery state of charge across full orbits.',
        sources: [SATOPS_SOURCES.URSC_POWER_OBC, SATOPS_SOURCES.INSPACE_STUDENT]
      },
      {
        id: 'lesson-17',
        number: '17',
        title: 'RF Link Budget & Free-Space Path Loss',
        definition: 'A Link Budget is the mathematical accounting of all power gains and losses from a satellite transmitter through the vacuum medium to the ground receiver, establishing whether received signal-to-noise ratio (SNR) is sufficient for reliable data demodulation.',
        explanation: 'The Friis Transmission Equation governs link margin. Major losses include Free-Space Path Loss (FSPL = (4*pi*d/lambda)^2), atmospheric absorption, pointing misalignment, and polarization mismatch. Standard flight operations require a minimum 3 to 6 dB link margin above demodulation threshold.',
        example: 'At 437 MHz and 550 km slant range, free-space path loss exceeds 140 dB. Ground stations compensate by pairing 10 dBi directional Yagi antennas with ultra-low-noise pre-amplifiers (LNA) at the antenna mast.',
        sources: [SATOPS_SOURCES.CCSDS_RF]
      },
      {
        id: 'lesson-18',
        number: '18',
        title: 'Space Radiation Environment & Single-Event Effects',
        definition: 'The space radiation environment in Low Earth Orbit consists of galactic cosmic rays (GCR), solar energetic particles (SEP), and trapped radiation belt protons and electrons (notably in the South Atlantic Anomaly).',
        explanation: 'Radiation impacts spacecraft electronics through Total Ionizing Dose (TID, gradual degradation over months) and Single Event Effects (SEE). Single Event Upsets (SEU) are transient bit-flips in memory cleared by parity/EDAC resets; Single Event Latchups (SEL) are destructive short-circuits requiring immediate power-rail cycling.',
        example: 'Student satellites passing through the South Atlantic Anomaly (SAA) schedule memory scrubbing routines and enable over-current trip latches to protect COTS CMOS microcontrollers from destructive latchups.',
        sources: [SATOPS_SOURCES.ISRO_MAIN]
      },
      {
        id: 'lesson-19',
        number: '19',
        title: 'Payload Operations & Data Queue Management',
        definition: 'Payload data handling entails acquiring, compressing, packetizing, and caching scientific imagery or sensor measurements in onboard non-volatile memory for scheduled downlink during ground station passes.',
        explanation: 'Because ground pass durations are limited (8–12 minutes), payload data generation rates typically exceed downlink capacity. Flight controllers implement priority-tiered ring buffers, scheduling high-priority compressed telemetry before dumping bulk science data payloads.',
        example: 'An Earth observation CubeSat stores raw 50 MB camera scenes in onboard flash memory, generates JPEG thumbnails for quick preview downlink on the first pass, and dumps full-resolution raw files on subsequent high-elevation passes.',
        sources: [SATOPS_SOURCES.IIRS_EDUSAT]
      },
      {
        id: 'lesson-20',
        number: '20',
        title: 'Space Debris Mitigation & Post-Mission Disposal',
        definition: 'Space Debris Mitigation comprises the internationally agreed operational rules and design requirements intended to reduce the creation of space orbital debris and prevent orbital collisions in Earth orbit.',
        explanation: 'Guidelines established by the Inter-Agency Space Debris Coordination Committee (IADC) and national regulators mandate: (1) post-mission orbital decay within 25 years (and recently 5 years under FCC guidelines) through passive drag or active propulsion, and (2) spacecraft passivation at end-of-mission (discharging batteries and venting residual propellant).',
        example: 'University CubeSats deployed at 550 km altitude are designed with sufficient area-to-mass ratio or deployable drag sails so natural upper-atmospheric friction de-orbits the chassis safely into incinerating re-entry within compliance guidelines.',
        sources: [SATOPS_SOURCES.INSPACE_STUDENT, SATOPS_SOURCES.ISRO_MAIN]
      }
    ];

    const SATOPS_FLIGHT_RULES = [
      {
        id: 'rule-exclusivity',
        name: 'Ground Station Exclusivity',
        category: 'Ground Communications',
        description: 'A ground station antenna can only track and communicate with one satellite task at any given instant. Overlapping schedules on the same dish cause RF collisions and tracking loss.',
        mitigation: 'Shift one of the colliding tasks to a different time slot or reassign it to an alternate available ground station.',
        source: SATOPS_SOURCES.ISTRAC_OPS
      },
      {
        id: 'rule-horizon',
        name: 'Pass Window Horizon Boundary (AOS/LOS)',
        category: 'Orbital Geometry',
        description: 'Communication and payload downlink tasks must strictly occur within the station elevation mask between Acquisition of Signal (AOS) and Loss of Signal (LOS). Tasks scheduled outside this window have zero RF visibility.',
        mitigation: 'Snap task start and end times to fit completely within the computed pass window duration.',
        source: SATOPS_SOURCES.ISTRAC_OPS
      },
      {
        id: 'rule-dod',
        name: 'Battery Depth of Discharge (DoD) Safe Floor (20%)',
        category: 'Power Subsystem',
        description: 'The satellite battery state of charge (SoC) must remain above the 20% critical threshold. Breaching this limit risks on-board computer brownout, bus reset, and permanent battery cell degradation.',
        mitigation: 'Execute Safe-Hold load shedding by immediately disabling high-power payload cameras or transmitters until the solar arrays recharge the battery in sunlight.',
        source: SATOPS_SOURCES.URSC_POWER_OBC
      },
      {
        id: 'rule-precedence',
        name: 'Housekeeping Telemetry Precedence',
        category: 'Operations Protocol',
        description: 'Health and housekeeping telemetry must be downlinked and verified at the beginning of a ground pass before initiating high-power payload downlinks.',
        mitigation: 'Insert a 2-minute Housekeeping Telemetry task at the pass start prior to scheduling camera or science data transfers.',
        source: SATOPS_SOURCES.IIRS_EDUSAT
      }
    ];

    const SATOPS_GLOSSARY = {
      'aos': {
        term: 'AOS (Acquisition of Signal)',
        definition: 'The moment an orbiting satellite rises above the local ground station horizon mask (typically >= 10 deg elevation) and two-way radio communication becomes possible.',
        source: SATOPS_SOURCES.ISTRAC_OPS
      },
      'los': {
        term: 'LOS (Loss of Signal)',
        definition: 'The moment a satellite descends below the ground station horizon mask, terminating RF line-of-sight and closing the communication pass.',
        source: SATOPS_SOURCES.ISTRAC_OPS
      },
      'cubesat': {
        term: 'CubeSat',
        definition: 'A standardized nanosatellite format based on 10x10x10 cm cubes (1U) weighing ~1.33 kg, scalable to 2U, 3U, 6U, and 12U structures.',
        source: SATOPS_SOURCES.INSPACE_STUDENT
      },
      'telemetry': {
        term: 'Housekeeping Telemetry (HK)',
        definition: 'Continuous status parameters downlinked from the satellite, including battery voltage, bus currents, temperatures, and subsystem operational flags.',
        source: SATOPS_SOURCES.IIRS_EDUSAT
      },
      'payload': {
        term: 'Payload Data',
        definition: 'Primary mission output data (such as multispectral imagery, science sensor readings, or radio experiments) generated by onboard instruments.',
        source: SATOPS_SOURCES.IIRS_EDUSAT
      },
      'safe mode': {
        term: 'Safe Mode (Safe-Hold)',
        definition: 'An automated protective satellite state that disconnects high-drain payloads, commands Sun-pointing for maximum solar charging, and broadcasts low-rate emergency beacons.',
        source: SATOPS_SOURCES.URSC_POWER_OBC
      },
      'eclipse': {
        term: 'Orbital Eclipse',
        definition: 'The orbital period when Earth blocks solar radiation from reaching the satellite solar panels, requiring all spacecraft power to be supplied by onboard batteries.',
        source: SATOPS_SOURCES.URSC_POWER_OBC
      },
      'dod': {
        term: 'Depth of Discharge (DoD) / State of Charge (SoC)',
        definition: 'The percentage of battery capacity that has been discharged. SATOPS enforces a minimum 20% SoC (maximum 80% DoD) safe operating floor to protect the power bus.',
        source: SATOPS_SOURCES.URSC_POWER_OBC
      },
      'tle': {
        term: 'Two-Line Element Set (TLE)',
        definition: 'A standardized data format encoding Keplerian orbital elements used by propagation models (like SGP4) to predict satellite position and pass windows.',
        source: SATOPS_SOURCES.ISRO_MAIN
      },
      'handover': {
        term: 'Ground Station Handover',
        definition: 'Transferring active spacecraft tracking and telemetry operations from one ground station to another in case of station anomalies or sequential orbital coverage.',
        source: SATOPS_SOURCES.ISTRAC_OPS
      }
    };

    const SPACE_KEYWORDS = [
      'satellite', 'cubesat', 'orbit', 'orbital', 'pass', 'aos', 'los', 'ground station',
      'telemetry', 'telecommand', 'payload', 'battery', 'solar', 'eclipse', 'sunlight',
      'power', 'safe mode', 'safe-hold', 'flight rule', 'rules', 'engine', 'emergency',
      'drill', 'handover', 'frr', 'scorecard', 'istrac', 'isro', 'in-space', 'ccds', 'ccsds',
      'elevation', 'azimuth', 'doppler', 'transceiver', 'beacon', 'antenna', 'tle', 'sgp4',
      'soc', 'dod', 'discharge', 'brownout', 'load', 'sensor', 'science', 'multispectral',
      'shedding', 'shift', 'task', 'schedule', 'planner', 'rotor', 'jam', 'anomalies', 'anomaly'
    ];

    function isSpaceQuery(query) {
      if (!query || typeof query !== 'string') return false;
      const q = query.toLowerCase();
      return SPACE_KEYWORDS.some(function(kw) { return q.indexOf(kw) !== -1; });
    }

    function querySatopsKnowledge(userQuery, missionContext) {
      var ctx = missionContext || {};
      var query = (userQuery || '').trim().toLowerCase();

      // 1. Off-Topic Check
      if (!isSpaceQuery(query)) {
        return {
          type: 'OFF_TOPIC',
          text: "I'm the SATOPS Mentor and can only help with satellite operations, CubeSats, ground stations, telemetry, mission planning, flight rules and related SATOPS topics.",
          source: null
        };
      }

      // 2. Real-Time Mission-Aware Operational Queries (READ-ONLY telemetry inspection)
      var batteryPercent = ctx.batteryPercent;
      var activeEmergencies = ctx.activeEmergencies;

      if (
        query.indexOf('task blocked') !== -1 ||
        query.indexOf('blocked') !== -1 ||
        query.indexOf("can't run") !== -1 ||
        query.indexOf('cannot run') !== -1 ||
        query.indexOf('battery rule') !== -1 ||
        query.indexOf('battery flight rule') !== -1 ||
        (query.indexOf('unsafe') !== -1 && query.indexOf('battery') !== -1)
      ) {
        if (batteryPercent !== undefined && batteryPercent < 20.0) {
          return {
            type: 'MISSION_CONTEXT',
            text: 'The current mission battery is at ' + batteryPercent.toFixed(1) + '%. SATOPS Rule 3 uses a 20% safety floor, so starting another power-consuming payload operation violates the Battery Depth of Discharge flight rule.',
            source: SATOPS_SOURCES.URSC_POWER_OBC
          };
        } else {
          return {
            type: 'KNOWLEDGE_BASE',
            text: 'The SATOPS Battery Depth of Discharge (DoD) flight rule enforces that battery State-of-Charge must remain >= 20% at all times. If a scheduled operation or eclipse reduces battery charge below 20%, the Rule Engine flags a critical violation to protect the satellite bus. (Current Mission Battery: ' + ((batteryPercent || 94.5).toFixed(1)) + '%).',
            source: SATOPS_SOURCES.URSC_POWER_OBC
          };
        }
      }

      if (query.indexOf('why is this task unsafe') !== -1 || query.indexOf('task unsafe') !== -1) {
        if (batteryPercent !== undefined && batteryPercent < 20.0) {
          return {
            type: 'MISSION_CONTEXT',
            text: 'The current mission battery is at ' + batteryPercent.toFixed(1) + '%. SATOPS Rule 3 uses a 20% safety floor, so starting another power-consuming payload operation violates the Battery Depth of Discharge flight rule.',
            source: SATOPS_SOURCES.URSC_POWER_OBC
          };
        }
        return {
          type: 'KNOWLEDGE_BASE',
          text: 'A task is flagged as unsafe by the SATOPS Rule Engine if it violates any of the 4 core flight constraints: (1) Overlapping ground station usage, (2) Execution outside the AOS/LOS horizon window, (3) Battery SoC below 20%, or (4) Scheduling payload downlink before housekeeping health verification.',
          source: SATOPS_SOURCES.ISTRAC_OPS
        };
      }

      if (query.indexOf('ground station fail') !== -1 || query.indexOf('rotor jam') !== -1 || query.indexOf('station failure') !== -1 || (query.indexOf('unavailable') !== -1 && query.indexOf('ground station') !== -1) || query.indexOf('emergency') !== -1) {
        if (activeEmergencies && activeEmergencies.indexOf('GS_FAIL_BLR') !== -1) {
          return {
            type: 'MISSION_CONTEXT',
            text: 'An emergency drill is currently active: The Bangalore antenna rotor is jammed, causing signal SNR to drop to 0 dB. Tactical flight rules require executing an immediate handover to the secondary station (IIT Madras Space Lab) to re-establish communications.',
            source: SATOPS_SOURCES.ISTRAC_OPS
          };
        }
      }

      // 3. Match against Curated Lessons
      for (var i = 0; i < SATOPS_LESSONS.length; i++) {
        var lesson = SATOPS_LESSONS[i];
        var titleLower = lesson.title.toLowerCase();
        var words = titleLower.split(' ').filter(function(w) { return w.length > 3; });
        var matchesTitle = words.some(function(word) { return query.indexOf(word) !== -1; });
        
        if (matchesTitle || 
           (query.indexOf('aos') !== -1 && lesson.id === 'lesson-2') ||
           (query.indexOf('los') !== -1 && lesson.id === 'lesson-2') ||
           (query.indexOf('pass') !== -1 && lesson.id === 'lesson-2') ||
           (query.indexOf('telemetry') !== -1 && lesson.id === 'lesson-4') ||
           (query.indexOf('payload') !== -1 && lesson.id === 'lesson-4') ||
           (query.indexOf('precedence') !== -1 && lesson.id === 'lesson-4') ||
           (query.indexOf('eclipse') !== -1 && lesson.id === 'lesson-5') ||
           (query.indexOf('sunlight') !== -1 && lesson.id === 'lesson-5') ||
           (query.indexOf('safe mode') !== -1 && lesson.id === 'lesson-8') ||
           (query.indexOf('handover') !== -1 && (lesson.id === 'lesson-9' || lesson.id === 'lesson-10'))
        ) {
          return {
            type: 'LESSON_MATCH',
            text: lesson.definition + '\n\nOperational Context: ' + lesson.explanation + '\n\nExample: ' + lesson.example,
            source: lesson.sources[0]
          };
        }
      }

      // 4. Match against Glossary
      var glossaryKeys = Object.keys(SATOPS_GLOSSARY);
      for (var j = 0; j < glossaryKeys.length; j++) {
        var key = glossaryKeys[j];
        if (query.indexOf(key) !== -1) {
          var item = SATOPS_GLOSSARY[key];
          return {
            type: 'GLOSSARY_MATCH',
            text: item.term + ': ' + item.definition,
            source: item.source
          };
        }
      }

      // 5. Match against Flight Rules
      for (var k = 0; k < SATOPS_FLIGHT_RULES.length; k++) {
        var rule = SATOPS_FLIGHT_RULES[k];
        if (query.indexOf(rule.name.toLowerCase()) !== -1 || query.indexOf(rule.category.toLowerCase()) !== -1) {
          return {
            type: 'RULE_MATCH',
            text: 'Flight Rule: ' + rule.name + ' (' + rule.category + ')\n\nConstraint: ' + rule.description + '\n\nRemediation: ' + rule.mitigation,
            source: rule.source
          };
        }
      }

      // 6. Safe Fallback for unindexed space queries
      return {
        type: 'UNINDEXED_SPACE_QUERY',
        text: "This is related to satellite operations, but I don't currently have a verified SATOPS knowledge source for that topic.",
        source: null
      };
    }

    // ==========================================
    // 9B. SATOPS KNOWLEDGE LIBRARY VIEW (06 // Learn)
    // ==========================================
    function LearnModuleSection() {
      const [selectedLessonId, setSelectedLessonId] = useState('lesson-1');
      const selectedLesson = SATOPS_LESSONS.find(l => l.id === selectedLessonId) || SATOPS_LESSONS[0];

      return (
        <div className="card-neo p-5 md:p-6 space-y-6 text-[#0b0f19]">
          <div className="flex flex-wrap items-center justify-between pb-4 border-b-2 border-black gap-3">
            <div className="flex items-center space-x-3">
              <div className="w-3.5 h-3.5 rounded-full bg-[#38bdf8] border-2 border-black animate-pulse"></div>
              <div>
                <h2 className="text-xl font-display font-black text-black uppercase tracking-wider">
                  06 // SATOPS Knowledge Library
                </h2>
                <p className="text-xs font-mono text-gray-700">
                  SATOPS uses an ISRO-first, source-grounded knowledge base, supplemented by authoritative space standards.
                </p>
              </div>
            </div>
            <div className="flex items-center space-x-2">
              <span className="text-xs font-mono bg-cyan-100 text-black border-2 border-black px-3 py-1 rounded-lg shadow-[2px_2px_0px_#0b0f19] font-bold">
                20 Operations Modules
              </span>
              <span className="text-xs font-mono bg-white text-black border-2 border-black px-3 py-1 rounded-lg shadow-[2px_2px_0px_#0b0f19] font-bold">
                ISRO-First Grounded
              </span>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[520px]">
            {/* LEFT PANEL: Lesson Topic Index */}
            <div className="lg:col-span-4 bg-[#f8fafc] border-2 border-black rounded-xl p-3 flex flex-col space-y-2.5 overflow-y-auto max-h-[640px] shadow-[3px_3px_0px_#0b0f19]">
              <div className="text-[11px] font-mono text-black font-extrabold uppercase px-2 py-1 tracking-wider border-b-2 border-black mb-1">
                Lesson Topics
              </div>
              {SATOPS_LESSONS.map((lesson) => {
                const isSelected = lesson.id === selectedLesson.id;
                return (
                  <button
                    key={lesson.id}
                    onClick={() => setSelectedLessonId(lesson.id)}
                    className={`w-full text-left p-3 rounded-lg border-2 border-black transition-all text-xs font-mono flex items-center justify-between group shadow-[2px_2px_0px_#0b0f19] ${
                      isSelected
                        ? 'bg-black text-white font-extrabold translate-x-0.5'
                        : 'bg-white text-black hover:bg-slate-100 font-semibold'
                    }`}
                  >
                    <div className="flex items-center space-x-2.5 truncate">

    // ==========================================
    // 9C. SATOPS AI FLIGHT OPERATIONS MENTOR (DRAWER)
    // ==========================================
    function SatopsMentor() {
      const [isOpen, setIsOpen] = useState(false);
      const [inputQuery, setInputQuery] = useState('');
      const [chatHistory, setChatHistory] = useState([
        {
          id: 'msg-init',
          sender: 'mentor',
          text: "Welcome Cadet! I'm your SATOPS Flight Operations Mentor. I provide verified educational guidance on CubeSats, pass planning (AOS/LOS), battery depth-of-discharge, deterministic flight rules, and emergency procedures. How can I assist your mission?",
          source: null,
          time: '00:00:00'
        }
      ]);
      const messagesEndRef = useRef(null);

      const {
        batteryPercent,
        currentOrbit,
        currentActiveTasks,
        activeEmergencies,
        tasks,
        missionTimeSeconds
      } = useContext(MissionContext);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        if (isOpen) {
          scrollToBottom();
        }
      }, [chatHistory, isOpen]);

      const handleSend = (textToSend) => {
        const q = (textToSend || inputQuery).trim();
        if (!q) return;

        const min = Math.floor((missionTimeSeconds || 0) / 60);
        const sec = Math.floor((missionTimeSeconds || 0) % 60);
        const timeStr = `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

        const userMsg = {
          id: `user-${Date.now()}`,
          sender: 'user',
          text: q,
          time: timeStr
        };

        const missionContext = {
          batteryPercent: batteryPercent !== undefined ? batteryPercent : 94.5,
          currentOrbit: currentOrbit || { inSunlight: true },
          currentActiveTasks: currentActiveTasks || [],
          activeEmergencies: activeEmergencies || [],
          tasks: tasks || [],
          missionTimeSeconds: missionTimeSeconds || 0
        };

        const result = querySatopsKnowledge(q, missionContext);

        const mentorMsg = {
          id: `mentor-${Date.now()}`,
          sender: 'mentor',
          text: result.text,
          source: result.source,
          time: timeStr
        };

        setChatHistory(prev => [...prev, userMsg, mentorMsg]);
        setInputQuery('');
      };

      const quickPrompts = [
        'What is AOS?',
        'Why does eclipse affect battery?',
        'What is housekeeping telemetry?',
        'Why must telemetry be sent before payload data?',
        'What happens if the ground station fails?',
        'What is safe mode?',
        'Why did the battery rule fail?'
      ];

      return (
        <div className="fixed bottom-6 right-6 z-50 select-none">
          {/* Floating Toggle Button */}
          {!isOpen && (
            <button
              onClick={() => setIsOpen(true)}
              className="btn-neo bg-black hover:bg-slate-900 text-white px-4 py-3 rounded-xl border-2 border-black font-mono text-xs font-bold uppercase tracking-wider shadow-[4px_4px_0px_#0b0f19] flex items-center space-x-2.5 transition-all"
            >
              <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 border border-white animate-ping"></span>
              <span>🤖 SATOPS AI MENTOR</span>
            </button>
          )}

          {/* Floating Chat Drawer */}
          {isOpen && (
            <div className="w-[380px] sm:w-[420px] max-w-[calc(100vw-2rem)] h-[540px] max-h-[82vh] bg-white border-2 border-black rounded-2xl shadow-[8px_8px_0px_#0b0f19] flex flex-col overflow-hidden font-sans text-black">
              {/* Header */}
              <div className="p-3.5 bg-black text-white border-b-2 border-black flex items-center justify-between">
                <div className="flex items-center space-x-2.5">
                  <div className="w-3.5 h-3.5 rounded-full bg-cyan-400 border border-white animate-pulse"></div>
                  <div>
                    <div className="font-display font-black text-sm text-white uppercase tracking-wider flex items-center space-x-2">
                      <span>SATOPS AI Mentor</span>
                      <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-cyan-900 text-cyan-200 border border-cyan-400 font-bold">
                        READ-ONLY
                      </span>
                    </div>
                    <div className="text-[10px] font-mono text-slate-300">
                      LEO Operations & Curated Space Guide
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => setIsOpen(false)}
                  className="w-7 h-7 rounded-lg bg-white hover:bg-slate-200 text-black border-2 border-black font-mono text-xs font-extrabold flex items-center justify-center transition shadow-[2px_2px_0px_#000]"
                >
                  ✕
                </button>
              </div>

              {/* Live Telemetry Summary Pill (Read-Only) */}
              <div className="px-3 py-2 bg-[#f1f5f9] border-b-2 border-black flex items-center justify-between text-[11px] font-mono text-black font-bold">
                <div className="flex items-center space-x-1">
                  <span>🔋 SoC:</span>
                  <span className={`px-1.5 py-0.2 rounded border border-black ${(batteryPercent || 100) < 20 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-800'}`}>
                    {(batteryPercent || 94.5).toFixed(1)}%
                  </span>
                </div>
                <div className="flex items-center space-x-1">
                  <span>Orbit:</span>
                  <span className="px-1.5 py-0.2 rounded border border-black bg-cyan-50 text-cyan-900">
                    {currentOrbit?.inSunlight ? '☀️ Sunlight' : '🌑 Eclipse'}
                  </span>
                </div>
                <div className="flex items-center space-x-1">
                  <span>Station:</span>
                  <span className="px-1.5 py-0.2 rounded border border-black bg-amber-50 text-amber-900">BLR-01</span>
                </div>
              </div>

              {/* Quick Prompts Bar */}
              <div className="p-2 bg-white border-b-2 border-black flex items-center space-x-1.5 overflow-x-auto text-[10px] font-mono">
                {quickPrompts.map((p, i) => (
                  <button
                    key={i}
                    onClick={() => handleSend(p)}
                    className="whitespace-nowrap px-2.5 py-1 rounded-md bg-[#f8fafc] border-2 border-black hover:bg-cyan-100 text-black font-bold shadow-[2px_2px_0px_#0b0f19] transition"
                  >
                    {p}
                  </button>
                ))}
              </div>

              {/* Messages Container */}
              <div className="flex-1 p-3.5 overflow-y-auto space-y-3 font-mono text-xs bg-[#f8fafc]">
                {chatHistory.map(msg => (
                  <div
                    key={msg.id}
                    className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}
                  >
                    <div className="text-[9px] text-gray-600 mb-1 px-1 font-bold">
                      {msg.sender === 'user' ? 'Operator' : 'SATOPS Mentor'} • {msg.time}
                    </div>
                    <div
                      className={`p-3 rounded-xl max-w-[90%] leading-relaxed border-2 border-black shadow-[2px_2px_0px_#0b0f19] ${
                        msg.sender === 'user'
                          ? 'bg-black text-white rounded-tr-none font-medium'
                          : 'bg-white text-black rounded-tl-none space-y-2 font-medium'
                      }`}
                    >
                      <p className="whitespace-pre-line font-sans text-xs">{msg.text}</p>
                      
                      {msg.source && (
                        <div className="pt-2 mt-2 border-t border-black/30 text-[10px] font-mono text-cyan-900 font-bold flex items-center space-x-1">
                          <span>Source:</span>
                          <a
                            href={msg.source.url}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="underline hover:text-black font-extrabold"
                          >
                            [{msg.source.organization}] {msg.source.title}
                          </a>
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                <div ref={messagesEndRef} />
              </div>

              {/* Input Bar */}
              <div className="p-2.5 bg-white border-t-2 border-black">
                <form
                  onSubmit={e => {
                    e.preventDefault();
                    handleSend();
                  }}
                  className="flex items-center space-x-2"
                >
                  <input
                    type="text"
                    value={inputQuery}
                    onChange={e => setInputQuery(e.target.value)}
                    placeholder="Ask about passes, battery, flight rules, telemetry..."
                    className="flex-1 bg-[#f8fafc] border-2 border-black rounded-lg px-3 py-2 text-xs font-mono text-black placeholder-gray-500 focus:outline-none focus:bg-white focus:shadow-[2px_2px_0px_#0b0f19]"
                  />
                  <button
                    type="submit"
                    className="btn-neo px-4 py-2 bg-cyan-400 hover:bg-cyan-300 text-black font-display font-black text-xs uppercase tracking-wider rounded-lg transition shadow-[2px_2px_0px_#0b0f19]"
                  >
                    Send
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================

    // =========================================================================
    // 1. AI FLIGHT DIRECTOR PANEL (COLLAPSIBLE RIGHT-SIDE MISSION CONSOLE)
    // =========================================================================
    function AIFlightDirectorPanel() {
      const {
        currentMission,
        missionConfidence,
        isVoiceEnabled,
        setIsVoiceEnabled,
        batteryPercent,
        orbitState,
        activeContact,
        tasks,
        missionTimeSec,
        storageUsedMB,
        storageCapacityMB,
        finishMissionRun,
        anomalies
      } = useContext(MissionContext);

      const [isCollapsed, setIsCollapsed] = useState(false);
      const [historyTab, setHistoryTab] = useState(false);
      const [customSummary, setCustomSummary] = useState(null);

      // Estimated core temperature (°C) based on sunlight and payload
      const coreTempC = useMemo(() => {
        if (orbitState.isSunlit) {
          return (21.5 + (100 - batteryPercent) * 0.08).toFixed(1);
        } else {
          return (-4.2 + (batteryPercent * 0.04)).toFixed(1);
        }
      }, [orbitState.isSunlit, batteryPercent]);

      const runningTasks = tasks.filter(t => missionTimeSec >= t.startSec && missionTimeSec <= t.endSec);

      // Latest proactive recommendation
      const latestRec = currentMission.fdRecommendations && currentMission.fdRecommendations.length > 0
        ? currentMission.fdRecommendations[0]
        : null;

      const handleGenerateSummary = () => {
        let health = missionConfidence >= 85 ? 'STABLE' : missionConfidence >= 65 ? 'ELEVATED MONITORING' : 'CRITICAL MARGIN';
        let concern = 'None (All primary subsystems nominal)';
        if (batteryPercent < 25) concern = 'Low battery state-of-charge (<25% SoC)';
        else if (!orbitState.isSunlit && runningTasks.length > 0) concern = 'High power payload operating during orbital eclipse';
        else if (anomalies && anomalies.rotorJamStationId) concern = 'Ground station antenna azimuth drive jammed';
        else if (storageUsedMB > 105) concern = 'OBDH onboard flash memory approaching capacity limit';
        else if (!orbitState.isSunlit) concern = 'Spacecraft running on internal battery in Earth shadow';

        setCustomSummary({
          health,
          battery: `${batteryPercent.toFixed(1)}%`,
          comms: activeContact ? `Locked (${activeContact.name})` : 'Standby / Autonomous Carrier',
          payload: runningTasks.length > 0 ? runningTasks[0].label : 'Standby',
          concern,
          time: formatTime(missionTimeSec)
        });
      };

      const getLevelBadgeClass = (lvl) => {
        switch (lvl) {
          case 'CRITICAL': return 'bg-rose-500 text-white border-rose-700';
          case 'WARNING': return 'bg-amber-400 text-amber-950 border-amber-600';
          case 'SUGGESTION': return 'bg-emerald-500 text-white border-emerald-700';
          default: return 'bg-sky-400 text-slate-950 border-sky-600';
        }
      };

      if (isCollapsed) {
        return (
          <div className="card-neo bg-slate-900 text-white p-3 flex items-center justify-between shadow-md font-mono text-xs">
            <div className="flex items-center space-x-3">
              <div className="relative flex items-center justify-center w-7 h-7 rounded-full bg-cyan-500/20 border border-cyan-400">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping absolute"></span>
                <span className="text-xs">🤖</span>
              </div>
              <div>
                <span className="font-bold text-cyan-300">AI FLIGHT DIRECTOR</span>
                <span className="text-gray-400 text-[10px] ml-2">CONFIDENCE: <strong className="text-emerald-400">{missionConfidence}%</strong></span>
              </div>
              {latestRec && (
                <div className="hidden sm:inline-block px-2 py-0.5 rounded text-[10px] font-bold truncate max-w-xs bg-slate-800 text-slate-200 border border-slate-700">
                  {latestRec.title}
                </div>
              )}
            </div>
            <div className="flex items-center space-x-2">
              <button
                onClick={() => setIsVoiceEnabled(!isVoiceEnabled)}
                className={`px-2 py-1 rounded text-[10px] font-bold border ${isVoiceEnabled ? 'bg-cyan-500 text-black border-cyan-300' : 'bg-slate-800 text-gray-300 border-slate-700'}`}
                title="Toggle Voice Narration"
              >
                {isVoiceEnabled ? '🔊 VOICE ON' : '🔇 VOICE OFF'}
              </button>
              <button
                onClick={() => setIsCollapsed(false)}
                className="btn-neo bg-[#38bdf8] text-black px-2.5 py-1 text-[11px] font-bold"
              >
                ⛶ EXPAND CONSOLE
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="card-neo bg-white border-2 border-[#0b0f19] p-4 space-y-3.5 shadow-md">
          {/* Header Bar */}
          <div className="flex items-center justify-between border-b-2 border-[#0b0f19] pb-3">
            <div className="flex items-center space-x-2.5">
              <div className="w-9 h-9 rounded-lg bg-slate-950 text-white flex items-center justify-center border-2 border-black shadow-[2px_2px_0px_#38bdf8] relative">
                <span className="text-lg">🤖</span>
                <span className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-emerald-500 border border-white animate-pulse"></span>
              </div>
              <div>
                <div className="font-display font-black text-sm text-[#0b0f19] uppercase tracking-wider flex items-center space-x-2">
                  <span>AI FLIGHT DIRECTOR</span>
                  <span className="text-[9px] font-mono px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold border border-emerald-300">
                    LIVE CO-PILOT
                  </span>
                </div>
                <div className="font-mono text-[9.5px] text-gray-500">
                  Autonomous Spacecraft Monitoring & Proactive Gating
                </div>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button
                onClick={() => setIsVoiceEnabled(!isVoiceEnabled)}
                className={`px-2 py-1 rounded font-mono text-[10px] font-bold border transition-all ${
                  isVoiceEnabled ? 'bg-[#38bdf8] text-black border-black shadow-sm' : 'bg-slate-100 text-gray-600 border-gray-300 hover:bg-slate-200'
                }`}
                title="Toggle browser speech synthesis narration for new alerts"
              >
                {isVoiceEnabled ? '🔊 VOICE ON' : '🔇 VOICE OFF'}
              </button>
              <button
                onClick={() => setIsCollapsed(true)}
                className="font-mono text-xs font-bold text-gray-600 hover:text-black px-1.5 py-0.5 rounded hover:bg-slate-100 border border-gray-300"
                title="Collapse Panel"
              >
                —
              </button>
            </div>
          </div>

          {/* Dynamic Mission Confidence Bar */}
          <div className="bg-slate-50 border-2 border-[#0b0f19] p-3 rounded-lg space-y-1.5">
            <div className="flex items-center justify-between text-xs font-mono font-bold">
              <span className="text-gray-700 flex items-center gap-1">
                <span>🎯 MISSION CONFIDENCE</span>
                <span className="text-[9px] text-gray-400 font-normal">(Dynamic Physics & Safety Index)</span>
              </span>
              <span className={`text-sm font-black ${
                missionConfidence >= 85 ? 'text-emerald-600' : missionConfidence >= 65 ? 'text-amber-600' : 'text-rose-600'

            <div className="w-full h-2.5 bg-gray-200 rounded-full border border-black overflow-hidden flex">

                style={{ width: `${missionConfidence}%` }}

            <div className="flex flex-wrap items-center justify-between text-[9px] font-mono text-gray-500 pt-0.5">
