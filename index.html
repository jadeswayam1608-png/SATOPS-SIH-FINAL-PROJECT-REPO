<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SATOPS // Student Satellite Operations Training System</title>
  
  <!-- Premium Fonts: Syne, Orbitron (Display), Space Grotesk (Body), JetBrains Mono (Telemetry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Orbitron:wght@800;900&family=Space+Grotesk:wght@400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'Orbitron', 'sans-serif'],
            orbitron: ['Orbitron', 'sans-serif'],
            sans: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            retro: {
              bg: '#e5e8ed',
              darkbg: '#070a12',
              surface: '#ffffff',
              ink: '#0b0f19',
              border: '#0b0f19',
              accent: '#38bdf8',
              amber: '#f59e0b',
              emerald: '#10b981',
              rose: '#f43f5e'
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, Babel Standalone, and Three.js (High-Speed Cloudflare CDNs) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin></script>

  <script>
    window.addEventListener('error', function(e) {
      console.error('SATOPS Error:', e.error || e.message);
      const errBox = document.getElementById('satops-error-box');
      if (errBox) {
        errBox.style.display = 'block';
        errBox.innerText = 'Initialization Error: ' + (e.error?.message || e.message);
      }
    });
  </script>

  <style>
    /* 3D Extruded Hero Title - Crisp White Beveled Blocks with Deep Black 3D Extrusion */
    .hero-3d-title {
      font-family: 'Syne', sans-serif;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: -0.015em;
      line-height: 0.92;
      text-align: center;
      display: inline-block;
      -webkit-text-stroke: 3.5px #0b0f19;
      paint-order: stroke fill;
      text-shadow: 
        -1px 1px 0px #0b0f19,
        -2px 2px 0px #0b0f19,
        -3px 3px 0px #0b0f19,
        -4px 4px 0px #0b0f19,
        -5px 5px 0px #0b0f19,
        -6px 6px 0px #0b0f19,
        -7px 7px 0px #0b0f19,
        -8px 8px 0px #0b0f19,
        -9px 9px 0px #0b0f19,
        -10px 10px 0px #0b0f19,
        -11px 11px 0px #0b0f19,
        -12px 12px 0px #0b0f19,
        -13px 13px 0px #0b0f19,
        -14px 14px 0px #0b0f19,
        -16px 16px 24px rgba(11, 15, 25, 0.35);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
    }

    /* Precision Paper texture micro-dot grid matching Reference */
    .paper-texture {
      background-color: #eef1f5;
      background-image: 
        radial-gradient(circle, rgba(11, 15, 25, 0.15) 0.70px, transparent 0.70px), 
        radial-gradient(circle, rgba(11, 15, 25, 0.15) 0.70px, #eef1f5 0.70px);
      background-size: 26px 26px;
      background-position: 0 0, 13px 13px;
    }

    /* Neo-Brutalist Cards */
    .card-neo {
      background: #ffffff;
      border: 2.5px solid #0b0f19;
      box-shadow: 4px 4px 0px #0b0f19;
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-neo-sm {
      background: #ffffff;
      border: 2px solid #0b0f19;
      box-shadow: 3px 3px 0px #0b0f19;
      border-radius: 8px;
    }

    /* Neo-Brutalist Buttons */
    .btn-neo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      border: 2px solid #0b0f19;
      box-shadow: 3px 3px 0px #0b0f19;
      border-radius: 8px;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .btn-neo:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #0b0f19;
    }

    .btn-neo:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #0b0f19;
    }

    /* Badges */
    .badge-neo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1.5px solid #0b0f19;
      box-shadow: 2px 2px 0px #0b0f19;
      border-radius: 6px;
      padding: 0.15rem 0.45rem;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* Clean Cosmic Starfield for 3D Viewport & Apertures */
    .portal-cosmos {
      background-color: #040814;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 70px 90px, #38bdf8, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 130px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 170px 150px, #f59e0b, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 180px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 220px 220px;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-left: 1px solid #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #0b0f19;
      border-radius: 3px;
    }

    /* ===== MICRO-INTERACTION KEYFRAMES ===== */

    /* Entry: Fade + slide up */
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Entry: Fade + slide from left */
    @keyframes fadeSlideLeft {
      from { opacity: 0; transform: translateX(-40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Entry: Fade + slide from right */
    @keyframes fadeSlideRight {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Entry: Fade + scale */
    @keyframes fadeScaleIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Continuous float (gentle bob) for astronaut */
    @keyframes floatBob {
      0%,100% { transform: translateY(0px) rotate(-12deg); }
      50%      { transform: translateY(-12px) rotate(-12deg); }
    }

    /* Continuous float for UFO */
    @keyframes floatUFO {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-8px); }
    }

    /* Twinkle for sparkle stars */
    @keyframes twinkle {
      0%,100% { opacity: 1; transform: scale(1) rotate(0deg); }
      50%      { opacity: 0.6; transform: scale(0.8) rotate(20deg); }
    }

    /* Slow pulse glow on pill badge */
    @keyframes pillPulse {
      0%,100% { box-shadow: 3px 3px 0px #0b0f19, 0 0 0 0 rgba(56,189,248,0); }
      50%      { box-shadow: 3px 3px 0px #0b0f19, 0 0 12px 4px rgba(56,189,248,0.25); }
    }

    /* Reveal animation for the h1 title (clip + slide) */
    @keyframes titleReveal {
      from { opacity: 0; transform: perspective(1000px) translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: perspective(1000px) translateY(0) scale(1); }
    }

    /* Utility animation classes */
    .anim-entry-left   { animation: fadeSlideLeft  0.7s cubic-bezier(0.22,1,0.36,1) both; }
    .anim-entry-right  { animation: fadeSlideRight 0.7s cubic-bezier(0.22,1,0.36,1) both; }
    .anim-entry-up     { animation: fadeSlideUp    0.7s cubic-bezier(0.22,1,0.36,1) both; }
    .anim-scale-in     { animation: fadeScaleIn    0.6s cubic-bezier(0.22,1,0.36,1) both; }
    .anim-title        { animation: titleReveal    0.9s cubic-bezier(0.22,1,0.36,1) both; }

    .delay-100  { animation-delay: 0.10s; }
    .delay-150  { animation-delay: 0.15s; }
    .delay-200  { animation-delay: 0.20s; }
    .delay-300  { animation-delay: 0.30s; }
    .delay-400  { animation-delay: 0.40s; }
    .delay-500  { animation-delay: 0.50s; }
    .delay-600  { animation-delay: 0.60s; }
    .delay-700  { animation-delay: 0.70s; }
    .delay-800  { animation-delay: 0.80s; }

    /* Astronaut continuous bob */
    .anim-astronaut {
      animation: floatBob 4.2s ease-in-out infinite;
    }
    /* Override when mouse is active " JS handles via inline transform, so we layer */
    .anim-ufo {
      animation: floatUFO 3.6s ease-in-out infinite;
    }
    .anim-twinkle {
      animation: twinkle 2.8s ease-in-out infinite;
    }
    .anim-pill {
      animation: pillPulse 2.4s ease-in-out infinite;
    }

    /* Hover lift for illustration blobs */
    .hover-lift {
      transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), filter 0.35s ease;
    }
    .hover-lift:hover {
      filter: drop-shadow(0 12px 24px rgba(11,15,25,0.18));
    }
  </style>
</head>
<body class="paper-texture min-h-screen text-[#0b0f19] antialiased selection:bg-[#38bdf8] selection:text-black">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="card-neo p-8 text-center max-w-md mx-auto">
        <div class="w-12 h-12 border-4 border-[#0b0f19] border-t-[#38bdf8] rounded-full animate-spin mx-auto mb-4"></div>
        <h2 class="font-display font-black text-xl uppercase tracking-wider text-[#0b0f19]">Initializing SATOPS Core</h2>
        <p class="font-mono text-sm text-gray-700 mt-2">Loading Department Modules & Physics Integrator...</p>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useContext, createContext, useMemo, useCallback } = React;

    // ==========================================
    // 1. CONSTANTS & GROUND STATIONS
    // ==========================================
    const GROUND_STATIONS = [
      { id: 'GS_BLR', name: 'ISRO Bangalore Dish', code: 'BLR-01', horizon: '10° Horizon', lat: 12.9716, lon: 77.5946, minEl: 10, color: '#38bdf8' },
      { id: 'GS_IITM', name: 'IIT Madras Space Station', code: 'IITM-02', horizon: '15° Horizon', lat: 13.0827, lon: 80.2707, minEl: 15, color: '#10b981' },
      { id: 'GS_NRSC', name: 'NRSC Shadnagar Dish', code: 'NRSC-03', horizon: '8° Deep Dish', lat: 17.0600, lon: 78.2000, minEl: 8, color: '#f59e0b' },
      { id: 'GS_SVL', name: 'Svalbard Polar Station', code: 'SVL-04', horizon: '10° Horizon', lat: 78.2232, lon: 15.6267, minEl: 10, color: '#f43f5e' }
    ];

    const ORBITAL_PARAMS = {
      altitudeKm: 550,
      inclinationDeg: 53.0,
      periodMinutes: 90,
      periodSeconds: 5400,
      earthRadiusKm: 6371,
      sunlightFraction: 0.62
    };

    const POWER_SPECS = {
      solarGenerationSunlightWatts: 18.0,
      baseLoadWatts: 4.5,
      tasks: {
        TELEMETRY_PING: { name: 'Telemetry Ping', powerWatts: 2.5, storageRateMBps: 0.05, durationSec: 300, icon: '📡' },
        IMAGING_HIGHRES: { name: 'High-Res Optical Imaging', powerWatts: 14.0, storageRateMBps: 1.8, durationSec: 480, icon: '🔡' },
        DOWNLINK_DATA: { name: 'Ground Station Downlink', powerWatts: 16.5, storageRateMBps: -4.0, durationSec: 600, icon: '🛰️' },
        WHEEL_DESATURATION: { name: 'Reaction Wheel Desaturation', powerWatts: 8.0, storageRateMBps: 0.0, durationSec: 360, icon: '🎞' },
        PAYLOAD_CALIBRATION: { name: 'Payload Sensor Calib', powerWatts: 6.0, storageRateMBps: 0.2, durationSec: 420, icon: '🎬' }
      },
      batteryCapacityWattSec: 25000
    };

    // ==========================================
    // 2. ORBIT PROPAGATION & PHYSICS UTILITIES
    // ==========================================
    function calculateOrbitState(missionTimeSec) {
      const orbitFraction = (missionTimeSec % ORBITAL_PARAMS.periodSeconds) / ORBITAL_PARAMS.periodSeconds;
      const meanAnomalyRad = orbitFraction * 2 * Math.PI;
      const incRad = (ORBITAL_PARAMS.inclinationDeg * Math.PI) / 180;
      
      const latRad = Math.asin(Math.sin(incRad) * Math.sin(meanAnomalyRad));
      const latDeg = (latRad * 180) / Math.PI;
      
      const earthRotRate = 360 / 86400;
      const lonDeg = (((meanAnomalyRad * 180) / Math.PI) - (missionTimeSec * earthRotRate) + 45) % 360 - 180;
      
      const isSunlit = orbitFraction < ORBITAL_PARAMS.sunlightFraction;
      
      const GM = 398600.4418;
      const r = ORBITAL_PARAMS.earthRadiusKm + ORBITAL_PARAMS.altitudeKm;
      const velocityKmS = Math.sqrt(GM / r);

      return {
        latDeg,
        lonDeg,
        altKm: ORBITAL_PARAMS.altitudeKm,
        velocityKmS,
        isSunlit,
        orbitFraction
      };
    }

    function calculateLookAngles(satLat, satLon, satAlt, gsLat, gsLon) {
      const dLat = ((satLat - gsLat) * Math.PI) / 180;
      const dLon = ((satLon - gsLon) * Math.PI) / 180;
      const gsLatRad = (gsLat * Math.PI) / 180;
      const satLatRad = (satLat * Math.PI) / 180;

      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(gsLatRad) * Math.cos(satLatRad) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      const earthR = ORBITAL_PARAMS.earthRadiusKm;
      const satR = earthR + satAlt;
      const slantRangeKm = Math.sqrt(earthR*earthR + satR*satR - 2*earthR*satR*Math.cos(c));
      
      const cosElevation = (satR * Math.sin(c)) / slantRangeKm;
      let elevationDeg = (Math.acos(Math.min(Math.max(cosElevation, -1), 1)) * 180) / Math.PI - 90;
      if (elevationDeg < 0) elevationDeg = (Math.asin(Math.min(Math.max((satR*Math.cos(c) - earthR)/slantRangeKm, -1), 1)) * 180) / Math.PI;

      const y = Math.sin(dLon) * Math.cos(satLatRad);
      const x = Math.cos(gsLatRad) * Math.sin(satLatRad) - Math.sin(gsLatRad) * Math.cos(satLatRad) * Math.cos(dLon);
      let azimuthDeg = (Math.atan2(y, x) * 180) / Math.PI;
      if (azimuthDeg < 0) azimuthDeg += 360;

      return {
        elevationDeg: Math.max(0, elevationDeg),
        azimuthDeg,
        slantRangeKm,
        inContact: elevationDeg >= 10
      };
    }

    // ==========================================
    // 3. MISSION CONTEXT & STATE ENGINE
    // ==========================================
    const MissionContext = createContext();

    function MissionProvider({ children }) {
      const [isDashboard, setIsDashboard] = useState(() => {
        return window.location.search.includes('dashboard=true');
      });
      const [view, setView] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return params.get('view') || (window.location.search.includes('dashboard=true') ? 'planner' : 'overview');
      });
      const [missionTimeSec, setMissionTimeSec] = useState(120);
      const [isPlaying, setIsPlaying] = useState(true);
      const [timeMultiplier, setTimeMultiplier] = useState(1);
      
      const [batteryPercent, setBatteryPercent] = useState(94.5);
      const [storageUsedMB, setStorageUsedMB] = useState(240);
      const [storageCapacityMB] = useState(1000);
      const [solarArrayEfficiency, setSolarArrayEfficiency] = useState(1.0);
      
      const [anomalies, setAnomalies] = useState({
        rotorJamStationId: null,
        solarDegradation: false,
        reactionWheelFault: false,
        prePassGated: false
      });

      // Student Training Score & Drill Tracking (Persistent via localStorage)
      const [drillAnswers, setDrillAnswers] = useState(() => {
        try {
          const s = localStorage.getItem('satops_drill_answers');
          return s ? JSON.parse(s) : {};
        } catch { return {}; }
      });

      const [quizAnswers, setQuizAnswers] = useState(() => {
        try {
          const s = localStorage.getItem('satops_quiz_answers');
          return s ? JSON.parse(s) : {};
        } catch { return {}; }
      });

      const [scoreHistory, setScoreHistory] = useState(() => {
        try {
          const s = localStorage.getItem('satops_score_history');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });

      useEffect(() => {
        try {
          localStorage.setItem('satops_drill_answers', JSON.stringify(drillAnswers));
        } catch (e) {}
      }, [drillAnswers]);

      useEffect(() => {
        try {
          localStorage.setItem('satops_quiz_answers', JSON.stringify(quizAnswers));
        } catch (e) {}
      }, [quizAnswers]);

      useEffect(() => {
        try {
          localStorage.setItem('satops_score_history', JSON.stringify(scoreHistory));
        } catch (e) {}
      }, [scoreHistory]);

      // Calculate dynamic student score starting at 0 up to 100
      const studentScore = useMemo(() => {
        let score = 0;
        Object.values(drillAnswers).forEach(ans => {
          if (ans && ans.isCorrect) score += 1.4;
        });
        Object.values(quizAnswers).forEach(ans => {
          if (ans && ans.isCorrect) score += 1.5;
        });
        return Math.min(100, Math.round(score * 10) / 10);
      }, [drillAnswers, quizAnswers]);

      const submitDrillAnswer = (drillId, optionIndex, isCorrect, drillTitle, subsystem) => {
        setDrillAnswers(prev => ({
          ...prev,
          [drillId]: {
            optionIndex,
            isCorrect,
            drillTitle,
            subsystem,
            points: isCorrect ? 1.4 : 0,
            answeredAt: new Date().toISOString()
          }
        }));
        addLog(`Emergency Drill [${drillId}] completed: ${isCorrect ? 'CORRECT (+1.4 PTS)' : 'INCORRECT (0 PTS)'}`, isCorrect ? 'SUCCESS' : 'ANOMALY');
      };

      const submitQuizAnswer = (quizId, optionIndex, isCorrect) => {
        setQuizAnswers(prev => ({
          ...prev,
          [quizId]: {
            optionIndex,
            isCorrect,
            points: isCorrect ? 1.5 : 0,
            answeredAt: new Date().toISOString()
          }
        }));
        addLog(`Rapid Quiz [${quizId}] answered: ${isCorrect ? 'CORRECT (+1.5 PTS)' : 'INCORRECT (0 PTS)'}`, isCorrect ? 'SUCCESS' : 'WARNING');
      };

      const saveHistorySnapshot = (customNotes) => {
        const drillsList = Object.values(drillAnswers);
        const quizzesList = Object.values(quizAnswers);
        const correctDrills = drillsList.filter(d => d.isCorrect).length;
        const wrongDrills = drillsList.filter(d => !d.isCorrect).length;
        const correctQuizzes = quizzesList.filter(q => q.isCorrect).length;
        const wrongQuizzes = quizzesList.filter(q => !q.isCorrect).length;
        const totalCompleted = drillsList.length + quizzesList.length;

        if (totalCompleted === 0 && studentScore === 0) {
          addLog('Cannot log empty session: answer at least 1 drill or quiz first.', 'WARNING');
          return;
        }

        const snapshot = {
          id: 'HIST-' + Date.now(),
          date: new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
          score: studentScore,
          drillsCompleted: drillsList.length,
          quizzesCompleted: quizzesList.length,
          correctAnswers: correctDrills + correctQuizzes,
          incorrectAnswers: wrongDrills + wrongQuizzes,
          notes: customNotes || (studentScore >= 85 ? 'Flight Director Certified' : studentScore >= 60 ? 'Certified Operator' : 'Training In Progress')
        };
        setScoreHistory(prev => [snapshot, ...prev]);
        addLog(`Scorecard session saved to history (${studentScore}/100 PTS).`, 'INFO');
      };

      const resetTrainingSession = () => {
        const totalAnswers = Object.keys(drillAnswers).length + Object.keys(quizAnswers).length;
        if (totalAnswers > 0) {
          saveHistorySnapshot('Auto-archived prior to session reset.');
        }
        setDrillAnswers({});
        setQuizAnswers({});
        addLog('Training session score reset to 0/100 PTS.', 'INFO');
      };

      const [tasks, setTasks] = useState([
        { id: 't-1', type: 'TELEMETRY_PING', startSec: 300, endSec: 600, targetStationId: 'GS_BLR', label: 'ISRO Bangalore Health Ping' },
        { id: 't-2', type: 'IMAGING_HIGHRES', startSec: 900, endSec: 1380, label: 'High-Res Coastal Survey' },
        { id: 't-3', type: 'DOWNLINK_DATA', startSec: 1500, endSec: 2100, targetStationId: 'GS_IITM', label: 'IIT Madras Bulk Downlink' },
        { id: 't-4', type: 'WHEEL_DESATURATION', startSec: 2400, endSec: 2760, label: 'B-Dot Wheel Desaturation' },
        { id: 't-5', type: 'PAYLOAD_CALIBRATION', startSec: 3100, endSec: 3520, label: 'Spectrometer Dark Cal' },
        { id: 't-6', type: 'DOWNLINK_DATA', startSec: 4200, endSec: 4800, targetStationId: 'GS_NRSC', label: 'NRSC Shadnagar Pass' }
      ]);

      const [logs, setLogs] = useState([
        { time: 'T+00:10', type: 'INFO', text: 'SATOPS Flight Operations Bus initialized. All subsystems online.' },
        { time: 'T+01:00', type: 'SUCCESS', text: 'Keplerian orbit vector locked. Ephemeris propagation stable.' },
        { time: 'T+02:00', type: 'INFO', text: 'Telemetry Beacon heartbeat verified over Ground Station array.' }
      ]);

      const orbitState = useMemo(() => calculateOrbitState(missionTimeSec), [missionTimeSec]);

      const groundContacts = useMemo(() => {
        return GROUND_STATIONS.map(gs => {
          const look = calculateLookAngles(orbitState.latDeg, orbitState.lonDeg, orbitState.altKm, gs.lat, gs.lon);
          const isJammed = anomalies.rotorJamStationId === gs.id;
          return {
            ...gs,
            elevationDeg: look.elevationDeg,
            azimuthDeg: look.azimuthDeg,
            slantRangeKm: look.slantRangeKm,
            inContact: look.inContact && !isJammed,
            isJammed
          };
        });
      }, [orbitState, anomalies]);

      const activeContact = groundContacts.find(c => c.inContact) || null;
      const activeTasks = tasks.filter(t => missionTimeSec >= t.startSec && missionTimeSec <= t.endSec);

      useEffect(() => {
        if (!isPlaying) return;

        const interval = setInterval(() => {
          const stepSec = 1 * timeMultiplier;
          
          setMissionTimeSec(prev => {
            const nextTime = (prev + stepSec) % ORBITAL_PARAMS.periodSeconds;
            
            const curOrbit = calculateOrbitState(nextTime);
            const solarGen = curOrbit.isSunlit ? POWER_SPECS.solarGenerationSunlightWatts * solarArrayEfficiency : 0.0;
            
            const runningTasks = tasks.filter(t => nextTime >= t.startSec && nextTime <= t.endSec);
            const taskPower = runningTasks.reduce((sum, t) => sum + (POWER_SPECS.tasks[t.type]?.powerWatts || 0), 0);
            const totalLoad = POWER_SPECS.baseLoadWatts + taskPower;
            
            const netPowerWatts = solarGen - totalLoad;
            const energyDeltaWSec = netPowerWatts * stepSec;
            
            setBatteryPercent(curBatt => {
              const deltaPercent = (energyDeltaWSec / POWER_SPECS.batteryCapacityWattSec) * 100;
              return Math.min(100, Math.max(5, parseFloat((curBatt + deltaPercent).toFixed(2))));
            });

            const storageDelta = runningTasks.reduce((sum, t) => sum + ((POWER_SPECS.tasks[t.type]?.storageRateMBps || 0) * stepSec), 0);
            if (storageDelta !== 0) {
              setStorageUsedMB(curStorage => {
                return Math.min(storageCapacityMB, Math.max(10, parseFloat((curStorage + storageDelta).toFixed(1))));
              });
            }

            return nextTime;
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [isPlaying, timeMultiplier, solarArrayEfficiency, tasks]);

      const addLog = (text, type = 'INFO') => {
        setLogs(prev => [{ time: formatTime(missionTimeSec), type, text }, ...prev.slice(0, 49)]);
      };


      // =========================================================================
      // AI FLIGHT SYSTEMS SHARED STATE LAYER
      // =========================================================================
      const [isVoiceEnabled, setIsVoiceEnabled] = useState(false);
      const [flightDirectorOpen, setFlightDirectorOpen] = useState(true);
      const [activeVivaModal, setActiveVivaModal] = useState(false);
      const [vivaMissionData, setVivaMissionData] = useState(null);

      // Voice Narration
      const speakRecommendation = useCallback((text) => {
        if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const cleanText = text.replace(/<[^>]*>?/gm, '');
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.rate = 1.05;
          utterance.pitch = 0.95;
          window.speechSynthesis.speak(utterance);
        } catch (e) {}
      }, [isVoiceEnabled]);

      // Active Mission Real-Time Tracking
      const [currentMission, setCurrentMission] = useState(() => {
        return {
          id: 'MSN-' + Math.floor(1000 + Math.random() * 9000),
          callsign: 'SATOPS-LEO-01',
          startTime: Date.now(),
          startClockSec: 0,
          minBattery: 94.5,
          maxBattery: 94.5,
          eclipsesEncountered: 0,
          groundContactsUsed: [],
          tasksCompleted: [],
          ruleViolations: [],
          fdRecommendations: [
            {
              id: 'rec-init',
              time: 'T+00:00',
              level: 'INFO',
              title: 'FLIGHT BUS INITIALIZED',
              message: 'AI Flight Director monitoring orbital state. All sensors nominal.',
              action: 'Maintain nominal attitude'
            }
          ],
          latestSummary: null
        };
      });

      // Dynamic Mission Confidence Calculation (Real-Time Physics & Safety)
      const missionConfidence = useMemo(() => {
        let conf = 98;
        if (batteryPercent < 20) conf -= 45;
        else if (batteryPercent < 30) conf -= 25;
        else if (batteryPercent < 50) conf -= 12;
        else if (batteryPercent < 70) conf -= 5;

        const runningTasks = tasks.filter(t => missionTimeSec >= t.startSec && missionTimeSec <= t.endSec);
        if (!orbitState.isSunlit && runningTasks.length > 0) {
          const heavyTask = runningTasks.some(t => (POWER_SPECS.tasks[t.type]?.powerWatts || 0) > 10);
          conf -= (heavyTask ? 16 : 8);
        }

        if (anomalies && anomalies.rotorJamStationId) conf -= 20;
        if (storageUsedMB > 110) conf -= 12;
        else if (storageUsedMB > 85) conf -= 5;

        if (activeContact) conf += 3;
        return Math.min(99, Math.max(30, Math.round(conf)));
      }, [batteryPercent, orbitState.isSunlit, tasks, missionTimeSec, anomalies, storageUsedMB, activeContact]);

      // Proactive AI Flight Director recommendation helper
      const addFDRecommendation = useCallback((level, title, message, action) => {
        const newRec = {
          id: 'rec-' + Date.now(),
          time: formatTime(missionTimeSec),
          level, // 'INFO', 'SUGGESTION', 'WARNING', 'CRITICAL'
          title,
          message,
          action
        };
        setCurrentMission(prev => ({
          ...prev,
          fdRecommendations: [newRec, ...prev.fdRecommendations.filter(r => r.title !== title).slice(0, 19)]
        }));
        addLog(`[FD ${level}] ${title}: ${message}`, level === 'CRITICAL' ? 'ANOMALY' : level === 'WARNING' ? 'WARNING' : 'INFO');
        speakRecommendation(`${title}. ${message}`);
      }, [missionTimeSec, speakRecommendation]);

      // Track minimum battery and events in current mission
      useEffect(() => {
        setCurrentMission(prev => {
          let updated = { ...prev };
          if (batteryPercent < prev.minBattery) updated.minBattery = batteryPercent;
          if (batteryPercent > prev.maxBattery) updated.maxBattery = batteryPercent;
          return updated;
        });
      }, [batteryPercent]);

      // Track active ground contact in current mission
      useEffect(() => {
        if (activeContact) {
          setCurrentMission(prev => {
            if (!prev.groundContactsUsed.includes(activeContact.id)) {
              return { ...prev, groundContactsUsed: [...prev.groundContactsUsed, activeContact.id] };
            }
            return prev;
          });
        }
      }, [activeContact]);

      // Proactive monitoring state refs
      const prevSunlit = useRef(orbitState.isSunlit);
      const prevContact = useRef(activeContact ? activeContact.id : null);
      const prevBattAlert = useRef(false);
      const prevTasksActive = useRef(0);

      useEffect(() => {
        // 1. Sunlit vs Eclipse transitions
        if (prevSunlit.current !== orbitState.isSunlit) {
          if (!orbitState.isSunlit) {
            addFDRecommendation(
              'SUGGESTION',
              'ORBITAL ECLIPSE ENTRY (UMBRA)',
              'The satellite is approaching eclipse. Solar charging will decrease to 0.0W, so consider reducing unnecessary power consumption.',
              'Inhibit Non-Essential Payloads'
            );
          } else {
            addFDRecommendation(
              'INFO',
              'SOLAR ILLUMINATION RESTORED',
              'Exited Earth umbra into direct sunlight. Dual GaAs arrays generating +18.0W net power. Battery replenishment active.',
              'Normal Power Mode'
            );
          }
          prevSunlit.current = orbitState.isSunlit;
        }

        // 2. Ground Station Contact transitions
        const currentContactId = activeContact ? activeContact.id : null;
        if (prevContact.current !== currentContactId) {
          if (activeContact) {
            addFDRecommendation(
              'INFO',
              'GROUND STATION VISIBLE',
              `Ground station ${activeContact.name} is now available (Elev: ${activeContact.elevationDeg.toFixed(1)}°). This is a suitable opportunity to establish communication and download telemetry.`,
              'Downlink Telemetry'
            );
          } else if (prevContact.current) {
            addFDRecommendation(
              'SUGGESTION',
              'COMMUNICATION LOSS (LOS)',
              'Communication is currently unavailable. The next ground-station visibility window should be used for recovery.',
              'Carrier Standby'
            );
          }
          prevContact.current = currentContactId;
        }

        // 3. Battery Low Warning
        if (batteryPercent < 25 && !prevBattAlert.current) {
          addFDRecommendation(
            'WARNING',
            'BATTERY LOW',
            'Battery has dropped below 25%. Consider delaying non-essential payload operations until sunlight is available.',
            'Power Conservation Mode'
          );
          prevBattAlert.current = true;
        } else if (batteryPercent >= 35) {
          prevBattAlert.current = false;
        }

        // 4. Payload Active Notification
        const runningTasks = tasks.filter(t => missionTimeSec >= t.startSec && missionTimeSec <= t.endSec);
        if (runningTasks.length > 0 && prevTasksActive.current === 0) {
          const t = runningTasks[0];
          const remainingMin = Math.max(1, Math.round((t.endSec - missionTimeSec) / 60));
          addFDRecommendation(
            'SUGGESTION',
            'PAYLOAD ACTIVE',
            `${t.label} is currently active. Estimated completion time: ${remainingMin} minutes.`,
            'Monitor OBDH Buffer'
          );
        }
        prevTasksActive.current = runningTasks.length;
      }, [orbitState.isSunlit, activeContact, batteryPercent, tasks, missionTimeSec, addFDRecommendation]);

      // Complete Active Mission & Trigger Mission Professor
      const finishMissionRun = () => {
        const durationMin = Math.max(1, Math.round(missionTimeSec / 60));
        const tasksRun = tasks.filter(t => missionTimeSec >= t.startSec);
        const minBatt = currentMission.minBattery;

        let flightScore = 70;
        if (minBatt >= 50) flightScore += 20;
        else if (minBatt >= 30) flightScore += 10;
        else if (minBatt < 20) flightScore -= 25;

        if (currentMission.groundContactsUsed.length > 0) flightScore += 10;
        if (tasksRun.length >= 3) flightScore += 10;
        flightScore = Math.min(100, Math.max(35, flightScore));

        const missionSummary = {
          ...currentMission,
          durationMin,
          flightScore,
          tasksCount: tasksRun.length,
          finalBattery: batteryPercent,
          completedAt: new Date().toISOString()
        };

        setVivaMissionData(missionSummary);
        setActiveVivaModal(true);
        addLog(`Mission ${missionSummary.id} completed. Opening Mission Professor Viva.`, 'INFO');
      };

      // Submit Viva & Finalize into Mission History
      const submitVivaResults = (vivaScore, questionsLog, professorReport) => {
        if (!vivaMissionData) return;

        const totalScore = Math.round((vivaMissionData.flightScore * 0.6) + (vivaScore * 0.4));

        const completedRecord = {
          ...vivaMissionData,
          vivaScore,
          totalScore,
          vivaQuestions: questionsLog,
          professorReport,
          dateString: new Date().toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
        };


        // Reset current mission for subsequent runs
        setCurrentMission({
          id: 'MSN-' + Math.floor(1000 + Math.random() * 9000),
          callsign: 'SATOPS-LEO-0' + (missionHistory.length + 2),
          startTime: Date.now(),
          startClockSec: 0,
          minBattery: 100,
          maxBattery: 100,
          eclipsesEncountered: 0,
          groundContactsUsed: [],
          tasksCompleted: [],
          ruleViolations: [],
          fdRecommendations: [
            {
              id: 'rec-' + Date.now(),
              time: 'T+00:00',
              level: 'INFO',
              title: 'NEW ORBITAL PASS INITIALIZED',
              message: 'Cadet cleared for subsequent orbital run. All telemetry nominal.',
              action: 'Nominal monitoring'
            }
          ],
          latestSummary: null
        });

        addLog(`Mission debrief completed. Total FRR Score: ${totalScore}/100. Debrief archived.`, 'SUCCESS');
      };

      const value = {
        view,
        setView,
        isDashboard,
        setIsDashboard,
        missionTimeSec,
        setMissionTimeSec,
        isPlaying,
        setIsPlaying,
        timeMultiplier,
        setTimeMultiplier,
        batteryPercent,
        storageUsedMB,
        storageCapacityMB,
        solarArrayEfficiency,
        setSolarArrayEfficiency,
        anomalies,
        setAnomalies,
        tasks,
        setTasks,
        orbitState,
        groundContacts,
        activeContact,
        activeTasks,
        logs,
        addLog,
        studentScore,
        drillAnswers,
        quizAnswers,
        scoreHistory,
        submitDrillAnswer,
        submitQuizAnswer,
        saveHistorySnapshot,
        resetTrainingSession,
        // AI Flight Director
        currentMission,
        setCurrentMission,

        missionConfidence,
        isVoiceEnabled,
        setIsVoiceEnabled,
        flightDirectorOpen,
        setFlightDirectorOpen,
        activeVivaModal,
        setActiveVivaModal,
        vivaMissionData,
        finishMissionRun,
        submitVivaResults,
        addFDRecommendation
      };

      return <MissionContext.Provider value={value}>{children}</MissionContext.Provider>;
    }

    function formatTime(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = Math.floor(totalSec % 60);
      return `T+${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      ctx.fillRect(0, 0, 2048, 1024);

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';

    // Dynamic Weather Cloud Texture Generator (1024x512)
    function generateCloudsTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0, 0, 0, 0)';
      ctx.fillRect(0, 0, 1024, 512);

      const cloudSystems = [
        // Equatorial Intertropical Convergence Bands
        { cx: 200, cy: 250, rx: 220, ry: 35, rot: 0.05, alpha: 0.38 },
        { cx: 650, cy: 260, rx: 260, ry: 40, rot: -0.04, alpha: 0.42 },
        // Northern Hemisphere Storm Spirals
        { cx: 220, cy: 150, rx: 160, ry: 45, rot: 0.18, alpha: 0.35 },
        { cx: 720, cy: 160, rx: 180, ry: 48, rot: -0.14, alpha: 0.36 },
        { cx: 480, cy: 120, rx: 140, ry: 38, rot: 0.10, alpha: 0.30 },
        // Southern Hemisphere Cyclonic Swirls
        { cx: 350, cy: 370, rx: 170, ry: 42, rot: -0.15, alpha: 0.34 },
        { cx: 820, cy: 380, rx: 190, ry: 44, rot: 0.12, alpha: 0.35 },
        { cx: 110, cy: 390, rx: 120, ry: 34, rot: -0.08, alpha: 0.28 }
      ];

      cloudSystems.forEach(cl => {
        ctx.save();
        ctx.translate(cl.cx, cl.cy);
        ctx.rotate(cl.rot);
        const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, cl.rx);
        grad.addColorStop(0, `rgba(255, 255, 255, ${cl.alpha})`);
        grad.addColorStop(0.5, `rgba(255, 255, 255, ${cl.alpha * 0.55})`);
        grad.addColorStop(0.8, `rgba(255, 255, 255, ${cl.alpha * 0.20})`);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, 0, cl.rx, cl.ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    // =========================================================================
    // PHOTOREALISTIC AEROSPACE SATELLITE GENERATOR (PRATHAM-II FLIGHT MODEL)
    // Procedural High-Efficiency GaAs Solar Arrays, Crinkled Gold MLI,
    // Precision Anodized Rails, Earth Observation Optics & Communications Suite

    // Procedural Solar Panel Diffuse Texture (High-Efficiency Triple-Junction GaAs Cells)
    function createSolarPanelTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#060a14';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#d49b35';
      ctx.lineWidth = 5;
      ctx.strokeRect(5, 5, 502, 502);

      ctx.fillStyle = '#94a3b8';
      for (let p = 20; p < 500; p += 40) {
        ctx.fillRect(p - 1, 4, 3, 3);
        ctx.fillRect(p - 1, 505, 3, 3);
        ctx.fillRect(4, p - 1, 3, 3);
        ctx.fillRect(505, p - 1, 3, 3);
      }

      const cols = 2;
      const rows = 4;
      const padX = 14;
      const padY = 14;
      const gap = 8;
      const cellW = (512 - padX * 2 - gap * (cols - 1)) / cols;
      const cellH = (512 - padY * 2 - gap * (rows - 1)) / rows;

      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          const x = padX + c * (cellW + gap);
          const y = padY + r * (cellH + gap);

          const grad = ctx.createLinearGradient(x, y, x + cellW, y + cellH);
          grad.addColorStop(0, '#091c42');
          grad.addColorStop(0.3, '#102d68');
          grad.addColorStop(0.7, '#14367c');
          grad.addColorStop(1, '#081735');
          ctx.fillStyle = grad;

          const ch = 7;
          ctx.beginPath();
          ctx.moveTo(x + ch, y);
          ctx.lineTo(x + cellW - ch, y);
          ctx.lineTo(x + cellW, y + ch);
          ctx.lineTo(x + cellW, y + cellH - ch);
          ctx.lineTo(x + cellW - ch, y + cellH);
          ctx.lineTo(x + ch, y + cellH);
          ctx.lineTo(x, y + cellH - ch);
          ctx.lineTo(x, y + ch);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#1b3b78';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.strokeStyle = 'rgba(210, 230, 255, 0.45)';
          ctx.lineWidth = 1;
          for (let gy = y + 7; gy < y + cellH - 4; gy += 7) {
            ctx.beginPath();
            ctx.moveTo(x + 4, gy);
            ctx.lineTo(x + cellW - 4, gy);
            ctx.stroke();
          }

          ctx.fillStyle = 'rgba(240, 245, 255, 0.92)';
          const b1 = x + cellW * 0.32;
          const b2 = x + cellW * 0.68;
          ctx.fillRect(b1 - 1.5, y + 2, 3, cellH - 4);
          ctx.fillRect(b2 - 1.5, y + 2, 3, cellH - 4);

          ctx.fillStyle = '#eab308';
          ctx.fillRect(b1 - 2.5, y - 4, 5, 5);
          ctx.fillRect(b2 - 2.5, y - 4, 5, 5);
          ctx.fillRect(b1 - 2.5, y + cellH - 1, 5, 5);
          ctx.fillRect(b2 - 2.5, y + cellH - 1, 5, 5);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      return tex;
    }

    // Procedural Gold MLI (Multi-Layer Insulation) Foil Bump Map
    function createGoldFoilBumpMap() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 350; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        const r = 6 + Math.random() * 20;
        const grad = ctx.createRadialGradient(x, y, 1, x, y, r);
        const val = Math.random() > 0.5 ? '255,255,255' : '0,0,0';
        const alpha = 0.09 + Math.random() * 0.16;
        grad.addColorStop(0, `rgba(${val}, ${alpha})`);
        grad.addColorStop(1, 'rgba(128,128,128,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < 25; i++) {
        ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.30)';
        ctx.lineWidth = 1 + Math.random() * 2;
        ctx.beginPath();
        const x1 = Math.random() * 256;
        const y1 = Math.random() * 256;
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 + (Math.random() - 0.5) * 70, y1 + (Math.random() - 0.5) * 70);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

      };

      useEffect(() => {
        if (!containerRef.current) return;
        const container = containerRef.current;
        const width = container.clientWidth || 600;
        const height = container.clientHeight || 420;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);
        camera.position.set(0, 0, 4.35);
        camera.lookAt(0, 0, 0);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.domElement.style.display = 'block';
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        // Balanced Cinematic Multi-Point Lighting
        const ambientLight = new THREE.AmbientLight(0x38bdf8, 0.20);
        scene.add(ambientLight);

        // Directional Sunlight (Solar vector from orbit)
        const sunPos = new THREE.Vector3(6.0, 4.0, 5.0);
        const sunLight = new THREE.DirectionalLight(0xfff8ee, 1.85);
        sunLight.position.copy(sunPos);
        scene.add(sunLight);

        // Soft Space Fill Light
        const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.35);
        fillLight.position.set(-6.0, 1.5, 2.0);
        scene.add(fillLight);

        // Earth Albedo Light (Atmosphere & ocean reflection illuminating spacecraft underside)
        const earthAlbedoLight = new THREE.DirectionalLight(0x2288cc, 0.40);
        earthAlbedoLight.position.set(0, -1.0, 0);
        scene.add(earthAlbedoLight);

        // NASA High-Resolution Photorealistic Earth Texture Maps with Vercel & Offline Fallback
        const texLoader = new THREE.TextureLoader();
        texLoader.crossOrigin = 'anonymous';
        const earthRadius = 1.28;

        // Instant Procedural Earth Canvas Texture (0ms, 100% resilient fallback)
        function createProceduralEarthMap() {
          const c = document.createElement('canvas');
          c.width = 2048; c.height = 1024;
          const ctx = c.getContext('2d');
          const grad = ctx.createLinearGradient(0, 0, 0, 1024);
          grad.addColorStop(0, '#0a2342'); grad.addColorStop(0.25, '#0d3663');
          grad.addColorStop(0.5, '#134b7f'); grad.addColorStop(0.75, '#0d3663'); grad.addColorStop(1, '#0a2342');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, 2048, 1024);
          
          // Landmasses (Eurasia, Africa, Americas, Australia, India)
          ctx.fillStyle = '#225a38';
          ctx.beginPath();
          ctx.ellipse(1100, 480, 280, 180, 0.2, 0, Math.PI * 2);
          ctx.ellipse(1360, 360, 320, 160, -0.1, 0, Math.PI * 2);
          ctx.ellipse(1240, 460, 100, 80, 0.4, 0, Math.PI * 2);
          ctx.ellipse(1560, 720, 120, 90, 0.3, 0, Math.PI * 2);
          ctx.ellipse(520, 360, 160, 140, -0.3, 0, Math.PI * 2);
          ctx.ellipse(640, 660, 120, 200, 0.3, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#8a795d';
          ctx.beginPath();
          ctx.ellipse(1160, 380, 140, 70, 0.1, 0, Math.PI * 2);
          ctx.ellipse(500, 380, 60, 120, 0.2, 0, Math.PI * 2);
          ctx.ellipse(600, 650, 40, 180, 0.2, 0, Math.PI * 2);
          ctx.ellipse(1300, 340, 100, 50, 0.0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#e2e8f0';
          ctx.fillRect(0, 0, 2048, 70); ctx.fillRect(0, 954, 2048, 70);
          const t = new THREE.CanvasTexture(c);
          t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
          return t;
        }

        function createProceduralNightMap() {
          const c = document.createElement('canvas');
          c.width = 2048; c.height = 1024;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#02040a'; ctx.fillRect(0, 0, 2048, 1024);
          ctx.fillStyle = '#ffcc66';
          const clusters = [[1120, 380, 60], [1320, 340, 80], [1230, 460, 50], [530, 360, 70], [560, 400, 60], [640, 680, 40], [1560, 720, 30], [1050, 280, 50]];
          clusters.forEach(([cx, cy, r]) => {
            for (let i = 0; i < 70; i++) {
              const rx = cx + (Math.random() - 0.5) * r * 2;
              const ry = cy + (Math.random() - 0.5) * r * 1.5;
              ctx.fillRect(rx, ry, Math.random() > 0.7 ? 2 : 1, Math.random() > 0.7 ? 2 : 1);
            }
          });
          const t = new THREE.CanvasTexture(c);
          t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
          return t;
        }

        function createProceduralCloudsMap() {
          const c = document.createElement('canvas');
          c.width = 1024; c.height = 512;
          const ctx = c.getContext('2d');
          ctx.clearRect(0, 0, 1024, 512);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.40)';
          for (let y = 80; y < 450; y += 40) {
            for (let x = 0; x < 1024; x += 60) {
              if (Math.sin(x * 0.02 + y * 0.03) > 0.1) {
                ctx.beginPath();
                ctx.ellipse(x + (Math.random()-0.5)*30, y + (Math.random()-0.5)*20, 40 + Math.random()*30, 15 + Math.random()*15, Math.random()*0.4, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
          const t = new THREE.CanvasTexture(c);
          t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
          return t;
        }

        function loadTextureSafe(urls, initialFallbackTex) {
          const texture = initialFallbackTex;
          let idx = 0;
          function tryFetch() {
            if (idx >= urls.length) return;
            const path = urls[idx++];
            texLoader.load(
              path,
              (loaded) => {
                texture.image = loaded.image;
                texture.needsUpdate = true;
              },
              undefined,
              () => { tryFetch(); }
            );
          }
          tryFetch();
          return texture;
        }

        const dayMap = loadTextureSafe([
          'assets/earth_day.jpg',
          '/assets/earth_day.jpg',
          'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg',
          'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
        ], createProceduralEarthMap());

        const nightMap = loadTextureSafe([
          'assets/earth_night.png',
          '/assets/earth_night.png',
          'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_lights_2048.png',
          'https://unpkg.com/three-globe/example/img/earth-night.jpg'
        ], createProceduralNightMap());

        const specMap = loadTextureSafe([
          'assets/earth_specular.jpg',
          '/assets/earth_specular.jpg',
          'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_specular_2048.jpg'
        ], createProceduralNightMap());

        const cloudsMap = loadTextureSafe([
          'assets/earth_clouds.png',
          '/assets/earth_clouds.png',
          'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_clouds_1024.png'
        ], createProceduralCloudsMap());

        // 1. High-Fidelity Photorealistic 3D Earth Globe (NASA Blue Marble + Night Lights + Specular Ocean Glint)
        const earthMat = new THREE.ShaderMaterial({
          uniforms: {
            uDayMap: { value: dayMap },
            uNightMap: { value: nightMap },
            uSpecMap: { value: specMap },
            uSunDirection: { value: sunPos.clone().normalize() }
          },
          vertexShader: `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            varying vec3 vViewDir;

            void main() {
              vUv = uv;
              vec4 worldPos = modelMatrix * vec4(position, 1.0);
              vWorldPos = worldPos.xyz;
              vNormal = normalize(mat3(modelMatrix) * normal);
              vViewDir = normalize(cameraPosition - worldPos.xyz);
              gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
          `,
          fragmentShader: `
            uniform sampler2D uDayMap;
            uniform sampler2D uNightMap;
            uniform sampler2D uSpecMap;
            uniform vec3 uSunDirection;

            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            varying vec3 vViewDir;

            void main() {
              vec3 normal = normalize(vNormal);
              vec3 sunDir = normalize(uSunDirection);
              vec3 viewDir = normalize(vViewDir);

              float sunDot = dot(normal, sunDir);
              
              // Smooth twilight terminator transition
              float dayFactor = smoothstep(-0.10, 0.18, sunDot);

              vec4 dayColor = texture2D(uDayMap, vUv);
              vec4 nightColor = texture2D(uNightMap, vUv);
              float specIntensity = texture2D(uSpecMap, vUv).r;

              // Automatic Fail-Safe: If day texture is dark/unloaded (e.g. Vercel missing asset), render realistic procedural Earth colors
              float dayLum = dot(dayColor.rgb, vec3(0.299, 0.587, 0.114));
              if (dayLum < 0.02) {
                float lat = abs(vUv.y - 0.5) * 2.0;
                vec3 oceanBlue = mix(vec3(0.06, 0.28, 0.60), vec3(0.03, 0.14, 0.35), lat);
                vec3 landGreen = vec3(0.18, 0.44, 0.24);
                vec3 mountainBrown = vec3(0.48, 0.42, 0.30);
                vec3 iceWhite = vec3(0.92, 0.95, 0.98);
                float landPattern = sin(vUv.x * 18.0) * cos(vUv.y * 14.0) + sin(vUv.x * 36.0 + vUv.y * 24.0) * 0.35;
                vec3 procLand = mix(landGreen, mountainBrown, smoothstep(0.2, 0.5, landPattern));
                vec3 procColor = mix(oceanBlue, procLand, smoothstep(0.12, 0.28, landPattern));
                if (lat > 0.86) procColor = mix(procColor, iceWhite, smoothstep(0.86, 0.93, lat));
                dayColor = vec4(procColor, 1.0);
              }

              // Physically inspired Ocean Specular Glint (sun reflection on oceans only)
              vec3 halfVec = normalize(sunDir + viewDir);
              float specAngle = max(dot(normal, halfVec), 0.0);
              float specular = pow(specAngle, 64.0) * specIntensity * max(0.0, sunDot) * 0.85;

              // Day diffuse surface with natural solar illumination
              vec3 diffuseDay = dayColor.rgb * (max(sunDot, 0.0) * 0.95 + 0.06);

              // Night city lights (warm golden constellations on dark continents)
              vec3 nightLights = (nightColor.rgb * vec3(3.2, 2.6, 1.6) + vec3(0.015, 0.025, 0.045)) * (1.0 - dayFactor);

              // Surface blending
              vec3 surfaceColor = mix(nightLights, diffuseDay + vec3(specular) * vec3(0.95, 0.98, 1.0), dayFactor);

              // Atmospheric Rayleigh limb scattering along planetary curve
              float fresnel = 1.0 - max(dot(normal, viewDir), 0.0);
              float limbIntensity = pow(fresnel, 3.2);
              vec3 limbColor = vec3(0.24, 0.66, 1.0) * limbIntensity * (max(sunDot * 0.65 + 0.35, 0.08) * 1.3);

              gl_FragColor = vec4(surfaceColor + limbColor, 1.0);
            }
          `
        });

        const earthGeo = new THREE.SphereGeometry(earthRadius, 64, 64);
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earthMesh);
        earthMeshRef.current = earthMesh;

        // 2. Realistic Dynamic Cloud Layer with Natural Sunlight Shading & Drift
        const cloudMat = new THREE.ShaderMaterial({
          uniforms: {
            uCloudMap: { value: cloudsMap },
            uSunDirection: { value: sunPos.clone().normalize() }
          },
          vertexShader: `
            varying vec2 vUv;
            varying vec3 vNormal;
            void main() {
              vUv = uv;
              vNormal = normalize(mat3(modelMatrix) * normal);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D uCloudMap;
            uniform vec3 uSunDirection;
            varying vec2 vUv;
            varying vec3 vNormal;

            void main() {
              vec4 cloudTex = texture2D(uCloudMap, vUv);
              float sunDot = dot(normalize(vNormal), normalize(uSunDirection));
              float dayFactor = smoothstep(-0.15, 0.20, sunDot);
              
              // Solar illumination on clouds
              float light = max(0.05, dayFactor * 0.95 + 0.05);
              vec3 cloudColor = vec3(1.0, 1.0, 1.0) * light;
              // True alpha transparency from RGBA channel
              float alpha = cloudTex.a * (0.28 + dayFactor * 0.42);
              
              gl_FragColor = vec4(cloudColor, alpha);
            }
          `,
          transparent: true,
          depthWrite: false,
          blending: THREE.NormalBlending
        });

        const cloudGeo = new THREE.SphereGeometry(earthRadius + 0.014, 64, 64);
        const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
        scene.add(cloudMesh);
        cloudMeshRef.current = cloudMesh;

        // 3. Atmospheric Rayleigh Blue Limb Halo (Planetary Corona)
        const haloGeo = new THREE.SphereGeometry(earthRadius + 0.045, 64, 64);
        const haloMat = new THREE.ShaderMaterial({
          vertexShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            void main() {
              vNormal = normalize(normalMatrix * normal);
              vec4 worldPos = modelMatrix * vec4(position, 1.0);
              vViewDir = normalize(cameraPosition - worldPos.xyz);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            varying vec3 vNormal;
            varying vec3 vViewDir;
            void main() {
              float intensity = pow(0.65 - dot(vNormal, vViewDir), 2.8);
              gl_FragColor = vec4(0.25, 0.68, 1.0, 1.0) * intensity * 0.85;
            }
          `,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false
        });
        const atmosMesh = new THREE.Mesh(haloGeo, haloMat);
        scene.add(atmosMesh);
        atmosMeshRef.current = atmosMesh;

        // 4. Orbital Ring Track (53° Inclination, Centered at 0,0,0)
        const orbitRadius = 2.15;
        const ringGeo = new THREE.RingGeometry(orbitRadius - 0.012, orbitRadius + 0.012, 128);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.70
        });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = 53 * (Math.PI / 180);
        scene.add(ringMesh);

        // 5. Ground Station Surface Beacons (On Earth Surface)
        const pinsGroup = new THREE.Group();
        pinsGroupRef.current = pinsGroup;
        const gsPositions = {};

        GROUND_STATIONS.forEach(gs => {
          const phi = (90 - gs.lat) * (Math.PI / 180);
          const theta = (gs.lon + 180) * (Math.PI / 180);
          const r = earthRadius;
          const x = - (r * Math.sin(phi) * Math.cos(theta));
          const z = (r * Math.sin(phi) * Math.sin(theta));
          const y = (r * Math.cos(phi));
          gsPositions[gs.id] = new THREE.Vector3(x, y, z);

          // Ground Station Pin
          const pinGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.18, 8);
          const pinColor = gs.id === 'GS_SVL' ? 0xf43f5e : (gs.id === 'GS_IITM' ? 0x10b981 : 0xf59e0b);
          const pinMat = new THREE.MeshBasicMaterial({ color: pinColor });
          const pinMesh = new THREE.Mesh(pinGeo, pinMat);
          pinMesh.position.set(x, y, z);
          pinMesh.lookAt(0, 0, 0);
          pinsGroup.add(pinMesh);

          // Radar Coverage Ring on Earth Surface
          const radarRingGeo = new THREE.RingGeometry(0.04, 0.12, 18);
          const radarRingMat = new THREE.MeshBasicMaterial({
            color: pinColor,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.65
          });
          const radarRing = new THREE.Mesh(radarRingGeo, radarRingMat);
          radarRing.position.set(x * 1.01, y * 1.01, z * 1.01);
          radarRing.lookAt(x * 2, y * 2, z * 2);
          pinsGroup.add(radarRing);
        });
        scene.add(pinsGroup);

        // 6. Detailed 3D Spacecraft Model with Cinematic Precision Scaling
        const { satGroup, ledMesh, ledHalo } = createDetailedCubeSat();
        satGroup.scale.set(0.24, 0.24, 0.24);
        scene.add(satGroup);

        // 7. Sleek Nadir Optical Sensor Footprint Scanner Cone
        // Truncated optical beam widening from sensor aperture (0.04) down to Earth (0.32)
        const footprintConeGeo = new THREE.CylinderGeometry(0.04, 0.32, 4.35, 32, 1, true);
        const footprintConeMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.15,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const footprintCone = new THREE.Mesh(footprintConeGeo, footprintConeMat);
        footprintCone.rotation.x = -Math.PI / 2;
        footprintCone.position.z = 2.175;
        satGroup.add(footprintCone);

        // 8. Dynamic RF Tracking Line
        const beamMat = new THREE.LineBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.9 });
        const beamGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        const beamLine = new THREE.Line(beamGeo, beamMat);
        scene.add(beamLine);

        // 9. Trailing Orbit Comet Ribbon
        const trailLength = 24;
        const trailPositions = new Float32Array(trailLength * 3);
        const trailGeo = new THREE.BufferGeometry();
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        const trailMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.65 });
        const trailLine = new THREE.Line(trailGeo, trailMat);
        scene.add(trailLine);

        // Interactive Mouse Drag to Rotate & Wheel to Zoom
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        const onPointerDown = (e) => {
          isDragging = true;
          prevMouse = { x: e.clientX, y: e.clientY };
        };

        const onPointerMove = (e) => {
          if (!isDragging) return;
          const deltaX = e.clientX - prevMouse.x;
          const deltaY = e.clientY - prevMouse.y;
          
          earthMesh.rotation.y += deltaX * 0.008;
          cloudMesh.rotation.y += deltaX * 0.008;
          atmosMesh.rotation.y += deltaX * 0.008;
          pinsGroup.rotation.y += deltaX * 0.008;
          
          prevMouse = { x: e.clientX, y: e.clientY };
        };

        const onPointerUp = () => { isDragging = false; };
        
        const onWheel = (e) => {
          e.preventDefault();
          camera.position.z = Math.min(6.5, Math.max(2.5, camera.position.z + e.deltaY * 0.004));
        };

        container.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        container.addEventListener('wheel', onWheel, { passive: false });

        // ResizeObserver for dynamic, responsive pixel-perfect centering
        const updateDimensions = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          if (w > 0 && h > 0) {
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h, false);
          }
        };
        const ro = new ResizeObserver(updateDimensions);
        ro.observe(container);
        requestAnimationFrame(updateDimensions);

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);

          // Smooth Globe & Cloud Auto-Rotation
          if (!isDragging && camModeRef.current === 'globe') {
            earthMesh.rotation.y += 0.0016;
            cloudMesh.rotation.y += 0.0022; // Clouds swirl slightly faster than Earth
            atmosMesh.rotation.y += 0.0016;
            pinsGroup.rotation.y += 0.0016;
          }

          // Propagate Satellite in 3D Keplerian Orbit (53° Inclination)
          const incRad = 53 * (Math.PI / 180);
          const angle = (Date.now() * 0.0006) % (Math.PI * 2);
          const satX = Math.cos(angle) * orbitRadius;
          const satZ = Math.sin(angle) * orbitRadius * Math.cos(incRad);
          const satY = Math.sin(angle) * orbitRadius * Math.sin(incRad);
          satGroup.position.set(satX, satY, satZ);

          // Nadir Pointing: Satellite optical axis looks at Earth center (0,0,0)
          satGroup.lookAt(0, 0, 0);

          // Blinking LED beacon
          const isBlink = (Date.now() % 1000) > 400;
          ledMesh.visible = isBlink;
          if (ledHalo) ledHalo.visible = isBlink;

          // Update Trailing Comet Ribbon
          for (let i = trailLength - 1; i > 0; i--) {
            trailPositions[i * 3] = trailPositions[(i - 1) * 3];
            trailPositions[i * 3 + 1] = trailPositions[(i - 1) * 3 + 1];
            trailPositions[i * 3 + 2] = trailPositions[(i - 1) * 3 + 2];
          }
          trailPositions[0] = satX;
          trailPositions[1] = satY;
          trailPositions[2] = satZ;
          trailGeo.attributes.position.needsUpdate = true;

          // Update Dynamic RF Beam Line
          const curActive = activeContactRef.current;
          if (curActive && gsPositions[curActive.id]) {
            const rawGsPos = gsPositions[curActive.id].clone();
            rawGsPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), pinsGroup.rotation.y);
            
            const positions = new Float32Array([
              rawGsPos.x, rawGsPos.y, rawGsPos.z,
              satX, satY, satZ
            ]);
            beamLine.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            beamLine.visible = true;
          } else {
            beamLine.visible = false;
          }

          // Camera Dynamic Positioning based on Selected Camera Mode
          if (camModeRef.current === 'satellite') {
            const satPos = new THREE.Vector3(satX, satY, satZ);
            const satDir = satPos.clone().normalize();
            const normal = new THREE.Vector3(0, Math.cos(incRad), -Math.sin(incRad));
            const tangent = new THREE.Vector3().crossVectors(normal, satDir).normalize();
            
            const targetCamPos = satPos.clone()
              .add(satDir.clone().multiplyScalar(0.42))
              .add(tangent.clone().multiplyScalar(0.45))
              .add(normal.clone().multiplyScalar(0.22));
            camera.position.lerp(targetCamPos, 0.08);
            camera.lookAt(satX, satY, satZ);
          } else if (camModeRef.current === 'ground' && curActive && gsPositions[curActive.id]) {
            const rawGsPos = gsPositions[curActive.id].clone();
            rawGsPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), pinsGroup.rotation.y);
            const gsCamPos = rawGsPos.clone().multiplyScalar(2.1).add(new THREE.Vector3(0, 0.4, 0));
            camera.position.lerp(gsCamPos, 0.08);
            camera.lookAt(satX, satY, satZ);
          } else {
            if (!isDragging && Math.abs(camera.position.x) > 0.05 || Math.abs(camera.position.y) > 0.05) {
              const defaultPos = new THREE.Vector3(0, 0, 4.35);
              camera.position.lerp(defaultPos, 0.06);
            }
            camera.lookAt(0, 0, 0);
          }

          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(reqId);
          ro.disconnect();
          container.removeEventListener('pointerdown', onPointerDown);
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
          container.removeEventListener('wheel', onWheel);
          renderer.dispose();
        };
      }, []);

      return (
        <div className="space-y-3">
          {/* Card Top Control Row: Title & Camera Switcher Bar */}
          <div className="flex flex-wrap items-center justify-between gap-3 border-b-2 border-[#0b0f19] pb-3">
            <div className="flex items-center gap-2">
              <span className="font-display font-black text-sm uppercase tracking-wider text-[#0b0f19]">
                3D CUBESAT ORBIT TRACKER
              </span>

            </div>

            {/* Non-overlapping Camera Switcher Buttons */}

                {/* RIGHT ARM */}
                <g>

                  <ellipse cx="66" cy="138" rx="10" ry="7" fill="none" stroke="#0b0f19" strokeWidth="2.4" transform="rotate(-12 66 138)"/>
                  <ellipse cx="64" cy="146" rx="12" ry="8" fill="#ffffff" stroke="#0b0f19" strokeWidth="3"/>
                  <path d="M 60 150 Q 56 160 58 168 M 66 152 Q 64 162 66 170 M 70 150 Q 72 160 74 166 M 74 148 Q 78 156 80 162" stroke="#0b0f19" strokeWidth="2.6" strokeLinecap="round"/>
                </g>

                {/* LEFT ARM */}
                <g>
                  <path d="M 144 104 Q 166 112 185 128 L 194 118 Q 174 102 152 98 Z" fill="url(#astroSuitJSX)" stroke="#0b0f19" strokeWidth="3.4" strokeLinejoin="round"/>
                  <ellipse cx="178" cy="128" rx="12" ry="9" fill="none" stroke="#0b0f19" strokeWidth="2.6" transform="rotate(42 178 128)"/>
                  <ellipse cx="198" cy="132" rx="14" ry="10" fill="#ffffff" stroke="#0b0f19" strokeWidth="3.2" transform="rotate(38 198 132)"/>
                  <ellipse cx="208" cy="136" rx="11" ry="9" fill="url(#astroSuitJSX)" stroke="#0b0f19" strokeWidth="3"/>
                  <path d="M 215 130 Q 228 126 233 132 M 213 136 Q 224 136 227 144 M 207 141 Q 216 149 214 155 M 200 141 Q 206 150 202 155 M 218 124 Q 230 119 234 125" stroke="#0b0f19" strokeWidth="2.6" strokeLinecap="round"/>
                </g>

                {/* HELMET & VISOR */}
                <g>
                  <ellipse cx="112" cy="70" rx="40" ry="38" fill="#ffffff" stroke="#0b0f19" strokeWidth="4.2"/>
                  <path d="M 83 94 Q 112 106 140 92" stroke="#0b0f19" strokeWidth="4" strokeLinecap="round"/>
                  <path d="M 85 97 Q 112 109 139 95" stroke="#0b0f19" strokeWidth="1.8" strokeLinecap="round"/>

                  <ellipse cx="114" cy="70" rx="31" ry="29" fill="none" stroke="#0b0f19" strokeWidth="2.4"/>

                  {/* Glossy Visor Dome */}
                  <ellipse cx="116" cy="72" rx="26" ry="24" fill="#0b0f19" stroke="#0b0f19" strokeWidth="3"/>

                  {/* Specular White Visor Reflection */}
                  <path d="M 97 56 Q 116 47 133 58 Q 120 51 101 60 Z" fill="#ffffff"/>
                  <ellipse cx="108" cy="62" rx="14" ry="6" fill="#ffffff" transform="rotate(-28 108 62)"/>
                  <path d="M 97 83 Q 116 89 135 83" stroke="#ffffff" strokeWidth="2.2" strokeLinecap="round" opacity="0.8"/>

            </div>
          </div>

          {/* ================= CENTER 3D HEADLINE & BUTTONS (EXACT TEXT PRESERVED) ================= */}
          <div className={`relative z-50 w-full max-w-6xl mx-auto flex flex-col items-center justify-center text-center space-y-6 ${entered ? 'anim-entry-up delay-300' : 'opacity-0'}`}>

            {/* 3D Extruded Title — centered horizontally */}
            <div className={`w-full flex justify-center ${entered ? 'anim-title delay-200' : 'opacity-0'}`}>
              <h1
                className="hero-3d-title text-[3.2rem] sm:text-[4.0rem] md:text-[5.0rem] lg:text-[6.0rem] xl:text-[6.8rem] 2xl:text-[7.4rem] tracking-tight text-center leading-[0.88] px-2"
                style={{
                  transform: `perspective(1200px) rotateX(${-mousePos.y * 2.5}deg) rotateY(${mousePos.x * 2.5}deg)`
                }}

                  if (setIsDashboard) setIsDashboard(true);
                  setView('planner');
                }}

              >

                <span>→</span>

              <button
                onClick={() => {
                  if (setIsDashboard) setIsDashboard(true);
                  setView('drills');
                }}
                className="btn-neo bg-white text-[#0b0f19] px-7 py-3 text-xs sm:text-sm font-display font-black uppercase tracking-wider flex items-center space-x-2 shadow-[3px_3px_0px_#0b0f19] hover:shadow-[5px_5px_0px_#0b0f19] hover:-translate-x-0.5 hover:-translate-y-0.5 transition-all duration-150 cursor-pointer"
              >
